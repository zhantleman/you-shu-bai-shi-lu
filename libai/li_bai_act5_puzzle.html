<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ===== 第五幕《意象之择》专属样式 ===== */
        
        body.act-bg {
            background-image: url('../images/moonlit-river.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .act5-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 30px;
            min-height: calc(100vh - 120px);
        }

        /* ===== 开场画面 ===== */
        .act5-intro {
            text-align: center;
            padding: 60px 40px;
            animation: act5FadeIn 1.2s ease-out;
        }

        @keyframes act5FadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .act5-intro-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 12px rgba(168,85,247,0.4));
        }

        .act5-intro-title {
            font-size: 2rem;
            font-weight: 800;
            color: #e8b4f8;
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(232,180,248,0.3);
        }

        .act5-intro-subtitle {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.9;
            max-width: 520px;
            margin: 0 auto 36px;
        }

        .act5-intro-btn {
            padding: 14px 48px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124,58,237,0.3);
        }

        .act5-intro-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(124,58,237,0.45);
        }

        /* ===== 回顾轮次 ===== */
        .act5-round {
            display: none;
            animation: act5SlideIn 0.6s ease-out;
        }
        
        .act5-round.active {
            display: block;
        }

        @keyframes act5SlideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .act5-round-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .act5-round-num {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(91,33,182,0.15));
            border: 1px solid rgba(124,58,237,0.35);
            border-radius: 24px;
            color: #c084fc;
            font-weight: bold;
            font-size: 1rem;
        }

        .act5-round-progress {
            display: flex;
            gap: 8px;
        }

        .act5-progress-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .act5-progress-dot.done { background: #51cf66; border-color: #51cf66; }
        .act5-progress-dot.current { 
            background: #e8b4f8; 
            border-color: #e8b4f8;
            box-shadow: 0 0 8px rgba(232,180,248,0.5);
            animation: pulseDot 1.5s infinite;
        }
        @keyframes pulseDot {
            0%,100%{ box-shadow:0 0 8px rgba(232,180,248,0.5); }
            50%{ box-shadow:0 0 16px rgba(232,180,248,0.8); }
        }

        .act5-round-body {
            display: flex;
            gap: 28px;
            align-items: stretch;
        }

        @media (max-width: 700px) {
            .act5-round-body { flex-direction: column; }
        }

        /* 左侧：回放卡片 */
        .act5-replay-card {
            flex: 1;
            min-width: 0;
            background: linear-gradient(145deg, rgba(0,0,0,0.35), rgba(0,0,0,0.18));
            border: 1px solid rgba(232,180,248,0.18);
            border-radius: 16px;
            padding: 26px 22px;
            position: relative;
        }

        .act5-replay-label {
            font-size: 0.78rem;
            color: rgba(232,180,248,0.55);
            letter-spacing: 3px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .act5-replay-text {
            font-size: 1rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.85;
        }

        .act5-replay-text .hl {
            color: #e8b4f8;
            font-weight: bold;
        }

        .act5-replay-text .res-icon {
            font-size: 1.15em;
            margin: 0 2px;
        }

        /* 右侧：心法抉择 */
        .act5-choice-panel {
            flex: 1.15;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .act5-choice-label {
            font-size: 0.78rem;
            color: rgba(232,180,248,0.55);
            letter-spacing: 3px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .act5-choice-btn {
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 20px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .act5-choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0, rgba(232,180,248,0.08), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .act5-choice-btn:hover {
            border-color: rgba(232,180,248,0.35);
            transform: translateY(-2px);
        }

        .act5-choice-btn:hover::before { opacity: 1; }

        .act5-choice-btn.choice-a:hover {
            border-color: rgba(81,207,102,0.45);
            box-shadow: 0 4px 20px rgba(81,207,102,0.12);
        }

        .act5-choice-btn.choice-b:hover {
            border-color: rgba(255,107,107,0.45);
            box-shadow: 0 4px 20px rgba(255,107,107,0.12);
        }

        .act5-choice-btn.selected {
            border-color: #e8b4f8 !important;
            background: linear-gradient(145deg, rgba(232,180,248,0.1), rgba(232,180,248,0.03)) !important;
            box-shadow: 0 0 20px rgba(232,180,248,0.15) !important;
        }

        .act5-choice-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .choice-a .act5-choice-tag {
            background: rgba(81,207,102,0.15);
            color: #51cf66;
            border: 1px solid rgba(81,207,102,0.25);
        }

        .choice-b .act5-choice-tag {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.25);
        }

        .act5-choice-title {
            font-size: 1.08rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .act5-choice-desc {
            font-size: 0.92rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.65;
        }

        /* ===== 结果页面 ===== */
        .act5-result {
            display: none;
            text-align: center;
            animation: act5ResultIn 1s ease-out;
        }

        .act5-result.active { display: block; }

        @keyframes act5ResultIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .act5-result-banner {
            font-size: 1rem;
            color: rgba(232,180,248,0.6);
            letter-spacing: 5px;
            margin-bottom: 16px;
        }

        .act5-result-tag {
            display: inline-block;
            padding: 10px 32px;
            background: linear-gradient(135deg, rgba(232,180,248,0.12), rgba(168,85,247,0.08));
            border: 2px solid rgba(232,180,248,0.4);
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #e8b4f8;
            margin-bottom: 24px;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(232,180,248,0.2);
        }

        .act5-result-comment {
            max-width: 480px;
            margin: 0 auto 36px;
            padding: 24px 28px;
            background: rgba(0,0,0,0.3);
            border-left: 3px solid rgba(232,180,248,0.5);
            border-radius: 0 12px 12px 0;
            text-align: left;
        }

        .act5-result-comment-label {
            font-size: 0.82rem;
            color: rgba(232,180,248,0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .act5-result-comment-text {
            font-size: 1.03rem;
            color: rgba(255,255,255,0.88);
            line-height: 2;
            font-style: italic;
        }

        .act5-result-summary {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .act5-result-chip {
            padding: 8px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.65);
        }

        .act5-cert-btn {
            padding: 16px 48px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #e8b4f8, #a855f7);
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(168,85,247,0.3);
        }

        .act5-cert-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(168,85,247,0.45);
        }
    </style>
</head>
<body class="act-bg" style="background-image: url('../images/wuhou-temple.jpeg');">

    <script src="../js/common.js"></script>
    <script>
    // ================================================================
    //  第五幕《意象之择》—— 诗风赋予仪式
    // ================================================================

    // ---- 从第四幕读取数据（通过localStorage的soulData） ----
    let gameData = null;

    function loadGameData() {
        const soulData = getSoulData();
        const sd = soulData['liBai'] || {};
        
        // 尝试从 localStorage 补充详细数据
        let levelMatchResults = sd.levelMatchResults || [];
        if (levelMatchResults.length === 0) {
            try {
                const liBaiState = JSON.parse(localStorage.getItem('liBaiState') || '{}');
                levelMatchResults = liBaiState.levelMatchResults || [];
            } catch(e) {}
        }

        gameData = {
            poetryCount: sd.poem || 0,
            wineCount: sd.wine || 0,
            totalScore: sd.totalScore || 0,
            ending: sd.ending || '凡夫',
            levelMatchResults: levelMatchResults
        };

        // 更新顶部属性显示
        document.getElementById('stat-poetry').textContent = gameData.poetryCount;
        document.getElementById('stat-wine').textContent = gameData.wineCount;
        document.getElementById('stat-total').textContent = gameData.totalScore;
    }

    // ---- 关卡名称映射 ----
    const LEVEL_NAMES = ['山水对', '颜色/方位对', '器物/动作对'];
    const QUALITY_LABEL = { core: '核心', loose: '宽泛' };
    const QUALITY_ICON = { core: '✅', loose: '🟠' };

    // ---- 三轮心法配置 ----
    const ROUND_CONFIGS = [
        {
            title: '山水关',
            replayBuilder: (data) => buildReplayText(data, 0),
            choices: {
                A: {
                    tag: '工整为上',
                    title: '格律严谨方显功力',
                    desc: '一字不苟，对仗工整。近体诗之美，正在于严守法度、字斟句酌之间。'
                },
                B: {
                    tag: '意境为先',
                    title: '以意驭字不拘小节',
                    desc: '意境到位即是好诗。古人云「不以辞害意」，灵气逼人远胜刻板雕琢。'
                }
            }
        },
        {
            title: '颜色关',
            replayBuilder: (data) => buildReplayText(data, 1),
            choices: {
                A: {
                    tag: '循规蹈矩',
                    title: '规矩之中见真章',
                    desc: '按部就班，严守法度。色彩与方位的对应自有其理，遵循方能得体。'
                },
                B: {
                    tag: '灵光乍现',
                    title: '信手拈来浑然天成',
                    desc: '灵感所至便是佳作。真正的好诗句，往往是妙手偶得、浑然天成的。'
                }
            }
        },
        {
            title: '器物关',
            replayBuilder: (data) => buildReplayText(data, 2),
            choices: {
                A: {
                    tag: '典雅端庄',
                    title: '华美工整追求极致',
                    desc: '华丽而不失庄重，工整中见气魄。此乃盛唐遗风，大雅之音也。'
                },
                B: {
                    tag: '豪放不羁',
                    title: '大气磅礴洒脱自如',
                    desc: '狂放之中见真性情。正如吾之诗，「黄河之水天上来」，何须拘泥小节！'
                }
            }
        }
    ];

    // ---- 回放文案生成器 ----
    function buildReplayText(data, roundIndex) {
        const rr = data.levelMatchResults[roundIndex];
        
        if (!rr || !rr.slotDetails || rr.slotDetails.length === 0) {
            // 无真实数据 → 预设模板
            const templates = [
                `第${roundIndex + 1}关【${LEVEL_NAMES[roundIndex]}】：<span class="hl">意象选择</span>阶段。你在众多词卡中甄选出最契合的意象，每一字都承载着你的审美倾向。`,
                `第${roundIndex + 1}关【${LEVEL_NAMES[roundIndex]}】：<span class="hl">对仗构建</span>的关键时刻。你需要在格律与灵感之间找到平衡。`,
                `第${roundIndex + 1}关【${LEVEL_NAMES[roundIndex]}】：<span class="hl">最终抉择</span>的前奏。此时此刻的选择，将映照出你内心的诗风取向。`
            ];
            return templates[roundIndex] || templates[0];
        }

        // 有真实数据 → 展示玩家实际选词
        const wordTexts = rr.slotDetails.map(s => s.text).join(' / ');
        const perfectIcons = rr.slotDetails.map(s => 
            s.quality === 'core' ? '<span style="color:#51cf66">✅</span>' : 
            s.quality === 'loose' ? '<span style="color:#ffa940">🟠</span>' : ''
        ).join(' ');

        let text = `第${roundIndex + 1}关【${LEVEL_NAMES[roundIndex]}】：你选择了 <span class="hl">${wordTexts}</span>`;
        text += `<br><span style="font-size:0.9em;color:rgba(255,255,255,0.6)">品质标记：${perfectIcons}</span>`;
        
        if (rr.perfectCount === rr.slotDetails.length) {
            text += `<br><br><span style="color:#51cf66">全核心意象命中！你的选择精准而典雅。</span>`;
        } else if (rr.allMatched) {
            text += `<br><br><span style="color:#ffd700">意象搭配成功，虽非全核心，亦有可取之处。</span>`;
        } else {
            text += `<br><br><span style="color:#ff6b6b">意象搭配尚有欠缺，但每一次尝试都是积累。</span>`;
        }

        return text;
    }

    // ---- 人格矩阵（4类主型 × 2种变体 = 8标签）----
    const PERSONALITY_MATRIX = {
        AAA: { tag: '格律宗师', variant: '清', comment: '善哉！汝作诗严守格律，字斟句酌，已得近体诗之精髓。若能稍添几分逸兴，便可登峰造极。来，饮此杯，助汝诗兴大发！' },
        AAB: { tag: '典丽诗人', variant: '清', comment: '可嘉。汝诗意典雅，工整中不失灵动。既有法度，又有情怀，颇具晚唐风致。再多饮几杯，诗笔当更飘逸。' },
        ABA: { tag: '典丽诗人', variant: '清', comment: '可嘉。汝诗意典雅，工整中不失灵动。既有法度，又有情怀，颇具晚唐风致。再多饮几杯，诗笔当更飘逸。' },
        BAA: { tag: '典丽诗人', variant: '清', comment: '可嘉。汝诗意典雅，工整中不失灵动。既有法度，又有情怀，颇具晚唐风致。再多饮几杯，诗笔当更飘逸。' },
        ABB: { tag: '灵动才子', variant: '狂', comment: '妙哉！汝才思敏捷，不拘一格。虽未必严守格律，然灵气逼人，正如吾少年时，倚马可待。满饮此杯！' },
        BAB: { tag: '灵动才子', variant: '狂', comment: '妙哉！汝才思敏捷，不拘一格。虽未必严守格律，然灵气逼人，正如吾少年时，倚马可待。满饮此杯！' },
        BBA: { tag: '灵动才子', variant: '狂', comment: '妙哉！汝才思敏捷，不拘一格。虽未必严守格律，然灵气逼人，正如吾少年时，倚马可待。满饮此杯！' },
        BBB: { tag: '豪放仙客', variant: '狂', comment: '妙极！汝之诗风，竟与吾如此相似！不拘一格，天马行空。来，满饮此杯，你我便是有缘人！今夜月色正好，当浮一大白！' }
    };

    // 偏"诗"时的"清"变体覆盖
    const VARIANT_QING_OVERRIDES = {
        '格律宗师': { tag: '清韵宗师',   comment: '善哉！汝作诗清丽脱俗，格律谨严而不失空灵。如山间清泉，澄澈见底，又如秋夜明月，皎洁无瑕。此等境界，令吾亦心生向往。' },
        '典丽诗人': { tag: '清雅墨客',   comment: '可嘉。汝诗风清雅，落笔从容。不急不躁，自有一番书卷气息。若能再添几分豪情，便可谓之完美了。' },
        '灵动才子': { tag: '清逸骚客',   comment: '有趣。汝于灵动之中别具清逸之气，不染俗尘。这般性子，倒让吾想起了孟浩然那老头子。也好也好，清逸亦是难得的境界。' },
        '豪放仙客': { tag: '清狂醉仙',   comment: '奇哉！明明豪放不羁，却又透着一股清绝之意。汝这人，有意思！既有狂放的骨架，又不失清澈的灵魂——来，咱俩干一杯！' }
    };

    // 偏"酒"时的"狂"变体覆盖
    const VARIANT_KUANG_OVERRIDES = {
        '格律宗师': { tag: '狂律怪杰',   comment: '奇了！汝一面死守格律，一面又狂放不羁。这等矛盾的结合体，吾平生仅见！莫非汝是那种「酒后写诗格外工整」的怪才？哈哈，有趣！' },
        '典丽诗人': { tag: '狂儒诗豪',   comment: '哈！汝看似温文尔雅，骨子里却藏着一股狂劲。典丽的外表下是奔涌的诗情，像极了吾当年在长安醉酒赋诗的模样！' },
        '灵动才子': { tag: '狂放浪子',   comment: '哈哈哈哈！汝这家伙，跟吾简直是一个模子里刻出来的！才思敏捷，狂放不羁，嗜酒如命——来来来，今日相逢即是缘，不醉不归！' },
        '豪放仙客': { tag: '谪仙传人',   comment: '天哪天呀！汝……汝简直就是吾年轻时候的翻版！一样的狂，一样的傲，一样地视功名如粪土！快，快拜吾为师！这杯酒，吾干了，汝随意！' }
    };

    // ---- 状态管理 ----
    let currentRound = 0;      // 当前轮次 0/1/2
    let choices = [];           // 存储每轮选择 ['A','B','A']

    // ---- 页面初始化 ----
    document.addEventListener('DOMContentLoaded', function() {
        clearActStateOnFreshEntry('liBaiState');
        loadGameData();
        renderIntro();
    });

    // ===== 渲染函数 =====

    /** 开场画面 */
    function renderIntro() {
        const root = document.getElementById('act5-root');
        root.innerHTML = `
            <div class="act5-intro">
                <div class="act5-intro-icon">🌙</div>
                <div class="act5-intro-title">意 象 之 择</div>
                <div class="act5-intro-subtitle">
                    方才品诗，选词落笔。<br>
                    然其中取舍，汝可自知？<br>
                    且看这三关意象，以此窥见汝之诗风。
                </div>
                <button class="act5-intro-btn" onclick="startReview()">入座品评</button>
            </div>
        `;
    }

    /** 进入回顾流程 */
    function startReview() {
        currentRound = 0;
        choices = [];
        renderRound();
    }

    /** 渲染某一轮 */
    function renderRound() {
        const root = document.getElementById('act5-root');
        const cfg = ROUND_CONFIGS[currentRound];
        if (!cfg) { showResult(); return; }

        const replayText = cfg.replayBuilder(gameData);

        // 进度条
        let dotsHtml = '';
        for (let i = 0; i < 3; i++) {
            let cls = 'act5-progress-dot';
            if (i < currentRound) cls += ' done';
            else if (i === currentRound) cls += ' current';
            dotsHtml += `<div class="${cls}"></div>`;
        }

        root.innerHTML = `
            <div class="act5-round active">
                <div class="act5-round-header">
                    <div class="act5-round-num">⚡ 第 ${currentRound + 1} 关 · ${cfg.title}</div>
                    <div class="act5-round-progress">${dotsHtml}</div>
                </div>
                <div class="act5-round-body">
                    <div class="act5-replay-card">
                        <div class="act5-replay-label">📜 意象回放</div>
                        <div class="act5-replay-text">${replayText}</div>
                    </div>
                    <div class="act5-choice-panel">
                        <div class="act5-choice-label">💡 诗风抉择</div>
                        <div class="act5-choice-btn choice-a" onclick="makeChoice('A')">
                            <div class="act5-choice-tag">${cfg.choices.A.tag}</div>
                            <div class="act5-choice-title">${cfg.choices.A.title}</div>
                            <div class="act5-choice-desc">${cfg.choices.A.desc}</div>
                        </div>
                        <div class="act5-choice-btn choice-b" onclick="makeChoice('B')">
                            <div class="act5-choice-tag">${cfg.choices.B.tag}</div>
                            <div class="act5-choice-title">${cfg.choices.B.title}</div>
                            <div class="act5-choice-desc">${cfg.choices.B.desc}</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    /** 做出选择 */
    function makeChoice(choice) {
        choices.push(choice);

        // 视觉反馈
        const btns = document.querySelectorAll('.act5-choice-btn');
        btns.forEach(b => b.classList.remove('selected'));
        const selectedBtn = document.querySelector(`.choice-${choice.toLowerCase()}`);
        if (selectedBtn) selectedBtn.classList.add('selected');

        // 短暂延迟后进入下一轮或结果
        setTimeout(() => {
            currentRound++;
            if (currentRound >= 3) {
                showResult();
            } else {
                renderRound();
            }
        }, 600);
    }

    /** 计算人格结果 */
    function calculatePersonality() {
        // 选择组合字符串 e.g. "AAB"
        const combo = choices.join('');
        
        // 基础人格（从矩阵）
        let base = PERSONALITY_MATRIX[combo];
        if (!base) base = PERSONALITY_MATRIX['AAB']; // fallback

        // ★ 加权因子：诗/酒比例决定"清"或"狂"变体
        const poetry = gameData.poetryCount || 0;
        const wine = gameData.wineCount || 0;
        const total = poetry + wine;
        
        let finalTag, finalComment;
        
        if (total > 0) {
            const poetryRatio = poetry / total;
            
            if (poetryRatio >= 0.67) {
                // 偏诗 → "清"变体
                const override = VARIANT_QING_OVERRIDES[base.tag];
                if (override) {
                    finalTag = override.tag;
                    finalComment = override.comment;
                } else {
                    finalTag = base.tag;
                    finalComment = base.comment;
                }
            } else if (wine >= poetry * 1.5) {
                // 偏酒 → "狂"变体
                const override = VARIANT_KUANG_OVERRIDES[base.tag];
                if (override) {
                    finalTag = override.tag;
                    finalComment = override.comment;
                } else {
                    finalTag = base.tag;
                    finalComment = base.comment;
                }
            } else {
                // 接近均衡 → 保持原标签
                finalTag = base.tag;
                finalComment = base.comment;
            }
        } else {
            finalTag = base.tag;
            finalComment = base.comment;
        }

        return {
            combo,
            tag: finalTag,
            comment: finalComment,
            aCount: choices.filter(c => c === 'A').length,
            bCount: choices.filter(c => c === 'B').length,
            poetryCount: gameData.poetryCount,
            wineCount: gameData.wineCount,
            totalScore: gameData.totalScore,
            ending: gameData.ending
        };
    }

    /** 显示结果页 */
    function showResult() {
        const result = calculatePersonality();
        const root = document.getElementById('act5-root');

        root.innerHTML = `
            <div class="act5-result active">
                <div class="act5-result-banner">— 诗风判定 —</div>
                <div class="act5-result-tag">${result.tag}</div>
                
                <div class="act5-result-comment">
                    <div class="act5-result-comment-label">🍷 太白判词</div>
                    <div class="act5-result-comment-text">"${result.comment}"</div>
                </div>

                <div class="act5-result-summary">
                    <div class="act5-result-chip">选择组合：${result.combo}</div>
                    <div class="act5-result-chip">格律派 ${result.aCount} · 意境派 ${result.bCount}</div>
                    <div class="act5-result-chip">📜 诗心 ${result.poetryCount} · 🍶 酒意 ${result.wineCount}</div>
                    <div class="act5-result-chip">第四幕得分：${result.totalScore}</div>
                </div>

                <button class="act5-cert-btn" onclick="goToCert()">📜 领取结业证书</button>
            </div>
        `;

        // 将结果存入全局供证书页使用
        window.__act5Result = result;
    }

    /** 跳转证书页 */
    function goToCert() {
        // ★ 标记李白线通关（第五幕完成）
        saveProgress('liBai', 5);
        checkAllHeroesAchievement();
        unlockAchievement('libai_complete', '诗仙之旅', '完成李白线全五幕通关', '🍶');
        
        const r = window.__act5Result;
        if (!r) { goToCertFallback(); return; }

        const params = new URLSearchParams({
            hero: '李白',
            title: r.tag,
            poem: r.poetryCount || 0,
            wine: r.wineCount || 0,
            personalityTag: r.tag,
            comment: r.comment
        });
        window.location.href = '../certificate.html?' + params.toString();
    }

    /** 无结果时的降级跳转 */
    function goToCertFallback() {
        const params = new URLSearchParams({
            hero: '李白',
            title: '青莲传人',
            poem: gameData.poetryCount || 0,
            wine: gameData.wineCount || 0
        });
        window.location.href = '../certificate.html?' + params.toString();
    }
    </script>
    <script src="../js/level-select.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('liBai', 5));</script>
</body>
</html>
