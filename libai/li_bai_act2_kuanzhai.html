<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李白线 · 第二幕 · 宽窄巷子</title>
    <link rel="icon" type="image/svg+xml" href="../genie.svg">
    <meta name="description" content="李白线第二幕 - 宽窄巷子·鲁班茶肆">
    
    <!-- 引用公共CSS -->
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- 李白线公共CSS -->
    <link rel="stylesheet" href="../css/hero-styles.css">
    <!-- 选关系统CSS -->
    <link rel="stylesheet" href="../css/level-select.css">
</head>
<body class="act-bg has-notebook" style="background-image: url('../images/kuanzhai-alley.jpeg');">
    <!-- 页面顶部 — 固定顶栏 -->
    <div class="li-bai-header">
        <div class="hero-header">
            <div class="hero-info">
                <h1 class="hero-name">
                    <img class="hero-name-avatar" src="../images/libai-avatar-game.png" alt="李白">
                    李白 · 青莲剑仙
                </h1>
                <p class="hero-title">诗酒剑意 · 宽窄巷子·鲁班茶肆</p>
            </div>

            <div class="stats-container" id="li-bai-stats">
                <div class="li-bai-stat">
                    <div class="stat-icon">📜</div>
                    <div class="stat-label">诗心</div>
                    <div class="stat-value" id="stat-poetry">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">🍶</div>
                    <div class="stat-label">酒意</div>
                    <div class="stat-value" id="stat-wine">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-label">探索</div>
                    <div class="stat-value" id="stat-explored">0/2</div>
                </div>
            </div>

            <div class="act-indicator">
                <div class="act-number" id="act-number">2</div>
                <div class="act-text">第 <span id="act-text">二</span> 幕</div>
            </div>

            <!-- 返回首页按钮已移除，由选关面板取代 -->
        </div>
    </div>
    
    <!-- 游戏主内容 -->
    <div class="container">
        <!-- 剧情对话区域 -->
        <div class="game-scene" id="dialogue-scene">
            <div class="dialogue-container">
                <h3 class="scene-title" id="scene-title">第二幕 · 宽窄巷子·鲁班茶肆</h3>
                
                <div id="dialogue-log" class="dialogue-log">
                    <!-- 对话内容会由JavaScript动态添加 -->
                </div>
                
                <div class="li-bai-options" id="li-bai-options">
                    <!-- 选项按钮会由JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引用公共JavaScript -->
    <script src="../js/common.js"></script>
    
    <!-- 选关系统JS -->
    <script src="../js/level-select.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('liBai', 2));</script>
    
    <!-- 李白线第二幕特有JavaScript -->
    <script>
        // 李白线状态变量
        const liBaiState = {
            currentAct: 2,                // 当前幕数
            currentStep: 'opening',       // 当前步骤：opening/explore/quiz/choice
            quizScore: 0,                 // 知识验证答对数
            poetryCount: 0,               // 诗心数量
            wineCount: 0,                 // 酒意数量
            exploredOptions: {            // 探索选项是否已点
                option1: false,
                option2: false
            },
            hasWineGift: false,           // 是否获得了侠客行礼物
            actPoetryChoices: 0,          // 本幕诗意选择次数
            actWineChoices: 0,             // 本幕酒意选择次数
            _isAnswering: false             // 防重复点击锁
        };
        
        // ==================== 页面初始化 ====================
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('李白线第二幕页面已加载');
            
            // 如果是fresh进入，清除旧状态使对话从头开始
            clearActStateOnFreshEntry('liBaiState');
            
            // 加载李白线状态
            loadLiBaiState();
            
            // 开始第二幕
            startLiBaiSecondAct();
            
            // 绑定事件
            bindLiBaiEvents();
        });
        
        // ==================== 状态管理 ====================
        
        // 加载李白线状态
        function loadLiBaiState() {
            try {
                const savedState = localStorage.getItem('liBaiState');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    Object.assign(liBaiState, parsed);
                }
                
                // 加载诗心和酒意
                liBaiState.poetryCount = parseInt(localStorage.getItem('liBai_poetryCount')) || 0;
                liBaiState.wineCount = parseInt(localStorage.getItem('liBai_wineCount')) || 0;
                liBaiState.hasWineGift = localStorage.getItem('liBai_hasWineGift') === 'true';
                
                // 已通关？加载最终属性并锁定（回看模式）
                if (isHeroLineCompleted('liBai')) {
                    const final = getHeroFinalAttrs('liBai');
                    if (final) {
                        liBaiState.poetryCount = final.poem;
                        liBaiState.wineCount = final.wine;
                        liBaiState._locked = true;
                    }
                }
                
                updateLiBaiStats();
                console.log('李白线状态已加载', liBaiState._locked ? '(锁定模式)' : '');
            } catch (error) {
                console.error('加载李白线状态失败:', error);
            }
        }
        
        // 保存李白线状态
        function saveLiBaiState() {
            try {
                localStorage.setItem('liBaiState', JSON.stringify(liBaiState));
                localStorage.setItem('liBai_poetryCount', liBaiState.poetryCount);
                localStorage.setItem('liBai_wineCount', liBaiState.wineCount);
                localStorage.setItem('liBai_hasWineGift', liBaiState.hasWineGift);
                
                // 同时保存到全局状态
                gameState.stats.poem = liBaiState.poetryCount;
                gameState.stats.wine = liBaiState.wineCount;
                saveGameState();
                
                console.log('李白线状态已保存');
            } catch (error) {
                console.error('保存李白线状态失败:', error);
            }
        }
        
        // 更新李白线状态显示
        function updateLiBaiStats() {
            document.getElementById('stat-poetry').textContent = liBaiState.poetryCount;
            document.getElementById('stat-wine').textContent = liBaiState.wineCount;
            
            // 计算已探索数量
            const exploredCount = (liBaiState.exploredOptions.option1 ? 1 : 0) + 
                                 (liBaiState.exploredOptions.option2 ? 1 : 0);
            document.getElementById('stat-explored').textContent = `${exploredCount}/2`;
            
            // 更新幕数显示
            document.getElementById('act-number').textContent = liBaiState.currentAct;
            const actText = ['一', '二', '三', '四'][liBaiState.currentAct - 1] || liBaiState.currentAct;
            document.getElementById('act-text').textContent = actText;
        }
        
        // ==================== 打字机队列系统 ====================
        
        let _typeQueue = [];
        let _isTyping = false;
        
        // 等待打字机队列完全空闲（防止选项在打字中途弹出）
        function waitForTypeQueueEmpty() {
            return new Promise(resolve => {
                function check() {
                    if (_typeQueue.length === 0 && !_isTyping) {
                        resolve();
                    } else {
                        setTimeout(check, 50);
                    }
                }
                check();
            });
        }
        
        function _processTypeQueue() {
            if (_isTyping || _typeQueue.length === 0) return;
            _isTyping = true;
            
            const job = _typeQueue.shift();
            document.body.classList.add('typing-active');
            document.body.classList.remove('choice-showing', 'choice-hovering');  /* 打字开始 → 移除选项亮化 */
            job.messageDiv.classList.add('li-bai-message-typing');
            
            let charIndex = 0;
            const pureTextLength = job.rawText.replace(/<[^>]*>/g, '').length;
            const baseSpeed = pureTextLength < 20 ? 80 : (pureTextLength < 50 ? 55 : 45);
            
            function typeNextChar() {
                if (charIndex >= job.rawChars.length) {
                    // 打字完成
                    job.cursorSpan.style.display = 'none';
                    job.messageDiv.classList.remove('li-bai-message-typing');
                    
                    if (_typeQueue.length === 0) {
                        document.body.classList.remove('typing-active');
                        _isTyping = false;
                    } else {
                        _processTypeQueue();  // 立即处理下一条
                    }
                    
                    // ★关键修复★ 用完整HTML回填：innerHTML逐步拼接会导致浏览器
                    // 自动闭合未闭合标签，使 keyword span 变空、文字外泄
                    job.targetSpan.innerHTML = job.rawText;

                    // 刷新关键词绑定
                    if (typeof refreshKeywordSpans === 'function') refreshKeywordSpans();
                    
                    job.resolve();
                    return;
                }
                
                const item = job.rawChars[charIndex++];
                job.targetSpan.innerHTML += item.value;
                
                const dialogueLog = document.getElementById('dialogue-log');
                dialogueLog.scrollTop = dialogueLog.scrollHeight;
                
                let delay = baseSpeed;
                if (item.type === 'char' && '，。！？、；：'.includes(item.value)) delay = baseSpeed + 150;
                else if (item.type === 'char' && item.value === ' ') delay = baseSpeed - 10;
                
                setTimeout(typeNextChar, delay);
            }
            
            setTimeout(typeNextChar, 100);
        }
        
        // ==================== 剧情逻辑 ====================
        
        // 李白线第二幕开始
        async function startLiBaiSecondAct() {
            liBaiState.currentAct = 2;
            liBaiState.currentStep = 'opening';
            liBaiState.exploredOptions = { option1: false, option2: false };
            liBaiState.actPoetryChoices = 0;   // ★ 每幕重置
            liBaiState.actWineChoices = 0;      // ★ 每幕重置
            liBaiState._isAnswering = false;    // ★ 防重复锁重置
            
            // 清空对话日志
            const dialogueLog = document.getElementById('dialogue-log');
            dialogueLog.innerHTML = '';
            
            // 更新状态显示
            updateLiBaiStats();
            
            // 播放开场白
            await addLiBaiDialogue("走，小子，随我去宽窄巷子。此地藏着一家'鲁班茶肆'，乃全国首家王者荣耀文创店，有趣得紧。你听那巷子深处，有流水声掩着老墙，似<span class=\"keyword\" data-id=\"libai_2_1\" data-name=\"白苇挂满东窗\">白苇挂满东窗</span>。", '李白');
            
            // 进入探索阶段
            liBaiState.currentStep = 'explore';
            await enterExploreStep();
            
            saveLiBaiState();
        }
        
        // 添加李白线对话（带真实逐字打字机效果 + 队列串行）
        function addLiBaiDialogue(text, speaker) {
            const dialogueLog = document.getElementById('dialogue-log');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = speaker === '李白' ? 'li-bai-message' : 'player-message';
            
            const speakerName = speaker === '李白' ? '李白' : '玩家';
            messageDiv.innerHTML = `<strong>${speakerName}：</strong> <span class="type-target"></span><span class="type-cursor">▍</span>`;
            
            dialogueLog.appendChild(messageDiv);
            dialogueLog.scrollTop = dialogueLog.scrollHeight;
            
            // 确保对话历史已初始化
            if (!Array.isArray(gameState.dialogueHistory)) {
                gameState.dialogueHistory = [];
            }
            
            // 保存到对话历史
            gameState.dialogueHistory.push({
                text: text,
                speaker: speaker === '李白' ? 'hero' : 'player',
                heroName: speaker,
                timestamp: new Date().toISOString()
            });
            
            // 保存对话历史
            try {
                localStorage.setItem('game_dialogue_history', JSON.stringify(gameState.dialogueHistory));
            } catch (error) {
                console.error('保存对话历史失败:', error);
            }
            
            const targetSpan = messageDiv.querySelector('.type-target');
            const cursorSpan = messageDiv.querySelector('.type-cursor');
            
            // 非李白消息：直接显示，返回已完成的 Promise
            if (speaker !== '李白') {
                targetSpan.innerHTML = text;
                cursorSpan.style.display = 'none';
                return Promise.resolve();
            }
            
            // 李白消息：入队并返回 Promise
            const rawChars = [];
            let i = 0;
            while (i < text.length) {
                if (text[i] === '<') {
                    let tagEnd = text.indexOf('>', i);
                    if (tagEnd === -1) tagEnd = text.length;
                    rawChars.push({ type: 'tag', value: text.slice(i, tagEnd + 1) });
                    i = tagEnd + 1;
                } else {
                    rawChars.push({ type: 'char', value: text[i] });
                    i++;
                }
            }
            
            return new Promise(resolve => {
                _typeQueue.push({ targetSpan, cursorSpan, messageDiv, rawChars, rawText: text, resolve });
                _processTypeQueue();
            });
        }
        
        // ==================== 异步工具 ====================
        
        // 思考气泡 — 舞台指示风格
        function addThinkingBubble(text) {
            const dialogueLog = document.getElementById('dialogue-log');
            const div = document.createElement('div');
            div.className = 'li-bai-thinking';
            div.textContent = text;
            dialogueLog.appendChild(div);
            dialogueLog.scrollTop = dialogueLog.scrollHeight;
            
            return new Promise(resolve => {
                setTimeout(() => {
                    div.classList.add('thinking-fade-out');
                    setTimeout(() => {
                        div.remove();
                        resolve();
                    }, 500);
                }, 1600);
            });
        }
        
        // 进入探索阶段
        async function enterExploreStep() {
            await addLiBaiDialogue("这鲁班茶肆有趣的很，你有什么想问的？", '李白');
            await waitForTypeQueueEmpty();
            updateLiBaiOptions();
        }
        
        // 更新李白线选项
        function updateLiBaiOptions() {
            const optionsContainer = document.getElementById('li-bai-options');
            optionsContainer.innerHTML = '';
            
            const btn1 = document.createElement('button');
            const btn2 = document.createElement('button');
            const btn3 = document.createElement('button');
            
            btn1.className = 'li-bai-option';
            btn2.className = 'li-bai-option';
            btn3.className = 'li-bai-option';
            
            // 根据当前步骤设置按钮
            switch(liBaiState.currentStep) {
                case 'explore':
                    btn1.textContent = "师傅，这茶肆开在古巷里，不卖茶卖游戏周边？";
                    btn1.setAttribute('data-type', 'poem');
                    btn1.setAttribute('data-mood', 'rational');
                    btn1.setAttribute('data-risk', 'low');
                    
                    btn2.textContent = "在这看比赛，比电竞馆还有感觉？";
                    btn2.setAttribute('data-type', 'wine');
                    btn2.setAttribute('data-mood', 'emotional');
                    btn2.setAttribute('data-risk', 'high');
                    
                    btn3.textContent = "畅饮美酒";
                    
                    // 禁用已探索的选项
                    if (liBaiState.exploredOptions.option1) {
                        btn1.disabled = true;
                        btn1.style.opacity = '0.5';
                    }
                    if (liBaiState.exploredOptions.option2) {
                        btn2.disabled = true;
                        btn2.style.opacity = '0.5';
                    }
                    
                    // 隐藏第三个按钮（用于占位）
                    btn3.style.display = 'none';
                    
                    btn1.onclick = () => exploreOption1();
                    btn2.onclick = () => exploreOption2();
                    break;
                    
                case 'quiz':
                    btn1.textContent = "观看KPL赛事";
                    btn1.setAttribute('data-risk', 'low');        // ★ 正确=绿
                    btn2.textContent = "玩木匠手工";
                    btn2.setAttribute('data-risk', 'high');       // ★ 错误=红
                    btn3.textContent = "畅饮美酒";
                    btn3.style.display = 'none';
                    
                    btn1.onclick = () => quizAnswer(true);
                    btn2.onclick = () => quizAnswer(false);
                    break;
                    
                case 'choice':
                    btn1.textContent = "此处清幽，当静心品茶，细赏古韵。";
                    btn1.setAttribute('data-type', 'poem');
                    btn1.setAttribute('data-mood', 'rational');
                    btn1.setAttribute('data-risk', 'low');
                    
                    btn2.textContent = "小二，上壶好酒！咱们边喝边看，这才痛快！";
                    btn2.setAttribute('data-type', 'wine');
                    btn2.setAttribute('data-mood', 'emotional');
                    btn2.setAttribute('data-risk', 'high');
                    
                    btn3.textContent = "前往下一站";
                    
                    // 检查选择次数上限（每幕最多2次）
                    if (liBaiState.actPoetryChoices >= 2) {
                        btn1.disabled = true;
                        btn1.style.opacity = '0.5';
                    }
                    if (liBaiState.actWineChoices >= 2) {
                        btn2.disabled = true;
                        btn2.style.opacity = '0.5';
                    }
                    
                    // 如果已经做出了选择，显示第三个按钮
                    if (liBaiState.poetryCount > 0 || liBaiState.wineCount > 0) {
                        btn3.style.display = 'inline-block';
                        btn3.onclick = nextScene;
                    } else {
                        btn3.style.display = 'none';
                    }
                    
                    btn1.onclick = () => finalChoice('poetry');
                    btn2.onclick = () => finalChoice('wine');
                    break;
            }
            
            optionsContainer.appendChild(btn1);
            optionsContainer.appendChild(btn2);
            optionsContainer.appendChild(btn3);
            
            document.body.classList.add('choice-showing');  /* 选项渲染完 → 背景变亮 */
            updateLiBaiStats();
        }
        
        // 探索选项1
        async function exploreOption1() {
            // ★ 李白说话时立即隐藏选项
            document.getElementById('li-bai-options').innerHTML = '';
            await addLiBaiDialogue("师傅，这茶肆开在古巷里，不卖茶卖游戏周边？", '玩家');
            
            await addThinkingBubble("李白摇摇手指，沉吟了一下。");     // ★ 思考
            
            await addLiBaiDialogue("非也非也！此乃'前店后厂'，前厅售周边，后院是老院子改的茶座，可饮茶观赛，风雅至极！那茶香侵过了市井喧嚣，连着老成都的烟火气。", '李白');
            
            liBaiState.exploredOptions.option1 = true;
            updateLiBaiStats();
            
            checkAllExplored();
            
            saveLiBaiState();
        }
        
        // 探索选项2
        async function exploreOption2() {
            // ★ 李白说话时立即隐藏选项
            document.getElementById('li-bai-options').innerHTML = '';
            await addLiBaiDialogue("在这看比赛，比电竞馆还有感觉？", '玩家');
            
            await addThinkingBubble("李白望向茶肆深处，似乎在回想什么。"); // ★ 思考
            
            await addLiBaiDialogue("哈哈，古宅幽深，赛事热烈，一静一动，反生妙趣。且看那盖碗茶，就着KPL的厮杀声，别有一番滋味。<span class=\"keyword\" data-id=\"libai_2_2\" data-name=\"一局挂一局\">一局挂一局</span>，如诗中对仗，远近相映，隔而不离。", '李白');
            
            liBaiState.exploredOptions.option2 = true;
            updateLiBaiStats();
            
            checkAllExplored();
            
            saveLiBaiState();
        }
        
        // 检查是否所有探索都已完成
        async function checkAllExplored() {
            const exploredCount = (liBaiState.exploredOptions.option1 ? 1 : 0) + 
                                 (liBaiState.exploredOptions.option2 ? 1 : 0);

            if (exploredCount === 2) {
                setTimeout(() => {
                    liBaiState.currentStep = 'quiz';
                    enterQuizStep();
                }, 1000);
            } else {
                await waitForTypeQueueEmpty();
                updateLiBaiOptions();
            }
        }
        
        // 验证阶段入口
        async function enterQuizStep() {
            await addLiBaiDialogue("小子，记性如何？方才所说，鲁班茶肆的'王者请坐Bar'里可以做什么？", '李白');
            liBaiState.currentStep = 'quiz';
            await waitForTypeQueueEmpty();
            updateLiBaiOptions();

            saveLiBaiState();
        }
        
        // 知识验证回答
        async function quizAnswer(isCorrect) {
            if (liBaiState._isAnswering) return;          // ★ 防重复
            liBaiState._isAnswering = true;               // ★ 加锁

            // ★ 立即隐藏选项容器，防止打字期间重复点击
            document.getElementById('li-bai-options').innerHTML = '';

            if (isCorrect) {
                await addLiBaiDialogue("观看KPL赛事", '玩家');

                await addThinkingBubble("李白满意地点头，拍了拍桌面。");  // ★ 思考

                await addLiBaiDialogue("不错！正是观赛品茶两相宜。", '李白');
                liBaiState.quizScore += 1;
            } else {
                await addLiBaiDialogue("玩木匠手工", '玩家');

                await addThinkingBubble("李白愣了一下，随即笑着摇头。");   // ★ 思考

                await addLiBaiDialogue("哈哈，鲁班茶肆虽以鲁班为名，但主要是文创和观赛，并非木匠作坊。", '李白');
            }

            liBaiState.currentStep = 'choice';
            await enterChoiceStep();

            saveLiBaiState();
        }
        
        // 终极选择阶段入口
        async function enterChoiceStep() {
            await addLiBaiDialogue("那么此情此景，你愿静心品茶，还是痛饮美酒？", '李白');
            liBaiState.currentStep = 'choice';
            await waitForTypeQueueEmpty();
            updateLiBaiOptions();

            saveLiBaiState();
        }
        
        // 最终选择
        async function finalChoice(type) {
            // ★ 李白说话时立即隐藏选项，防止重复点击
            document.getElementById('li-bai-options').innerHTML = '';

            // 检查选择次数限制（每幕每种最多2次）
            if (type === 'poetry' && liBaiState.actPoetryChoices >= 2) {
                await addLiBaiDialogue("此处清幽，当静心品茶，细赏古韵。", '玩家');
                await addLiBaiDialogue("诗心已盈满，再选便落俗了。换条路走吧！", '李白');
                await waitForTypeQueueEmpty();
                updateLiBaiOptions();
                return;
            }
            if (type === 'wine' && liBaiState.actWineChoices >= 2) {
                await addLiBaiDialogue("小二，上壶好酒！咱们边喝边看，这才痛快！", '玩家');
                await addLiBaiDialogue("酒意已酣畅，再饮怕是要醉了。换个方向？", '李白');
                await waitForTypeQueueEmpty();
                updateLiBaiOptions();
                return;
            }

            if (type === 'poetry') {
                liBaiState.actPoetryChoices += 1;

                await addLiBaiDialogue("此处清幽，当静心品茶，细赏古韵。", '玩家');

                await addThinkingBubble("李白捧起茶杯，轻轻嗅了嗅茶香。");  // ★ 思考

                if (liBaiState.actPoetryChoices === 1) {
                    // 第1次：正常回复
                    await addLiBaiDialogue("好！清茶一盏，诗心又增一分！茶色清白，日后对诗时记得这份素净。", '李白');
                } else {
                    // 第2次：彩蛋回复 + 成就
                    await addLiBaiDialogue("又是品茶？你这诗心倒是愈发沉稳了…茶亦如诗，贵在细品！", '李白');
                    if (typeof unlockAchievement === 'function') unlockAchievement('libai_poetry_repeat');
                }
                if (!liBaiState._locked) liBaiState.poetryCount += 1;
            } else {
                liBaiState.actWineChoices += 1;

                await addLiBaiDialogue("小二，上壶好酒！咱们边喝边看，这才痛快！", '玩家');

                await addThinkingBubble("李白眼中放光，提起酒壶晃了晃。");   // ★ 思考

                // 检查是否连续两幕都选择了酒
                const firstActWineChoice = parseInt(localStorage.getItem('liBai_act1_wineChoice')) || 0;

                if (firstActWineChoice > 0 && liBaiState.actWineChoices === 1) {
                    // 连续两幕选择了酒第1次 → 原有彩蛋
                    await addLiBaiDialogue("连饮两局，小子爽快！这壶'侠客行'赠你！酒烈如火，对仗时需有这份豪气。", '李白');
                    liBaiState.hasWineGift = true;
                } else if (liBaiState.actWineChoices === 1) {
                    // 第1次：正常回复（非连续饮酒）
                    await addLiBaiDialogue("哈哈！痛快！酒意又添一分！酒烈如火，对仗时需有这份豪气。", '李白');
                } else {
                    // 第2次：彩蛋回复 + 成就
                    await addLiBaiDialogue("再来一碗！小子这份豪情，倒让吾想起了当年的饮中八仙…！", '李白');
                    if (typeof unlockAchievement === 'function') unlockAchievement('libai_wine_repeat');
                }

                if (!liBaiState._locked) liBaiState.wineCount += 1;
                localStorage.setItem('liBai_act2_wineChoice', '1');
            }

            // 保存状态
            saveLiBaiState();

            // 显示第三个按钮（前往下一站）
            await waitForTypeQueueEmpty();
            updateLiBaiOptions();
        }
        
        // 前往第三幕
        async function nextScene() {
            await addLiBaiDialogue("前往下一站", '玩家');
            
            await addThinkingBubble("李白起身，朝门外走去，回头看了你一眼。"); // ★ 思考
            
            await addLiBaiDialogue("好！下一站是东郊记忆的妲己餐厅，走！", '李白');
            
            // 保存进度到第3幕
            saveProgress('liBai', 3);

            // 保存李白线状态
            saveLiBaiState();
            
            // 跳转到第三幕
            window.location.href = "li_bai_act3_dongjiao.html";
        }
        
        // ==================== 事件绑定 ====================
        
        function bindLiBaiEvents() {
            // 返回首页按钮
            // 返回首页按钮已移除（选关面板取代）
            
            // 选项悬停情感暗示 + 点击反馈
            const optionsContainer = document.getElementById('li-bai-options');
            if (optionsContainer) {
                optionsContainer.addEventListener('mouseover', function(e) {
                    const btn = e.target.closest('.li-bai-option');
                    if (!btn || btn.disabled) return;
                    document.body.classList.add('choice-hovering');  /* 悬停选项 → 环境光提亮 */
                    const mood = btn.getAttribute('data-mood');
                    if (mood === 'rational') {
                        document.body.classList.add('choice-hover-rational');
                    } else if (mood === 'emotional') {
                        document.body.classList.add('choice-hover-emotional');
                    }
                });
                optionsContainer.addEventListener('mouseout', function(e) {
                    const btn = e.target.closest('.li-bai-option');
                    if (!btn) return;
                    document.body.classList.remove('choice-hovering', 'choice-hover-rational', 'choice-hover-emotional');
                });
            }
            // 初始化游蜀笔记关键词系统
            if (typeof initNotebook === 'function') initNotebook();
            if (typeof refreshKeywordSpans === 'function') refreshKeywordSpans();
        }
    </script>
    <!-- 游蜀笔记侧边栏 -->
    <div class="notebook-sidebar" id="notebook-sidebar"></div>
    <script src="../js/notebook.js"></script>
