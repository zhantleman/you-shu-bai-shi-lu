<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李白线 · 第四幕 · 意象重构</title>
    <link rel="icon" type="image/svg+xml" href="../genie.svg">
    <meta name="description" content="李白线第四幕 - 古诗意象仿写游戏">
    
    <!-- 引用公共CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- 李白线公共CSS -->
    <link rel="stylesheet" href="../css/hero-styles.css">
    <!-- 选关系统CSS -->
    <link rel="stylesheet" href="../css/level-select.css">
    
    <style>
        /* ====== 李白头像样式 ====== */
        .hero-name-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(168, 85, 247, 0.6);
            vertical-align: middle;
            margin-right: 6px;
            flex-shrink: 0;
        }

        /* ====== 游戏容器样式 ====== */
        .poetry-game-container {
            max-width: 800px;
            margin: 30px auto;
            background: linear-gradient(135deg, rgba(20, 25, 45, 0.95), rgba(35, 40, 65, 0.92));
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(168, 85, 247, 0.15);
        }

        /* 导师装饰头像 */
        .mentor-avatar-area {
            text-align: center;
            margin-bottom: 18px;
        }
        .mentor-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(168, 85, 247, 0.5);
            background: rgba(0, 0, 0, 0.3);
            display: block;
            margin: 0 auto 6px auto;
        }
        .mentor-label {
            font-size: 0.82em;
            color: rgba(168, 85, 247, 0.7);
            letter-spacing: 2px;
        }
        
        .game-title-area {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .game-title {
            font-size: 1.6em;
            color: #A855F7;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            margin-bottom: 6px;
        }
        
        .game-subtitle {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.6);
        }
        
        /* ====== 关卡信息栏 ====== */
        .level-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .level-1 { background: linear-gradient(135deg, #2e7d32, #4caf50); color: #fff; }
        .level-2 { background: linear-gradient(135deg, #e65100, #ff9800); color: #fff; }
        .level-3 { background: linear-gradient(135deg, #b71c1c, #f44336); color: #fff; }
        
        .timer-display {
            font-size: 1.4em;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .timer-display.warning { color: #ff5252; animation: pulse 0.5s ease infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .score-display {
            font-size: 1em;
            color: #ffd700;
        }
        
        /* ====== 上联区域 ====== */
        .upper-link-section {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(96, 224, 255, 0.06);
            border-radius: 10px;
            border-left: 3px solid rgba(168, 85, 247, 0.4);
        }
        
        .upper-link-label {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }
        
        .upper-link-text {
            font-size: 1.8em;
            color: #fff;
            letter-spacing: 4px;
            font-family: "KaiTi", "STKaiti", serif;
        }
        
        /* ====== 线索区域 ====== */
        .clue-section {
            margin-bottom: 18px;
            padding: 12px 16px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 8px;
            border: 1px dashed rgba(255, 215, 0, 0.3);
        }
        
        .clue-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
            color: #ffd700;
            margin-bottom: 6px;
            cursor: pointer;
        }
        
        .clue-content {
            font-size: 0.92em;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            display: none;
        }
        
        .clue-content.show { display: block; }
        
        /* ====== 已选词槽位 ====== */
        .selected-slots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 52px;
            flex-wrap: wrap;
        }
        
        .slot {
            width: 80px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(168, 85, 247, 0.1);
            border: 2px dashed rgba(168, 85, 247, 0.35);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        
        .slot.filled {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid rgba(76, 175, 80, 0.6);
            color: #fff;
            font-weight: bold;
            font-size: 1em;
        }
        
        .slot.filled:hover {
            background: rgba(244, 67, 54, 0.2);
            border-color: rgba(244, 67, 54, 0.6);
        }
        
        /* ====== 候选词网格 ====== */
        .word-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .grid-cols-10 { grid-template-columns: repeat(5, 1fr); max-width: 520px; margin: 0 auto 20px; }
        .grid-cols-12 { grid-template-columns: repeat(4, 1fr); max-width: 520px; margin: 0 auto 20px; }
        .grid-cols-16 { grid-template-columns: repeat(4, 1fr); max-width: 600px; margin: 0 auto 20px; }
        
        .word-card {
            padding: 12px 8px;
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #fff;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        
        .word-card:hover:not(.disabled):not(.selected) {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }
        
        .word-card.selected {
            opacity: 0.3;
            cursor: not-allowed;
            transform: scale(0.95);
        }
        
        .word-card.disabled {
            opacity: 0.15;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .word-card.hinted {
            background: rgba(255, 215, 0, 0.15) !important;
            border-color: rgba(255, 215, 0, 0.6) !important;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
            animation: hintGlow 1.5s ease infinite alternate;
        }
        
        @keyframes hintGlow {
            from { box-shadow: 0 0 8px rgba(255, 215, 0, 0.2); }
            to { box-shadow: 0 0 16px rgba(255, 215, 0, 0.4); }
        }
        
        /* ====== 控制栏 ====== */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .ctrl-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .ctrl-btn:hover:not(:disabled) {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.5);
        }
        
        .ctrl-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .ctrl-btn.primary {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(168, 85, 247, 0.15));
            border-color: rgba(168, 85, 247, 0.5);
        }
        
        .ctrl-btn.danger {
            background: rgba(244, 67, 54, 0.15);
            border-color: rgba(244, 67, 54, 0.4);
        }
        
        .resource-tag {
            font-size: 0.78em;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        
        /* ====== 结算弹窗 ====== */
        .result-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        
        .result-overlay.show { display: flex; }
        
        .result-panel {
            background: linear-gradient(145deg, rgba(25, 30, 55, 0.98), rgba(40, 45, 75, 0.95));
            border-radius: 20px;
            padding: 36px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: resultIn 0.4s ease;
        }
        
        @keyframes resultIn {
            from { transform: scale(0.85) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        .result-icon { font-size: 3em; margin-bottom: 12px; }
        .result-title { font-size: 1.6em; margin-bottom: 8px; }
        .result-title.good { color: #4caf50; }
        .result-title.normal { color: #ffc107; }
        .result-title.bad { color: #f44336; }
        
        .result-subtitle { color: rgba(255,255,255,0.6); font-size: 0.95em; margin-bottom: 20px; line-height: 1.6; }
        
        .result-stats {
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            font-size: 0.9em;
            color: rgba(255,255,255,0.8);
        }
        
        .result-stats p { margin: 6px 0; }
        
        .result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        
        .result-btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .result-btn.primary {
            background: linear-gradient(135deg, #A855F7, #9333EA);
            color: #000;
            font-weight: bold;
        }
        
        .result-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .result-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        
        /* ====== 关卡过渡 ====== */
        .level-transition {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 900;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .level-transition.show { display: flex; }
        
        .transition-text {
            font-size: 2em;
            color: #A855F7;
            animation: transPulse 1s ease infinite;
        }
        
        @keyframes transPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        
        .transition-sub { color: rgba(255,255,255,0.5); margin-top: 10px; }

        /* ====== 反馈动画 ====== */
        .feedback-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: bold;
            z-index: 1100;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.2s forwards;
            pointer-events: none;
        }
        
        .feedback-toast.correct { background: rgba(76, 175, 80, 0.9); color: #fff; }
        .feedback-toast.wrong { background: rgba(244, 67, 54, 0.9); color: #fff; }
        
        @keyframes toastIn { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>
    <!-- 页面顶部 — 固定顶栏 -->
    <div class="li-bai-header">
        <div class="hero-header">
            <div class="hero-info">
                <h1 class="hero-name">
                    <img class="hero-name-avatar" src="../images/libai-avatar-game.png" alt="李白" />
                    李白 · 青莲剑仙
                </h1>
                <p class="hero-title">诗酒剑意 · 意象重构</p>
            </div>

            <div class="stats-container" id="li-bai-stats">
                <div class="li-bai-stat">
                    <div class="stat-icon">📜</div>
                    <div class="stat-label">诗心</div>
                    <div class="stat-value" id="stat-poetry">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">🍶</div>
                    <div class="stat-label">酒意</div>
                    <div class="stat-value" id="stat-wine">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">📊</div>
                    <div class="stat-label">总分</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
            </div>

            <div class="act-indicator">
                <div class="act-number" id="act-number">4</div>
                <div class="act-text">第 <span id="act-text">四</span> 幕</div>
            </div>

            <!-- 返回首页按钮已移除，由选关面板取代 -->
        </div>
    </div>

    <!-- 游戏主内容 -->
    <div class="container">
        <div class="poetry-game-container" id="game-container">
            
            <!-- 导师头像区 -->
            <div class="mentor-avatar-area">
                <img class="mentor-avatar" src="../images/libai-avatar-game.png" alt="李白" />
                <div class="mentor-label">青莲导师 · 意象指引</div>
            </div>

            <!-- 标题区 -->
            <div class="game-title-area" id="title-area">
                <h2 class="game-title">第四幕 &middot; 意象重构</h2>
                <p class="game-subtitle">以心对仗，借古开新 — 选择恰当的意象完成下联</p>
            </div>
            
            <!-- 关卡信息栏 -->
            <div class="level-info-bar" id="info-bar">
                <span class="level-badge level-1" id="level-badge">第一关 · 山水对</span>
                <span class="timer-display" id="timer-display">&#9201; 40</span>
                <span class="score-display" id="score-display">得分: 0</span>
            </div>
            
            <!-- 上联区域 -->
            <div class="upper-link-section">
                <div class="upper-link-label">&#8679; 出句（上联）</div>
                <div class="upper-link-text" id="upper-link-text">溪声随晚照</div>
            </div>
            
            <!-- 线索区 -->
            <div class="clue-section" id="clue-section">
                <div class="clue-header" onclick="toggleClue()">
                    &#128161; 导师提示（点击展开）
                </div>
                <div class="clue-content" id="clue-content"></div>
            </div>
            
            <!-- 已选词槽位 -->
            <div class="selected-slots" id="selected-slots"></div>
            
            <!-- 候选词网格 -->
            <div class="word-grid grid-cols-10" id="word-grid"></div>
            
            <!-- 控制栏 -->
            <div class="control-bar">
                <button class="ctrl-btn danger" id="btn-clear" onclick="clearSelection()">
                    &#8634; 重选
                </button>
                <button class="ctrl-btn" id="btn-hint" onclick="useHint()">
                    &#128161; 诗意洞察
                    <span class="resource-tag" id="hint-cost">-1&#128218;</span>
                </button>
                <button class="ctrl-btn primary" id="btn-submit" onclick="submitAnswer()">
                    &#9989; 确认作答
                </button>
            </div>
        </div>
    </div>

    <!-- 关卡过渡遮罩 -->
    <div class="level-transition" id="level-transition">
        <div class="transition-text" id="trans-text">准备进入下一关...</div>
        <div class="transition-sub" id="trans-sub"></div>
    </div>

    <!-- 结算弹窗 -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-panel" id="result-panel">
            <div class="result-icon" id="res-icon">&#127942;</div>
            <div class="result-title" id="res-title">评价标题</div>
            <div class="result-subtitle" id="res-subtitle">评价副标题</div>
            <div class="result-stats" id="res-stats"></div>
            <div class="result-btns">
                <button class="result-btn secondary" onclick="replayGame()">再玩一次</button>
                <button class="result-btn primary" id="res-primary-btn" onclick="handlePrimaryResult()">🌙 进入意象之择</button>
            </div>
        </div>
    </div>

    <!-- 引用公共JS -->
    <script src="../js/common.js"></script>
    <!-- 选关系统JS -->
    <script src="../js/level-select.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('liBai', 4));</script>

    <!-- 第四幕古诗仿写游戏逻辑 -->
    <script>
    (function() {
        'use strict';

        // ==================== 游戏状态 ====================
        const liBaiState = {
            currentAct: 4,
            poetryCount: 0,
            wineCount: 0,
            totalScore: 0,
            levelScores: [],       // 每关得分
            currentLevel: 1,       // 当前关卡 1-3
            selectedWords: [],     // 当前已选词
            timerInterval: null,
            timeLeft: 40,
            gameComplete: false,
            hintUsed: false,
            wineShieldUsed: false
        };

        // ==================== 关卡配置数据 ====================
        // 判定规则：每个位置按 category 匹配，quality 区分核心解(core)/宽泛解(loose)/干扰(distractor)
        const LEVELS = {
            1: {
                title: '入门 · 山水对',
                badgeClass: 'level-1',
                upperLink: '溪声随晚照',
                timeLimit: 40,
                requiredSlots: 3,
                patternHint: '名词 + 动词 + 名词（水声→山景）',
                clueText: '"在宽窄巷子的茶馆，你曾听见泉水叮咚穿过石阶。上联写的是声音追随夕阳西沉，下联该用什么来承接？想想看——什么样的声音能与"溪声"相对？"',
                // 槽位规则：每个位置接受的类别
                slotRules: [
                    { index: 0, acceptCategories: ['water', 'wind', 'light'], label: '水/声/光意象' },
                    { index: 1, acceptCategories: ['motion'], label: '位移动词' },
                    { index: 2, acceptCategories: ['mountain_sky', 'scene'], label: '山/天/景' }
                ],
                words: [
                    // 核心正解 ✅
                    { text: '泉声', category: 'water', quality: 'core' },
                    { text: '潮痕', category: 'water', quality: 'core' },
                    // 宽泛可接受 ⚠️
                    { text: '松风', category: 'wind', quality: 'loose' },
                    { text: '渔火', category: 'light', quality: 'loose' },
                    // 动词（全核心）
                    { text: '带',   category: 'motion', quality: 'core' },
                    { text: '入',   category: 'motion', quality: 'core' },
                    { text: '浮',   category: 'motion', quality: 'core' },
                    { text: '连',   category: 'motion', quality: 'core' },
                    // 山天景（核心+宽泛）
                    { text: '远峰', category: 'mountain_sky', quality: 'core' },
                    { text: '暮云', category: 'mountain_sky', quality: 'core' },
                    { text: '断霞', category: 'mountain_sky', quality: 'core' },
                    { text: '烟树', category: 'scene', quality: 'loose' },
                    // 干扰词
                    { text: '书声', category: 'distractor', quality: 'none' },
                    { text: '灯火', category: 'distractor', quality: 'none' },
                    { text: '照',   category: 'distractor', quality: 'none' },
                    { text: '明',   category: 'distractor', quality: 'none' }
                ]
            },
            2: {
                title: '进阶 · 颜色/方位对',
                badgeClass: 'level-2',
                upperLink: '紫蕨爬老壁',
                timeLimit: 35,
                requiredSlots: 3,
                patternHint: '颜色名词 + 动词 + 方位名词（必须含颜色词+方位词）',
                clueText: '"东郊记忆的红砖厂房外，你见过那些攀墙而生的植物吗？上联的"紫蕨"是颜色+植物，你的下联也需要一个颜色开头。导师曾提到过青苔与白墙……"',
                slotRules: [
                    { index: 0, acceptCategories: ['color_plant'], label: '颜色+植物' },
                    { index: 1, acceptCategories: ['cling_verb'], label: '攀附动词' },
                    { index: 2, acceptCategories: ['direction_loc'], label: '方位+建筑' }
                ],
                words: [
                    // 颜色植物（全核心）
                    { text: '青藤', category: 'color_plant', quality: 'core' },
                    { text: '翠苔', category: 'color_plant', quality: 'core' },
                    { text: '朱槿', category: 'color_plant', quality: 'core' },

        // ==================== DOM 引用 ====================
        let dom = {};

        function cacheDom() {

        // ==================== 初始化 ====================
        function init() {
            clearActStateOnFreshEntry('liBaiState');
            loadLiBaiState();
            cacheDom();

            if (liBaiState.gameComplete) {
                showFinalResult();
                return;
            }

            startLevel(1);
        }

        // ==================== 状态加载/保存 ====================
        function loadLiBaiState() {
            try {
                const saved = localStorage.getItem('liBaiState');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    Object.assign(liBaiState, parsed);
                }
                liBaiState.poetryCount = parseInt(localStorage.getItem('liBai_poetryCount')) || 0;
                liBaiState.wineCount = parseInt(localStorage.getItem('liBai_wineCount')) || 0;

                // 回看模式
                if (isHeroLineCompleted('liBai')) {
                    const final = getHeroFinalAttrs('liBai');
                    if (final) {
                        liBaiState.poetryCount = final.poem;
                        liBaiState.wineCount = final.wine;
                        liBaiState._locked = true;
                    }
                }
                updateStatsDisplay();
            } catch(e) {
                console.error('加载状态失败:', e);
            }
        }

        function saveLiBaiState() {
            try {
                localStorage.setItem('liBaiState', JSON.stringify(liBaiState));
                localStorage.setItem('liBai_poetryCount', liBaiState.poetryCount);
                localStorage.setItem('liBai_wineCount', liBaiState.wineCount);
                gameState.stats.poem = liBaiState.poetryCount;
                gameState.stats.wine = liBaiState.wineCount;
                saveGameState();
            } catch(e) {
                console.error('保存状态失败:', e);
            }
        }

        function updateStatsDisplay() {
            if (!dom.statPoetry) return;
            dom.statPoetry.textContent = liBaiState.poetryCount;
            dom.statWine.textContent = liBaiState.wineCount;
            dom.statTotal.textContent = liBaiState.totalScore;
        }

        // ==================== 关卡流程控制 ====================
        function startLevel(levelNum) {
            liBaiState.currentLevel = levelNum;
            liBaiState.selectedWords = [];
            liBaiState.hintUsed = false;
            liBaiState.wineShieldUsed = false;
            const config = LEVELS[levelNum];

            // 更新UI
            dom.levelBadge.className = 'level-badge ' + config.badgeClass;
            dom.levelBadge.textContent = `第${levelNum}关 · ${config.title.split('·')[1] || config.title}`;
            dom.upperLinkText.textContent = config.upperLink;
            dom.timeLeft = config.timeLimit;
            dom.timerDisplay.innerHTML = '&#9201; ' + dom.timeLeft;
            dom.timerDisplay.classList.remove('warning');
            dom.scoreDisplay.textContent = `累计: ${liBaiState.totalScore}分`;
            dom.clueContent.textContent = config.clueText;
            dom.clueContent.classList.remove('show');

            // 提示按钮状态
            updateHintBtn();

            // 生成槽位
            renderSlots(config.requiredSlots);

            // 生成候选词网格
            renderWordGrid(config.words, levelNum);

            updateStatsDisplay();
            saveLiBaiState();

            // 启动计时
            startTimer(config.timeLimit);

            // 解锁成就
            if (levelNum === 1) unlockAchievement('libai_poetry_start', '意象初探', '进入李白第四幕·意象重构');
        }

        function startTimer(seconds) {
            stopTimer();
            liBaiState.timeLeft = seconds;
            dom.timerDisplay.innerHTML = '&#9201; ' + seconds;
            dom.timerDisplay.classList.remove('warning');

            liBaiState.timerInterval = setInterval(() => {
                liBaiState.timeLeft--;
                dom.timerDisplay.innerHTML = '&#9201; ' + liBaiState.timeLeft;

                if (liBaiState.timeLeft <= 10) {
                    dom.timerDisplay.classList.add('warning');
                }

                if (liBaiState.timeLeft <= 0) {
                    stopTimer();
                    handleTimeout();
                }
            }, 1000);
        }

        function stopTimer() {
            if (liBaiState.timerInterval) {
                clearInterval(liBaiState.timerInterval);
                liBaiState.timerInterval = null;
            }
        }

        function handleTimeout() {
            showFeedback('时间到！', 'wrong');
            setTimeout(() => {
                // 超时当作全错处理
                const config = LEVELS[liBaiState.currentLevel];
                const fakeResult = {
                    allMatched: false,
                    totalMatched: 0,
                    perfectCount: 0,
                    looseCount: 0,
                    errorCount: config.requiredSlots,
                    slotDetails: []
                };
                const levelScore = calculateLevelScore(fakeResult);
                finishLevel(levelScore, fakeResult);
            }, 1200);
        }

        // ==================== 词卡渲染与交互 ====================
        function renderSlots(count) {
            dom.selectedSlots.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                slot.textContent = `第${i + 1}字`;
                slot.onclick = () => removeWordAt(i);
                dom.selectedSlots.appendChild(slot);
            }
        }

        function renderWordGrid(words, levelNum) {
            dom.wordGrid.innerHTML = '';
            // 根据词数设置网格列数
            const colClass = words.length <= 10 ? 'grid-cols-10' :
                             words.length <= 16 ? 'grid-cols-12' : 'grid-cols-16';
            dom.wordGrid.className = 'word-grid ' + colClass;

            // 打乱顺序
            const shuffled = [...words].sort(() => Math.random() - 0.5);

            shuffled.forEach((w, idx) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.textContent = w.text;
                card.dataset.text = w.text;
                card.dataset.category = w.category;
                card.dataset.quality = w.quality;
                card.dataset.index = idx;
                card.onclick = () => selectWord(card, w);
                dom.wordGrid.appendChild(card);
            });
        }

        function selectWord(cardEl, wordData) {
            if (cardEl.classList.contains('selected') || cardEl.classList.contains('disabled')) return;

            const config = LEVELS[liBaiState.currentLevel];
            if (liBaiState.selectedWords.length >= config.requiredSlots) return;

            // 选词 — 携带 category 和 quality 用于后续判定
            liBaiState.selectedWords.push({
                text: wordData.text,
                category: wordData.category,
                quality: wordData.quality
            });
            cardEl.classList.add('selected');

            // 更新槽位显示
            updateSlotDisplay();
        }

        function removeWordAt(slotIndex) {
            if (slotIndex >= liBaiState.selectedWords.length) return;

            const removed = liBaiState.selectedWords.splice(slotIndex, 1)[0];
            // 取消对应词卡的选中态
            const cards = dom.wordGrid.querySelectorAll('.word-card');
            for (const card of cards) {
                if (card.dataset.text === removed.text && card.classList.contains('selected')) {
                    card.classList.remove('selected');
                    break;
                }
            }
            updateSlotDisplay();
        }

        function updateSlotDisplay() {
            const slots = dom.selectedSlots.querySelectorAll('.slot');
            slots.forEach((slot, i) => {
                if (i < liBaiState.selectedWords.length) {
                    slot.textContent = liBaiState.selectedWords[i].text;
                    slot.className = 'slot filled';
                } else {
                    slot.textContent = `第${i + 1}字`;
                    slot.className = 'slot';
                }
            });
        }

        function clearSelection() {
            liBaiState.selectedWords = [];
            const cards = dom.wordGrid.querySelectorAll('.word-card');
            cards.forEach(c => {
                c.classList.remove('selected');
                c.classList.remove('disabled'); // 清除屏蔽状态
            });
            updateSlotDisplay();
        }

        // ==================== 辅助功能 ====================
        function toggleClue() {
            dom.clueContent.classList.toggle('show');
        }

        function useHint() {
            if (liBaiState.hintUsed) return;
            if (liBaiState.poetryCount < 1) {
                showMessage('诗心不足！无法使用诗意洞察', 'error');
                return;
            }

            // 消耗1诗心
            liBaiState.poetryCount -= 1;
            liBaiState.hintUsed = true;

            // 高亮下一个待填位置所有合法的词（按 slotRules 匹配 category）
            const config = LEVELS[liBaiState.currentLevel];
            const nextSlotIndex = liBaiState.selectedWords.length;
            const cards = dom.wordGrid.querySelectorAll('.word-card');

            if (nextSlotIndex < config.slotRules.length) {
                const rule = config.slotRules[nextSlotIndex];
                cards.forEach(card => {
                    if (rule.acceptCategories.includes(card.dataset.category)) {
                        card.classList.add('hinted');
                    }
                });
            } else {
                // 已填满，高亮所有核心词
                cards.forEach(card => {
                    if (card.dataset.quality === 'core') {
                        card.classList.add('hinted');
                    }
                });
            }

            updateStatsDisplay();
            updateHintBtn();
            saveLiBaiState();
            showMessage('诗意洞察激活！金色光晕标记了可用的意象', 'success');
        }

        function useWineShield() {
            // 第三关专用：消耗酒意屏蔽部分干扰词
            if (liBaiState.wineShieldUsed) return;
            if (liBaiState.wineCount < 1) {
                showMessage('酒意不足！无法使用醉眼迷离', 'error');
                return;
            }

            liBaiState.wineCount -= 1;
            liBaiState.wineShieldUsed = true;

            // 按 quality === 'none' 识别干扰词，随机屏蔽一半
            const cards = dom.wordGrid.querySelectorAll('.word-card');
            let distractorCards = [];
            cards.forEach(card => {
                if (card.dataset.quality === 'none' && !card.classList.contains('selected')) {
                    distractorCards.push(card);
                }
            });

            // 随机选一半禁用
            const toBlock = Math.ceil(distractorCards.length / 2);
            for (let i = 0; i < toBlock; i++) {
                const rnd = Math.floor(Math.random() * distractorCards.length);
                distractorCards[rnd].classList.add('disabled');
                distractorCards.splice(rnd, 1);
            }

            updateStatsDisplay();
            saveLiBaiState();
            showMessage('醉眼迷离！干扰词已被模糊化', 'success');
        }

        function updateHintBtn() {
            const lvl = liBaiState.currentLevel;
            if (lvl === 1) {
                dom.btnHint.style.display = 'none'; // 第一关无辅助功能
            } else if (lvl === 2) {
                dom.btnHint.style.display = '';
                dom.btnHint.innerHTML = '&#128161; 诗意洞察<span class="resource-tag" id="hint-cost">-1&#128218;</span>';
                if (liBaiState.hintUsed || liBaiState.poetryCount < 1) {
                    dom.btnHint.disabled = true;
                } else {
                    dom.btnHint.disabled = false;
                }
            } else if (lvl === 3) {
                dom.btnHint.style.display = '';
                dom.btnHint.innerHTML = '&#127868; 醉眼迷离<span class="resource-tag" id="hint-cost">-1&#127867;</span>';
                // 第三关用酒意屏蔽
                const oldOnclick = dom.btnHint.onclick;
                dom.btnHint.onclick = useWineShield;
                if (liBaiState.wineShieldUsed || liBaiState.wineCount < 1) {
                    dom.btnHint.disabled = true;
                } else {
                    dom.btnHint.disabled = false;
                }
            }
        }

        // ==================== 提交判分（类别匹配多解模式） ====================
        function submitAnswer() {
            const config = LEVELS[liBaiState.currentLevel];
            if (liBaiState.selectedWords.length !== config.requiredSlots) {
                showMessage(`请选择 ${config.requiredSlots} 个词`, 'error');
                return;
            }

            stopTimer();

            // 逐位类别匹配判定
            const matchResult = evaluateByCategory(liBaiState.selectedWords, config);

            if (matchResult.allMatched) {
                if (matchResult.perfectCount === config.requiredSlots) {
                    showFeedback('\u2705 完美匹配！核心意象全部命中', 'correct');
                } else {
                    showFeedback(`\u2705 匹配成功！核心 ${matchResult.perfectCount}/${config.requiredSlots}`, 'correct');
                }
            } else {
                showFeedback(`\u274C 匹配度 ${matchResult.totalMatched}/${config.requiredSlots}`, 'wrong');
            }

            const levelScore = calculateLevelScore(matchResult);
            setTimeout(() => {
                finishLevel(levelScore, matchResult);
            }, 1200);
        }

        /**
         * 核心判定引擎 — 按槽位规则逐位做 category 匹配
         * 返回 { allMatched, totalMatched, perfectCount, looseCount, errorCount, slotDetails }
         */
        function evaluateByCategory(selectedWords, config) {
            let perfectCount = 0;   // 核心解匹配数
            let looseCount = 0;     // 宽泛解匹配数
            let errorCount = 0;     // 干扰/错误数
            const slotDetails = []; // 每个槽位的详情

            for (let i = 0; i < selectedWords.length; i++) {
                const word = selectedWords[i];
                const rule = config.slotRules[i];

                const isAccepted = rule.acceptCategories.includes(word.category);
                const detail = {
                    index: i,
                    text: word.text,
                    category: word.category,
                    quality: word.quality,
                    accepted: isAccepted,
                    ruleLabel: rule.label
                };
                slotDetails.push(detail);

                if (isAccepted) {
                    if (word.quality === 'core') perfectCount++;
                    else if (word.quality === 'loose') looseCount++;
                } else {
                    errorCount++;
                }
            }

            const totalMatched = perfectCount + looseCount;
            const allMatched = (totalMatched === config.requiredSlots) && (errorCount === 0);

            return { allMatched, totalMatched, perfectCount, looseCount, errorCount, slotDetails };
        }

        function calculateLevelScore(matchResult) {
            const config = LEVELS[liBaiState.currentLevel];
            const baseFull = [50, 50, 50][liBaiState.currentLevel - 1] || 50;
            let score = 0;

            if (matchResult.allMatched) {
                // 基础分
                score = baseFull;

                // 核心解加成：每个核心词 +8 分
                score += matchResult.perfectCount * 8;

                // 全核心额外奖励（满额加15）
                if (matchResult.perfectCount === config.requiredSlots) {
                    score += 15;
                }

                // 时间奖励（剩余秒数 * 1）
                score += liBaiState.timeLeft * 1;

                // 未用提示加成
                if (!liBaiState.hintUsed && !liBaiState.wineShieldUsed) {
                    score += 10;
                }

                // 资源加成
                if (liBaiState.currentLevel === 2 && liBaiState.poetryCount >= 3) {
                    score += 5;
                }
                if (liBaiState.currentLevel === 3 && liBaiState.wineCount >= 3) {
                    score += 5;
                }
            } else {
                // 部分正确：按匹配比例给分，宽泛解打7折
                const coreValue = matchResult.perfectCount;
                const looseValue = matchResult.looseCount * 0.7;
                const ratio = (coreValue + looseValue) / config.requiredSlots;
                score = Math.floor(baseFull * ratio * 0.7);
                score = Math.max(score, 10); // 保底
            }

            return score;
        }

        function finishLevel(levelScore, matchResult) {
            liBaiState.levelScores.push(levelScore);
            // 存储每关的匹配详情，用于最终结算展示
            if (matchResult) {
                if (!liBaiState.levelMatchResults) liBaiState.levelMatchResults = [];
                liBaiState.levelMatchResults.push(matchResult);
            }
            liBaiState.totalScore += levelScore;
            updateStatsDisplay();
            saveLiBaiState();

            const nextLevel = liBaiState.currentLevel + 1;
            if (nextLevel > 3) {
                // 全部关卡结束
                showTransition('最终评定中...', '');
                setTimeout(() => {
                    hideTransition();
                    endGame();
                }, 1500);
            } else {
                // 进入下一关
                showTransition(
                    `第${liBaiState.currentLevel}关通过！`,
                    `本关得分: ${levelScore}分 | 准备进入第${nextLevel}关...`
                );
                setTimeout(() => {
                    hideTransition();
                    startLevel(nextLevel);
                }, 2000);
            }
        }

        // ==================== 游戏结束与结局 ====================
        function endGame() {
            liBaiState.gameComplete = true;
            saveLiBaiState();

            const total = liBaiState.totalScore;
            let endingType, title, subtitle, icon, attrBonus;

            if (total >= 130) {
                endingType = 'good';
                title = '\u8C34\u4EDA\u4EBA';
                icon = '&#127942;';
                subtitle = '笔落惊风雨，诗成泣鬼神！你的意象感知力已臻化境，青莲剑仙亦对你刮目相看。';
                attrBonus = { poem: 3, wine: 2 };
            } else if (total >= 90) {
                endingType = 'normal';
                title = '\u8BD7\u5BA2';
                icon = '&#128214;';
                subtitle = '虽未至化境，却已有几分诗家风骨。继续磨砺，终有一日可与太白共饮月下。';
                attrBonus = { poem: 2, wine: 1 };
            } else {
                endingType = 'bad';
                title = '\u51E1\u592B';
                icon = '&#128517;';
                subtitle = '意象之路漫漫，今日虽未得要领，但每一次尝试都是成长的足迹。再来一局如何？';
                attrBonus = { poem: 1, wine: 0 };
            }

            // 属性奖励
            if (!liBaiState._locked) {
                liBaiState.poetryCount += attrBonus.poem;
                liBaiState.wineCount += attrBonus.wine;
            }

            // 解锁成就
            unlockAchievement('libai_poetry_complete', title, '完成李白第四幕·意象重构');
            if (total >= 130) {
                unlockAchievement('libai_poet_immortal', '谪仙人', '意象重构满分通关');
            }

            // 保存游魂数据并记录进度为"第四幕完成"
            saveSoulData('liBai', {
                poem: liBaiState.poetryCount,
                wine: liBaiState.wineCount,
                totalScore: total,
                ending: title,
                levelMatchResults: liBaiState.levelMatchResults || []
            });
            // 注意：不在此处标记第5幕进度，等第五幕完成后才标记

            saveLiBaiState();

            showFinalResult(endingType, title, subtitle, icon, total, attrBonus);
        }

        function showFinalResult(endingType, title, subtitle, icon, total, attrBonus) {
            const overlay = document.getElementById('result-overlay');
            const panel = document.getElementById('result-panel');

            document.getElementById('res-icon').innerHTML = icon || '&#127942;';
            const titleEl = document.getElementById('res-title');
            titleEl.textContent = title || '评定结果';
            titleEl.className = 'result-title ' + (endingType || 'normal');
            document.getElementById('res-subtitle').textContent = subtitle || '';

            // 统计信息（含匹配详情）
            let statsHTML = `<p><strong>三关明细：</strong></p>`;
            const labels = ['山水对', '颜色/方位对', '器物/动作对'];
            const results = liBaiState.levelMatchResults || [];
            (liBaiState.levelScores || [0, 0, 0]).forEach((s, i) => {
                let detail = '';
                if (results[i]) {
                    const r = results[i];
                    const coreIcon = '\u2705'; // ✅
                    const looseIcon = '\U0001F7E0'; // 🟠
                    detail = ` <span style="font-size:0.85em;color:rgba(255,255,255,0.6)">(` +
                        `${coreIcon}核心${r.perfectCount} ${looseIcon}宽泛${r.looseCount}</span>)`;
                }
                statsHTML += `<p>${labels[i]}：<strong>${s}</strong> 分${detail}</p>`;
            });
            statsHTML += `<p style="border-top:1px solid rgba(255,255,255,0.1);padding-top:8px;margin-top:8px;">`;
            statsHTML += `<strong>总计：<span style="color:#ffd700;font-size:1.2em">${total || liBaiState.totalScore}</span> 分</strong></p>`;
            if (attrBonus) {
                statsHTML += `<p>&#128218; 诗心 +${attrBonus.poem} | &#127867; 酒意 +${attrBonus.wine}</p>`;
            }
            statsHTML += '</p>';

            document.getElementById('res-stats').innerHTML = statsHTML;
            overlay.classList.add('show');
            updateStatsDisplay();
        }

        function handlePrimaryResult() {
            // 跳转到第五幕《意象之择》
            saveProgress('liBai', 4); // 标记第四幕完成，准备进入第五幕
            window.location.href = 'li_bai_act5_puzzle.html';
        }

        function replayGame() {
            document.getElementById('result-overlay').classList.remove('show');

            // 重置游戏数据
            liBaiState.totalScore = 0;
            liBaiState.levelScores = [];
            liBaiState.levelMatchResults = []; // 匹配详情也要清空
            liBaiState.currentLevel = 1;
            liBaiState.selectedWords = [];
            liBaiState.gameComplete = false;
            liBaiState.hintUsed = false;
            liBaiState.wineShieldUsed = false;

            saveLiBaiState();
            startLevel(1);
        }

        // ==================== 过渡动画 ====================
        function showTransition(text, sub) {
            const t = document.getElementById('level-transition');
            document.getElementById('trans-text').textContent = text;
            document.getElementById('trans-sub').textContent = sub;
            t.classList.add('show');
        }

        function hideTransition() {
            document.getElementById('level-transition').classList.remove('show');
        }

        // ==================== 工具函数 ====================
        function showFeedback(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'feedback-toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1600);
        }

        // 全局暴露（供HTML内联onclick调用）
        window.toggleClue = function() { toggleClue(); };
        window.clearSelection = function() { clearSelection(); };
        window.useHint = function() { useHint(); };
        window.submitAnswer = function() { submitAnswer(); };
        window.replayGame = function() { replayGame(); };
        window.handlePrimaryResult = function() { handlePrimaryResult(); };

        // ==================== 启动 ====================
        document.addEventListener('DOMContentLoaded', init);

    })();
    </script>
</body>
</html>
