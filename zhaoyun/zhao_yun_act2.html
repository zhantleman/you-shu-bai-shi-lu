<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赵云线 · 游蜀拜师录</title>
    <link rel="icon" type="image/svg+xml" href="../genie.svg">
    <meta name="description" content="赵云线第二幕 - 锦江突围">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/hero-styles.css">
    <link rel="stylesheet" href="../css/level-select.css">
    <style>:root{--li-bai-primary:#DC2626}</style>
</head>
<body class="act-bg has-notebook" style="background-image: url('../images/jinjiang-river.jpeg');">
    <div class="li-bai-header">
        <div class="hero-header">
            <div class="hero-info">
                <h1 class="hero-name">
                    <img class="hero-name-avatar" src="../images/zhaoyun-avatar-game.png" alt="赵云">
                    赵云 · 苍天翔龙
                </h1>
                <p class="hero-title">勇者之誓 · 锦江突围</p>
            </div>

            <div class="stats-container" id="zhao-stats">
                <div class="li-bai-stat">
                    <div class="stat-icon">💪</div>
                    <div class="stat-label">勇气</div>
                    <div class="stat-value" id="stat-courage">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">🛡️</div>
                    <div class="stat-label">守护</div>
                    <div class="stat-value" id="stat-guard">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-label">探索</div>
                    <div class="stat-value" id="stat-explored">0/2</div>
                </div>
            </div>

            <div class="act-indicator">
                <div class="act-number" id="act-number">2</div>
                <div class="act-text">第 <span id="act-text">二</span> 幕</div>
            </div>

            <!-- 返回首页按钮已移除，由选关面板取代 -->
        </div>
    </div>
    
    <div class="container">
        <div class="game-scene" id="dialogue-scene">
            <div class="dialogue-container">
                <h3 class="scene-title" id="scene-title">第二幕 · 锦江突围</h3>
                
                <div id="dialogue-log" class="dialogue-log">
                </div>
                
                <div class="li-bai-options" id="li-bai-options">
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/common.js"></script>
    <script src="../js/level-select.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('zhaoYun', 2));</script>
    <script src="../js/zhaoyun-notebook.js"></script>
    
    <script>
        // ==================== 赵云线状态变量 ====================
        const zhaoState = {
            currentAct: 2,
            currentStep: 'opening',
            courage: 0,
            guard: 0,
            exploredOptions: { option1: false, option2: false },
            actCourageChoices: 0,
            actGuardChoices: 0,
            _isAnswering: false,
            _locked: false
        };
        
        // ==================== 页面初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('赵云线第二幕页面已加载');
            clearActStateOnFreshEntry('zhaoState');
            loadZhaoState();
            startZhaoSecondAct();
            bindZhaoEvents();
            if (typeof initNotebook === 'function') initNotebook();
        });
        
        // ==================== 状态管理 ====================
        function loadZhaoState() {
            try {
                const savedState = localStorage.getItem('zhaoState');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    Object.assign(zhaoState, parsed);
                }
                zhaoState.courage = parseInt(localStorage.getItem('zhao_courage')) || 0;
                zhaoState.guard = parseInt(localStorage.getItem('zhao_guard')) || 0;
                
                if (isHeroLineCompleted('zhaoYun')) {
                    const final = getHeroFinalAttrs('zhaoYun');
                    if (final) {
                        zhaoState.courage = final.courage;
                        zhaoState.guard = final.guard;
                        zhaoState._locked = true;
                    }
                }
                updateZhaoStats();
            } catch (error) {
                console.error('加载状态失败:', error);
            }
        }
        
        function saveZhaoState() {
            try {
                localStorage.setItem('zhaoState', JSON.stringify(zhaoState));
                localStorage.setItem('zhao_courage', zhaoState.courage);
                localStorage.setItem('zhao_guard', zhaoState.guard);
                if (typeof gameState !== 'undefined') {
                    gameState.stats.courage = zhaoState.courage;
                    gameState.stats.guard = zhaoState.guard;
                    if (typeof saveGameState === 'function') saveGameState();
                }
            } catch (error) {
                console.error('保存失败:', error);
            }
        }
        
        function updateZhaoStats() {
            document.getElementById('stat-courage').textContent = zhaoState.courage;
            document.getElementById('stat-guard').textContent = zhaoState.guard;
            const exploredCount = (zhaoState.exploredOptions.option1 ? 1 : 0) + (zhaoState.exploredOptions.option2 ? 1 : 0);
            document.getElementById('stat-explored').textContent = `${exploredCount}/2`;
            document.getElementById('act-number').textContent = zhaoState.currentAct;
            const actText = ['一', '二', '三', '四'][zhaoState.currentAct - 1] || '二';
            document.getElementById('act-text').textContent = actText;
        }
        
        // ==================== 打字机队列系统 ====================
        let _typeQueue = [];
        let _isTyping = false;
        
        function waitForTypeQueueEmpty() {
            return new Promise(resolve => {
                function check() {
                    if (_typeQueue.length === 0 && !_isTyping) resolve();
                    else setTimeout(check, 50);
                }
                check();
            });
        }
        
        function _processTypeQueue() {
            if (_isTyping || _typeQueue.length === 0) return;
            _isTyping = true;
            const job = _typeQueue.shift();
            document.body.classList.add('typing-active');
            document.body.classList.remove('choice-showing', 'choice-hovering');
            job.messageDiv.classList.add('li-bai-message-typing');
            
            let charIndex = 0;
            const pureTextLength = job.rawText.replace(/<[^>]*>/g, '').length;
            const baseSpeed = pureTextLength < 20 ? 80 : (pureTextLength < 50 ? 55 : 45);
            
            function typeNextChar() {
                if (charIndex >= job.rawChars.length) {
                    job.cursorSpan.style.display = 'none';
                    job.messageDiv.classList.remove('li-bai-message-typing');
                    if (_typeQueue.length === 0) {
                        document.body.classList.remove('typing-active');
                        _isTyping = false;
                    } else {
                        _processTypeQueue();
                    }
                    job.targetSpan.innerHTML = job.rawText;
                    if (typeof refreshKeywordSpans === 'function') refreshKeywordSpans();
                    job.resolve();
                    return;
                }
                const item = job.rawChars[charIndex++];
                job.targetSpan.innerHTML += item.value;
                const dialogueLog = document.getElementById('dialogue-log');
                dialogueLog.scrollTop = dialogueLog.scrollHeight;
                let delay = baseSpeed;
                if (item.type === 'char' && '，。！？、；：'.includes(item.value)) delay += 150;
                else if (item.type === 'char' && item.value === ' ') delay -= 10;
                setTimeout(typeNextChar, delay);
            }
            setTimeout(typeNextChar, 100);
        }
        
        function addZhaoDialogue(text, speaker) {
            const dialogueLog = document.getElementById('dialogue-log');
            const messageDiv = document.createElement('div');
            messageDiv.className = speaker === '赵云' ? 'li-bai-message' : 'player-message';
            const speakerName = speaker === '赵云' ? '赵云' : '玩家';
            messageDiv.innerHTML = `<strong>${speakerName}：</strong> <span class="type-target"></span><span class="type-cursor">▍</span>`;
            dialogueLog.appendChild(messageDiv);
            dialogueLog.scrollTop = dialogueLog.scrollHeight;
            
            if (typeof gameState !== 'undefined' && gameState) {
                if (!Array.isArray(gameState.dialogueHistory)) gameState.dialogueHistory = [];
                gameState.dialogueHistory.push({
                    text: text,
                    speaker: speaker === '赵云' ? 'hero' : 'player',
                    heroName: speaker,
                    timestamp: new Date().toISOString()
                });
                try { localStorage.setItem('game_dialogue_history', JSON.stringify(gameState.dialogueHistory)); } catch(e) {}
            }
            
            const targetSpan = messageDiv.querySelector('.type-target');
            const cursorSpan = messageDiv.querySelector('.type-cursor');
            if (speaker !== '赵云') {
                targetSpan.innerHTML = text;
                cursorSpan.style.display = 'none';
                return Promise.resolve();
            }
            const rawChars = [];
            let i = 0;
            while (i < text.length) {
                if (text[i] === '<') {
                    let tagEnd = text.indexOf('>', i);
                    if (tagEnd === -1) tagEnd = text.length;
                    rawChars.push({ type: 'tag', value: text.slice(i, tagEnd + 1) });
                    i = tagEnd + 1;
                } else {
                    rawChars.push({ type: 'char', value: text[i] });
                    i++;
                }
            }
            return new Promise(resolve => {
                _typeQueue.push({ targetSpan, cursorSpan, messageDiv, rawChars, rawText: text, resolve });
                _processTypeQueue();
            });
        }
        
        function addThinkingBubble(text) {
            const dialogueLog = document.getElementById('dialogue-log');
            const div = document.createElement('div');
            div.className = 'li-bai-thinking';
            div.textContent = text;
            dialogueLog.appendChild(div);
            dialogueLog.scrollTop = dialogueLog.scrollHeight;
            return new Promise(resolve => {
                setTimeout(() => {
                    div.classList.add('thinking-fade-out');
                    setTimeout(() => { div.remove(); resolve(); }, 500);
                }, 1600);
            });
        }
        
        // ==================== 第二幕剧情：锦江突围 ====================
        async function startZhaoSecondAct() {
            zhaoState.currentAct = 2;
            zhaoState.currentStep = 'opening';
            zhaoState.exploredOptions = { option1: false, option2: false };
            zhaoState.actCourageChoices = 0;
            zhaoState.actGuardChoices = 0;
            zhaoState._isAnswering = false;
            
            document.getElementById('dialogue-log').innerHTML = '';
            updateZhaoStats();
            
            await addZhaoDialogue("锦江夜色虽美，却暗藏激流。此地水上救援与夜游安保并行，是勇气与守护的真正试炼场。你可愿随我一闯？<span class=\"keyword\" data-id=\"zhao_2_2\" data-name=\"90秒内救援到达\">锦江之上</span>，分秒必争。", '赵云');
            await addZhaoDialogue(`锦江每艘游船都配备了<span class="keyword" data-id="zhao_2_1" data-name="AED除颤仪与救援站">AED除颤仪与救援站</span>——真正的勇者从不讳言"万一"。最好的守护，是把"万一"算进每一份预案里。你有什么想了解的？`, '赵云');
            
            zhaoState.currentStep = 'explore';
            await enterExploreStep();
            saveZhaoState();
        }
        
        async function enterExploreStep() {
            await waitForTypeQueueEmpty();
            updateZhaoOptions();
        }
        
        function updateZhaoOptions() {
            const optionsContainer = document.getElementById('li-bai-options');
            optionsContainer.innerHTML = '';
            
            const btn1 = document.createElement('button');
            const btn2 = document.createElement('button');
            const btn3 = document.createElement('button');
            
            btn1.className = 'li-bai-option';
            btn2.className = 'li-bai-option';
            btn3.className = 'li-bai-option';
            
            switch(zhaoState.currentStep) {
                case 'explore':
                    btn1.innerHTML = "锦江夜游的应急救援体系如何保障游客安全？";
                    btn1.setAttribute('data-type', 'courage');
                    btn1.setAttribute('data-mood', 'rational');
                    btn1.setAttribute('data-risk', 'low');
                    
                    btn2.innerHTML = "夜游经济如何在安全与体验之间取得平衡？";
                    btn2.setAttribute('data-type', 'guard');
                    btn2.setAttribute('data-mood', 'emotional');
                    btn2.setAttribute('data-risk', 'high');
                    
                    btn3.style.display = 'none';
                    
                    if (zhaoState.exploredOptions.option1) { btn1.disabled = true; btn1.style.opacity = '0.5'; }
                    if (zhaoState.exploredOptions.option2) { btn2.disabled = true; btn2.style.opacity = '0.5'; }
                    
                    btn1.onclick = () => exploreOption1();
                    btn2.onclick = () => exploreOption2();
                    break;
                    
                case 'quiz':
                    btn1.innerHTML = "速度与预防并重——90秒响应是底线，但让救援站'隐形'于体验中才是上策。";
                    btn1.setAttribute('data-risk', 'low');
                    btn2.innerHTML = "配备足够多的救生员就行了，安全设施越显眼越好。";
                    btn2.setAttribute('data-risk', 'high');
                    btn3.style.display = 'none';
                    btn1.onclick = () => quizAnswer(true);
                    btn2.onclick = () => quizAnswer(false);
                    break;
                    
                case 'choice':
                    btn1.innerHTML = "突击能力！危机来临时，唯有勇猛冲锋才能化险为夷。";
                    btn1.setAttribute('data-type', 'courage');
                    btn1.setAttribute('data-mood', 'rational');
                    btn1.setAttribute('data-risk', 'low');
                    
                    btn2.innerHTML = "防御体系！不战而屈人之兵，方为上策。让危机无机可乘。";
                    btn2.setAttribute('data-type', 'guard');
                    btn2.setAttribute('data-mood', 'emotional');
                    btn2.setAttribute('data-risk', 'high');
                    
                    btn3.textContent = "前往下一站";
                    
                    if (zhaoState.actCourageChoices >= 2) { btn1.disabled = true; btn1.style.opacity = '0.5'; }
                    if (zhaoState.actGuardChoices >= 2) { btn2.disabled = true; btn2.style.opacity = '0.5'; }
                    
                    if (zhaoState.courage > 0 || zhaoState.guard > 0) {
                        btn3.style.display = 'inline-block';
                        btn3.onclick = nextScene;
                    } else {
                        btn3.style.display = 'none';
                    }
                    
                    btn1.onclick = () => finalChoice('courage');
                    btn2.onclick = () => finalChoice('guard');
                    break;
            }
            
            optionsContainer.appendChild(btn1);
            optionsContainer.appendChild(btn2);
            optionsContainer.appendChild(btn3);
            document.body.classList.add('choice-showing');
            updateZhaoStats();
        }
        
        // 探索选项1：AED除颤仪与救援站
        async function exploreOption1() {
            document.getElementById('li-bai-options').innerHTML = '';
            await addZhaoDialogue("锦江夜游的应急救援体系如何保障游客安全？", '玩家');
            await addThinkingBubble("赵云指向沿岸排列整齐的救援站，神色凝重。");
            await addZhaoDialogue("锦江每艘游船配备<span class=\"keyword\" data-id=\"zhao_2_1\" data-name=\"AED除颤仪与救援站\">AED除颤仪与救援站</span>，沿岸每500米设一个救援站。一旦有人落水，<span class=\"keyword\" data-id=\"zhao_2_2\" data-name=\"90秒内救援到达\">90秒内救援到达</span>。赵云冲锋陷阵时，身上也带着金疮药与绷带——最好的守护，是把'万一'算进每一份预案里。", '赵云');
            
            zhaoState.exploredOptions.option1 = true;
            updateZhaoStats();
            await checkAllExplored();
            saveZhaoState();
        }
        
        // 探索选项2：沉浸式安全
        async function exploreOption2() {
            document.getElementById('li-bai-options').innerHTML = '';
            await addZhaoDialogue("夜游经济如何在安全与体验之间取得平衡？", '玩家');
            await addThinkingBubble("赵云望向江面流动的灯光秀，若有所思。");
            await addZhaoDialogue("他们将<span class=\"keyword\" data-id=\"zhao_2_3\" data-name=\"沉浸式安全\">安全提示融入灯光秀和剧情讲解</span>，游客在不知不觉中完成安全培训。赵云守护阿斗，不会一直喊'我在保护你'，而是默默杀退每一个敌人。真正的守护，让人感觉不到它的存在，但它一直都在。", '赵云');
            
            zhaoState.exploredOptions.option2 = true;
            updateZhaoStats();
            await checkAllExplored();
            saveZhaoState();
        }
        
        async function checkAllExplored() {
            const exploredCount = (zhaoState.exploredOptions.option1 ? 1 : 0) + (zhaoState.exploredOptions.option2 ? 1 : 0);
            if (exploredCount === 2) {
                setTimeout(() => {
                    zhaoState.currentStep = 'quiz';
                    enterQuizStep();
                }, 1000);
            } else {
                await waitForTypeQueueEmpty();
                updateZhaoOptions();
            }
        }
        
        async function enterQuizStep() {
            await addZhaoDialogue("我来验验你的判断：锦江夜游应急救援体系的核心理念是什么？", '赵云');
            zhaoState.currentStep = 'quiz';
            await waitForTypeQueueEmpty();
            updateZhaoOptions();
            saveZhaoState();
        }
        
        async function quizAnswer(isCorrect) {
            if (zhaoState._isAnswering) return;
            zhaoState._isAnswering = true;
            document.getElementById('li-bai-options').innerHTML = '';
            
            if (isCorrect) {
                await addZhaoDialogue("速度与预防并重——90秒响应是底线，但让救援站'隐形'于体验中才是上策。", '玩家');
                await addThinkingBubble("赵云赞许地点头，目光如炬。");
                await addZhaoDialogue("好！你理解了——迟到的守护不是守护，是追悼。勇气不仅是冲锋，更是未雨绸缪的速度。", '赵云');
            } else {
                await addZhaoDialogue("配备足够多的救生员就行了，安全设施越显眼越好。", '玩家');
                await addThinkingBubble("赵云摇头，语气严肃。");
                await addZhaoDialogue("错了。显眼的安全设施只会破坏体验，让人焦虑。真正的守护，是润物无声——像我在长坂坡七进七出，不是为了让谁看见。", '赵云');
            }
            zhaoState.currentStep = 'choice';
            await enterChoiceStep();
            saveZhaoState();
        }
        
        async function enterChoiceStep() {
            await addZhaoDialogue("那么，面对锦江激流，你更看重的是'一往无前的突击能力'，还是'滴水不漏的防御体系'？", '赵云');
            zhaoState.currentStep = 'choice';
            await waitForTypeQueueEmpty();
            updateZhaoOptions();
            saveZhaoState();
        }
        
        async function finalChoice(type) {
            document.getElementById('li-bai-options').innerHTML = '';
            
            if (type === 'courage' && zhaoState.actCourageChoices >= 2) {
                await addZhaoDialogue("突击能力！危机来临时，唯有勇猛冲锋才能化险为夷。", '玩家');
                await addZhaoDialogue("勇者无惧，但水火无情。换条路走吧！", '赵云');
                await waitForTypeQueueEmpty();
                updateZhaoOptions();
                return;
            }
            if (type === 'guard' && zhaoState.actGuardChoices >= 2) {
                await addZhaoDialogue("防御体系！不战而屈人之兵，方为上策。让危机无机可乘。", '玩家');
                await addZhaoDialogue("防守之心可贵，但也需敢于涉险。换个方向？", '赵云');
                await waitForTypeQueueEmpty();
                updateZhaoOptions();
                return;
            }
            
            if (type === 'courage') {
                zhaoState.actCourageChoices += 1;
                await addZhaoDialogue("突击能力！危机来临时，唯有勇猛冲锋才能化险为夷。", '玩家');
                await addThinkingBubble("赵云握紧长枪，目光坚定地望向江面。");
                if (zhaoState.actCourageChoices === 1) {
                    await addZhaoDialogue("善！狭路相逢勇者胜。有此气魄，危局可破！", '赵云');
                } else {
                    await addZhaoDialogue("又是勇气！你对冲锋的执着，正如我在长坂坡时的决绝。", '赵云');
                    if (typeof unlockAchievement === 'function') unlockAchievement('zhao_courage_repeat');
                }
                if (!zhaoState._locked) zhaoState.courage += 1;
            } else {
                zhaoState.actGuardChoices += 1;
                await addZhaoDialogue("防御体系！不战而屈人之兵，方为上策。让危机无机可乘。", '玩家');
                await addThinkingBubble("赵云收起长枪，望向沿岸的救援站点，神色沉稳。");
                if (zhaoState.actGuardChoices === 1) {
                    await addZhaoDialogue("好！上兵伐谋，不战而胜。防患于未然，才是大将之风。", '赵云');
                } else {
                    await addZhaoDialogue("防御...你心中有不忍挥剑的理由，这份慎重可敬。", '赵云');
                    if (typeof unlockAchievement === 'function') unlockAchievement('zhao_guard_repeat');
                }
                if (!zhaoState._locked) zhaoState.guard += 1;
            }
            
            saveZhaoState();
            await waitForTypeQueueEmpty();
            updateZhaoOptions();
        }
        
        async function nextScene() {
            await addZhaoDialogue("前往下一站", '玩家');
            await addThinkingBubble("赵云转身，望向青城山方向，山影隐隐。");
            await addZhaoDialogue("好！下一站是青城山，那里有最后的试炼等着我们。走！", '赵云');
            
            saveProgress('zhaoYun', 3);
            saveZhaoState();
            window.location.href = "zhao_yun_act3.html";
        }
        
        // ==================== 事件绑定 ====================
        function bindZhaoEvents() {
            // 返回首页按钮已移除（选关面板取代）
            
            const optionsContainer = document.getElementById('li-bai-options');
            if (optionsContainer) {
                optionsContainer.addEventListener('mouseover', function(e) {
                    const btn = e.target.closest('.li-bai-option');
                    if (!btn || btn.disabled) return;
                    document.body.classList.add('choice-hovering');
                    const mood = btn.getAttribute('data-mood');
                    if (mood === 'rational') document.body.classList.add('choice-hover-rational');
                    else if (mood === 'emotional') document.body.classList.add('choice-hover-emotional');
                });
                optionsContainer.addEventListener('mouseout', function() {
                    document.body.classList.remove('choice-hovering', 'choice-hover-rational', 'choice-hover-emotional');
                });
            }
        }
    </script>
    
    <div class="notebook-sidebar" id="notebook-sidebar"></div>
</body>
</html>
