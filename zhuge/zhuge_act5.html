<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诸葛亮线 · 游蜀拜师录</title>
    <link rel="icon" type="image/svg+xml" href="../genie.svg">
    <meta name="description" content="诸葛亮线第五幕 - 取舍之道">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/hero-styles.css">
    <link rel="stylesheet" href="../css/level-select.css">
    
    <style>
        :root{--li-bai-primary:#3B82F6}
        /* ===== 第五幕《取舍之道》专属样式 ===== */
        
        body.act-bg {
            background-image: url('../images/wuhou-temple.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .act5-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 30px;
            min-height: calc(100vh - 120px);
        }

        /* ===== 开场画面 ===== */
        .act5-intro {
            text-align: center;
            padding: 60px 40px;
            animation: act5FadeIn 1.2s ease-out;
        }

        @keyframes act5FadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .act5-intro-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 12px rgba(59,130,246,0.4));
        }

        .act5-intro-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ffd700;
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(255,215,0,0.3);
        }

        .act5-intro-subtitle {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.9;
            max-width: 520px;
            margin: 0 auto 36px;
        }

        .act5-intro-btn {
            padding: 14px 48px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }

        .act5-intro-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59,130,246,0.45);
        }

        /* ===== 回顾轮次 ===== */
        .act5-round {
            display: none;
            animation: act5SlideIn 0.6s ease-out;
        }
        
        .act5-round.active {
            display: block;
        }

        @keyframes act5SlideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .act5-round-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .act5-round-num {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(37,99,235,0.15));
            border: 1px solid rgba(59,130,246,0.35);
            border-radius: 24px;
            color: #60a5fa;
            font-weight: bold;
            font-size: 1rem;
        }

        .act5-round-progress {
            display: flex;
            gap: 8px;
        }

        .act5-progress-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .act5-progress-dot.done { background: #51cf66; border-color: #51cf66; }
        .act5-progress-dot.current { 
            background: #ffd700; 
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255,215,0,0.5);
            animation: pulseDot 1.5s infinite;
        }
        @keyframes pulseDot {
            0%,100%{ box-shadow:0 0 8px rgba(255,215,0,0.5); }
            50%{ box-shadow:0 0 16px rgba(255,215,0,0.8); }
        }

        .act5-round-body {
            display: flex;
            gap: 28px;
            align-items: stretch;
        }

        @media (max-width: 700px) {
            .act5-round-body { flex-direction: column; }
        }

        /* 左侧：回放卡片 */
        .act5-replay-card {
            flex: 1;
            min-width: 0;
            background: linear-gradient(145deg, rgba(0,0,0,0.35), rgba(0,0,0,0.18));
            border: 1px solid rgba(255,215,0,0.18);
            border-radius: 16px;
            padding: 26px 22px;
            position: relative;
        }

        .act5-replay-label {
            font-size: 0.78rem;
            color: rgba(255,215,0,0.55);
            letter-spacing: 3px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .act5-replay-text {
            font-size: 1rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.85;
        }

        .act5-replay-text .hl {
            color: #ffd700;
            font-weight: bold;
        }

        .act5-replay-text .res-icon {
            font-size: 1.15em;
            margin: 0 2px;
        }

        /* 右侧：心法抉择 */
        .act5-choice-panel {
            flex: 1.15;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .act5-choice-label {
            font-size: 0.78rem;
            color: rgba(255,215,0,0.55);
            letter-spacing: 3px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .act5-choice-btn {
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 20px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .act5-choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0, rgba(255,215,0,0.08), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .act5-choice-btn:hover {
            border-color: rgba(255,215,0,0.35);
            transform: translateY(-2px);
        }

        .act5-choice-btn:hover::before { opacity: 1; }

        .act5-choice-btn.choice-a:hover {
            border-color: rgba(81,207,102,0.45);
            box-shadow: 0 4px 20px rgba(81,207,102,0.12);
        }

        .act5-choice-btn.choice-b:hover {
            border-color: rgba(255,107,107,0.45);
            box-shadow: 0 4px 20px rgba(255,107,107,0.12);
        }

        .act5-choice-btn.selected {
            border-color: #ffd700 !important;
            background: linear-gradient(145deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03)) !important;
            box-shadow: 0 0 20px rgba(255,215,0,0.15) !important;
        }

        .act5-choice-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .choice-a .act5-choice-tag {
            background: rgba(81,207,102,0.15);
            color: #51cf66;
            border: 1px solid rgba(81,207,102,0.25);
        }

        .choice-b .act5-choice-tag {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.25);
        }

        .act5-choice-title {
            font-size: 1.08rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .act5-choice-desc {
            font-size: 0.92rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.65;
        }

        /* ===== 结果页面 ===== */
        .act5-result {
            display: none;
            text-align: center;
            animation: act5ResultIn 1s ease-out;
        }

        .act5-result.active { display: block; }

        @keyframes act5ResultIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .act5-result-banner {
            font-size: 1rem;
            color: rgba(255,215,0,0.6);
            letter-spacing: 5px;
            margin-bottom: 16px;
        }

        .act5-result-tag {
            display: inline-block;
            padding: 10px 32px;
            background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(255,215,0,0.08));
            border: 2px solid rgba(255,215,0,0.4);
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 24px;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(255,215,0,0.2);
        }

        .act5-result-comment {
            max-width: 480px;
            margin: 0 auto 36px;
            padding: 24px 28px;
            background: rgba(0,0,0,0.3);
            border-left: 3px solid rgba(255,215,0,0.5);
            border-radius: 0 12px 12px 0;
            text-align: left;
        }

        .act5-result-comment-label {
            font-size: 0.82rem;
            color: rgba(255,215,0,0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .act5-result-comment-text {
            font-size: 1.03rem;
            color: rgba(255,255,255,0.88);
            line-height: 2;
            font-style: italic;
        }

        .act5-result-summary {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .act5-result-chip {
            padding: 8px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.65);
        }

        .act5-cert-btn {
            padding: 16px 48px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #1a1a1a;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255,215,0,0.3);
        }

        .act5-cert-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,215,0,0.45);
        }
    </style>
</head>
<body class="act-bg" style="background-image: url('../images/wuhou-temple.jpeg');">
    
    <!-- 页面顶部 -->
    <div class="li-bai-header">
        <div class="hero-header">
            <div class="hero-info">
                <h1 class="hero-name">
                    <img class="hero-name-avatar" src="../images/zhuge-avatar-game.png" alt="诸葛亮">
                    诸葛亮 · 卧龙先生
                </h1>
                <p class="hero-title">智谋计算 · 取舍之道</p>
                
                <div class="stats-container" id="zhuge-stats">
                    <div class="li-bai-stat">
                        <div class="stat-icon">🍚</div>
                        <div class="stat-label">粮草</div>
                        <div class="stat-value" id="stat-food">-</div>
                    </div>
                    <div class="li-bai-stat">
                        <div class="stat-icon">⚙️</div>
                        <div class="stat-label">军械</div>
                        <div class="stat-value" id="stat-gear">-</div>
                    </div>
                    <div class="li-bai-stat">
                        <div class="stat-icon">❤️</div>
                        <div class="stat-label">民心</div>
                        <div class="stat-value" id="stat-people">-</div>
                    </div>
                </div>
            </div>
            
            <div class="act-indicator">
                <div class="act-number" id="act-number">5</div>
                <div class="act-text">第 <span id="act-text">五</span> 幕</div>
            </div>

            </div>
        </div>
    </div>
    
    <!-- 主内容区 -->
    <div class="container">
        <div class="game-scene">
            <div class="dialogue-container">
                <h3 class="scene-title">第五幕 · 取舍之道</h3>
                
                <div class="act5-container" id="act5-root">
                    <!-- 由JS动态渲染 -->
                </div>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script>
    // ================================================================
    //  第五幕《取舍之道》—— 人格赋予仪式
    // ================================================================

    // ---- 从第四幕读取数据（通过localStorage的soulData） ----
    let gameData = null;

    function loadGameData() {
        const soulData = getSoulData();
        const sd = soulData['zhugeLiang'] || {};
        gameData = {
            food: sd.food || 0,
            gear: sd.gear || 0,
            people: sd.people || 0,
            roundResults: sd.roundResults || [],
            playerHP: sd.playerHP !== undefined ? sd.playerHP : 100,
            aiHP: sd.aiHP !== undefined ? sd.aiHP : 100,
            playerWins: sd.playerWins !== undefined ? sd.playerWins : 0,
            totalRounds: sd.totalRounds || 3
        };

        // 更新顶部属性显示
        document.getElementById('stat-food').textContent = gameData.food;
        document.getElementById('stat-gear').textContent = gameData.gear;
        document.getElementById('stat-people').textContent = gameData.people;
    }

    // ---- 卡牌名称映射 ----
    const CARD_MAP = { food: '粮草', gear: '军械', people: '民心' };
    const CARD_ICON = { food: '🍚', gear: '⚙️', people: '❤️' };
    const RESULT_TEXT = { win: '胜', lose: '负', draw: '平' };

    // ---- 三轮心法配置 ----
    const ROUND_CONFIGS = [
        {
            title: '资源分配',
            replayBuilder: (data) => buildReplayText(data, 0),
            choices: {
                A: {
                    tag: '以退为进',
                    title: '壮士断腕之智',
                    desc: '粮草可弃，军械乃破敌之要。此乃以小博大、保全大局的隐忍之道。'
                },
                B: {
                    tag: '险中求胜',
                    title: '背水一战的胆色',
                    desc: '绝境方显英雄本色，留粮草孤注一掷，或能置之死地而后生。'
                }
            }
        },
        {
            title: '克制博弈',
            replayBuilder: (data) => buildReplayText(data, 1),
            choices: {
                A: {
                    tag: '料敌为先',
                    title: '步步为营的稳健',
                    desc: '既知对手出牌倾向，便以克制应对，稳扎稳打，不贪功冒进。'
                },
                B: {
                    tag: '出奇制胜',
                    title: '不按常理出牌',
                    desc: '逆势而出其不意，打破对手预期，险中求变，打其措手不及。'
                }
            }
        },
        {
            title: '残局决策',
            replayBuilder: (data) => buildReplayText(data, 2),
            choices: {
                A: {
                    tag: '稳守成果',
                    title: '积小胜为大胜',
                    desc: '形势尚可，不宜冒进。守成即是胜利，待时机成熟再图大业。'
                },
                B: {
                    tag: '一击定乾坤',
                    title: '倾全力决胜负',
                    desc: '机不可失时不再来，倾尽所有放手一搏，不胜则已，胜则定乾坤！'
                }
            }
        }
    ];

    // ---- 回放文案生成器（混合方案：真实数据 + 模板填充）----
    function buildReplayText(data, roundIndex) {
        const rr = data.roundResults[roundIndex];
        
        if (!rr) {
            // 无真实数据 → 预设模板
            const templates = [
                `第${roundIndex+1}回合：战况胶着。<span class="hl">资源争夺</span>进入白热化阶段，每一张牌都关乎全局走向。`,
                `第${roundIndex+1}回合：<span class="hl">攻防转换</span>的关键时刻。你需要在进取与保守之间做出抉择。`,
                `第${roundIndex+1}回合：<span class="hl">最终博弈</span>的前奏。此时此刻的选择，将决定整场对弈的走向。`
            ];
            return templates[roundIndex] || templates[0];
        }

        // 有真实数据
        const pCardName = CARD_MAP[rr.playerCard] || rr.playerCard;
        const aCardName = CARD_MAP[rr.aiCard] || rr.aiCard;
        const pIcon = CARD_ICON[rr.playerCard] || '';
        const aIcon = CARD_ICON[rr.aiCard] || '';
        const resultLabel = RESULT_TEXT[rr.result] || '';

        let text = `第${roundIndex+1}回合：你出<span class="hl">${pIcon}${pCardName}</span>，对手出<span class="hl">${aIcon}${aCardName}</span>`;
        
        if (rr.result === 'win') {
            text += `，<span style="color:#51cf66;">你胜了一阵！</span>`;
        } else if (rr.result === 'lose') {
            text += `，<span style="color:#ff6b6b;">此阵未能取胜。</span>`;
        } else {
            text += `，<span style="color:#ffd700;">双方旗鼓相当。</span>`;
        }

        return text;
    }

    // ---- 人格矩阵（4类主型 × 2种变体 = 8标签）----
    const PERSONALITY_MATRIX = {
        AAA: { tag: '深谋远虑者', variant: '余', comment: '善。汝用兵，七分稳，三分奇。静如处子，动如脱兔，已得用势之妙。此乃大将之风，可堪大任。' },
        AAB: { tag: '持重谋士',   variant: '余', comment: '可嘉。汝知进退之度，明得失之理。稳重之中不失灵活，再添几分胆色，可成大器。' },
        ABA: { tag: '持重谋士',   variant: '余', comment: '可嘉。汝知进退之度，明得失之理。稳重之中不失灵活，再添几分胆色，可成大器。' },
        BAA: { tag: '持重谋士',   variant: '余', comment: '可嘉。汝知进退之度，明得失之理。稳重之中不失灵活，再添几分胆色，可成大器。' },
        ABB: { tag: '灵动策士',   variant: '余', comment: '妙哉。汝有勇有谋，敢于破局。然兵行险招需审时度势，切记：奇谋可一而不可再。' },
        BAB: { tag: '灵动策士',   variant: '余', comment: '妙哉。汝有勇有谋，敢于破局。然兵行险招需审时度势，切记：奇谋可一而不可再。' },
        BBA: { tag: '灵动策士',   variant: '余', comment: '妙哉。汝有勇有谋，敢于破局。然兵行险招需审时度势，切记：奇谋可一而不可再。' },
        BBB: { tag: '奇谋决胜者', variant: '余', comment: '妙极！兵行险招而竟全功，非大勇者不能为。然切记：常走险棋终有一失，当以稳为本、奇为用。' }
    };

    // 资源匮乏时的"险"变体
    const VARIANT_RISK_OVERRIDES = {
        '深谋远虑者': { tag: '苦守成策者', comment: '善。汝于逆境中仍能坚守，虽步履维艰，然不失方寸。此乃大将之风，来日方长。' },
        '持重谋士':   { tag: '谨慎算师',   comment: '可嘉。汝行事周密，步步为营。逆境之中更显沉稳本色，假以时日必有所成。' },
        '灵动策士':   { tag: '险中求存者', comment: '可叹。汝于绝境中奋力一搏，勇气可嘉。然日后当思：稳扎稳打方为长远之计。' },
        '奇谋决胜者': { tag: '孤注一掷者', comment: '奇绝！汝竟以全部身家搏一线生机，非大勇大智者不能为此举。然此法不可常用，慎之慎之。' }
    };

    // ---- 状态管理 ----
    let currentRound = 0;      // 当前轮次 0/1/2
    let choices = [];           // 存储每轮选择 ['A','B','A']

    // ---- 页面初始化 ----
    document.addEventListener('DOMContentLoaded', function() {
        clearActStateOnFreshEntry('zhugeState');
        loadGameData();
        renderIntro();
    });

    // ===== 渲染函数 =====

    /** 开场画面 */
    function renderIntro() {
        const root = document.getElementById('act5-root');
        root.innerHTML = `
            <div class="act5-intro">
                <div class="act5-intro-icon">🪭</div>
                <div class="act5-intro-title">取 舍 之 道</div>
                <div class="act5-intro-subtitle">
                    方才对弈，落子无悔。<br>
                    然其中取舍，汝可自知？<br>
                    且看这三处关要，以此窥见汝之将道。
                </div>
                <button class="act5-intro-btn" onclick="startReview()">入座复盘</button>
            </div>
        `;
    }

    /** 进入回顾流程 */
    function startReview() {
        currentRound = 0;
        choices = [];
        renderRound();
    }

    /** 渲染某一轮 */
    function renderRound() {
        const root = document.getElementById('act5-root');
        const cfg = ROUND_CONFIGS[currentRound];
        if (!cfg) { showResult(); return; }

        const replayText = cfg.replayBuilder(gameData);

        // 进度条
        let dotsHtml = '';
        for (let i = 0; i < 3; i++) {
            let cls = 'act5-progress-dot';
            if (i < currentRound) cls += ' done';
            else if (i === currentRound) cls += ' current';
            dotsHtml += `<div class="${cls}"></div>`;
        }

        root.innerHTML = `
            <div class="act5-round active">
                <div class="act5-round-header">
                    <div class="act5-round-num">⚡ 第 ${currentRound + 1} 关 · ${cfg.title}</div>
                    <div class="act5-round-progress">${dotsHtml}</div>
                </div>
                <div class="act5-round-body">
                    <div class="act5-replay-card">
                        <div class="act5-replay-label">📜 时刻回放</div>
                        <div class="act5-replay-text">${replayText}</div>
                    </div>
                    <div class="act5-choice-panel">
                        <div class="act5-choice-label">💡 心法抉择</div>
                        <div class="act5-choice-btn choice-a" onclick="makeChoice('A')">
                            <div class="act5-choice-tag">${cfg.choices.A.tag}</div>
                            <div class="act5-choice-title">${cfg.choices.A.title}</div>
                            <div class="act5-choice-desc">${cfg.choices.A.desc}</div>
                        </div>
                        <div class="act5-choice-btn choice-b" onclick="makeChoice('B')">
                            <div class="act5-choice-tag">${cfg.choices.B.tag}</div>
                            <div class="act5-choice-title">${cfg.choices.B.title}</div>
                            <div class="act5-choice-desc">${cfg.choices.B.desc}</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    /** 做出选择 */
    function makeChoice(choice) {
        choices.push(choice);

        // 视觉反馈
        const btns = document.querySelectorAll('.act5-choice-btn');
        btns.forEach(b => b.classList.remove('selected'));
        const selectedBtn = document.querySelector(`.choice-${choice.toLowerCase()}`);
        if (selectedBtn) selectedBtn.classList.add('selected');

        // 短暂延迟后进入下一轮或结果
        setTimeout(() => {
            currentRound++;
            if (currentRound >= 3) {
                showResult();
            } else {
                renderRound();
            }
        }, 600);
    }

    /** 计算人格结果 */
    function calculatePersonality() {
        // 选择组合字符串 e.g. "AAB"
        const combo = choices.join('');
        
        // 基础人格（从矩阵）
        let base = PERSONALITY_MATRIX[combo];
        if (!base) base = PERSONALITY_MATRIX['AAB']; // fallback

        // ★ 加权因子：资源总值决定"余"或"险"变体
        const totalResources = (gameData.food || 0) + (gameData.gear || 0) + (gameData.people || 0);
        const resourceThreshold = 5; // 总资源>=5为"充足"
        const isResourceRich = totalResources >= resourceThreshold;

        // HP加权：低HP偏向"险"
        const hpRatio = gameData.playerHP / 100;
        const isHpLow = hpRatio < 0.5;

        // 综合判定：资源丰富且HP正常 → "余"；否则考虑"险"
        const useRiskVariant = (!isResourceRich || isHpLow);

        let finalTag, finalComment;
        if (useRiskVariant && VARIANT_RISK_OVERRIDES[base.tag]) {
            finalTag = VARIANT_RISK_OVERRIDES[base.tag].tag;
            finalComment = VARIANT_RISK_OVERRIDES[base.tag].comment;
        } else {
            finalTag = base.tag;
            finalComment = base.comment;
        }

        return {
            combo,
            tag: finalTag,
            comment: finalComment,
            aCount: choices.filter(c => c === 'A').length,
            bCount: choices.filter(c => c === 'B').length,
            totalResources,
            playerWins: gameData.playerWins,
            playerHP: gameData.playerHP
        };
    }

    /** 显示结果页 */
    function showResult() {
        const result = calculatePersonality();
        const root = document.getElementById('act5-root');

        root.innerHTML = `
            <div class="act5-result active">
                <div class="act5-result-banner">— 人格判定 —</div>
                <div class="act5-result-tag">${result.tag}</div>
                
                <div class="act5-result-comment">
                    <div class="act5-result-comment-label">🪭 诸葛亮评语</div>
                    <div class="act5-result-comment-text">"${result.comment}"</div>
                </div>

                <div class="act5-result-summary">
                    <div class="act5-result-chip">选择组合：${result.combo}</div>
                    <div class="act5-result-chip">稳重型 ${result.aCount} · 进取型 ${result.bCount}</div>
                    <div class="act5-result-chip">剩余资源：${result.totalResources}</div>
                    <div class="act5-result-chip">最终HP：${result.playerHP}%</div>
                </div>

                <button class="act5-cert-btn" onclick="goToCert()">📜 领取结业证书</button>
            </div>
        `;

        // 将结果存入 localStorage 供证书页使用
        window.__act5Result = result;
    }

    /** 跳转证书页 */
    function goToCert() {
        // ★ 标记诸葛亮线通关（第五幕完成）
        saveProgress('zhugeLiang', 5);
        checkAllHeroesAchievement();
        unlockAchievement('zhuge_complete', '卧龙之谋', '完成诸葛亮线全五幕通关', '🪭');
        
        const r = window.__act5Result;
        if (!r) { goToCertFallback(); return; }

        const params = new URLSearchParams({
            hero: '诸葛亮',
            title: r.tag,
            food: gameData.food || 0,
            gear: gameData.gear || 0,
            people: gameData.people || 0,
            personalityTag: r.tag,
            comment: r.comment
        });
        window.location.href = '../certificate.html?' + params.toString();
    }

    /** 无结果时的降级跳转 */
    function goToCertFallback() {
        const params = new URLSearchParams({
            hero: '诸葛亮',
            title: '绝代智谋',
            food: gameData.food || 0,
            gear: gameData.gear || 0,
            people: gameData.people || 0
        });
        window.location.href = '../certificate.html?' + params.toString();
    }
    </script>
    <script src="../js/level-select.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('zhugeLiang', 5));</script>
</body>
</html>
