<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诸葛亮线 · 游蜀拜师录</title>
    <link rel="icon" type="image/svg+xml" href="../genie.svg">
    <meta name="description" content="诸葛亮线第四幕 - 隆中对弈">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/hero-styles.css">
    <link rel="stylesheet" href="../css/level-select.css">
    
    <style>
        :root{--li-bai-primary:#3B82F6}
        /* ===== 第四幕游戏区域居中 + 放大 ===== */

        /* 整体容器居中，并允许更大宽度 */
        body.has-notebook > .container {
            flex: 0 1 auto;
            max-width: 1300px;      /* 放宽整体容器 */
            margin: 0 auto !important;
            padding: 0 20px;
        }

        .game-scene {
            width: 100%;
            margin: 0 auto;
        }

        .dialogue-container {
            width: 100%;
            margin: 0 auto;
        }

        /* 对弈主容器放大 + 居中 */
        .zhuge-duel-container {
            max-width: 1200px !important;   /* 关键：放大区域 */
            width: 100% !important;
            margin-left: auto !important;
            margin-right: auto !important;
            padding: 20px 0;
        }

        /* 对弈板面布局调整 */
        .zhuge-duel-board {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 30px;
            margin: 30px 0;
        }

        .zhuge-duel-side {
            flex: 1;
            padding: 24px 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 32px;
            backdrop-filter: blur(4px);
        }

        /* 放大头像 */
        .duel-side-avatar {
            width: 80px !important;
            height: 80px !important;
            margin-bottom: 12px;
        }

        /* 资源标签放大 */
        .zhuge-duel-res-tag {
            font-size: 1.1rem;
            padding: 6px 12px;
        }

        /* 卡牌容器网格放大 */
        .zhuge-duel-cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        /* 单张卡牌放大 */
        .zhuge-duel-card {
            width: 180px;
            padding: 20px 12px;
            border-radius: 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 3px solid transparent;
            user-select: none;
            position: relative;
        }
        .zhuge-duel-card:hover:not(.disabled) {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(59,130,246,0.35);
        }
        .zhuge-duel-card.selected {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251,191,36,0.5);
            transform: translateY(-8px);
            background: rgba(251,191,36,0.15) !important;
        }
        .zhuge-duel-card.selected::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 1.4rem;
            color: #fbbf24;
            font-weight: bold;
        }
        .zhuge-duel-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 多选计数角标 */
        .card-select-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: #f59e0b;
            color: #000;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .zhuge-duel-card-icon {
            font-size: 3rem;
        }

        .zhuge-duel-card-name {
            font-size: 1.2rem;
            margin: 10px 0 6px;
        }

        .zhuge-duel-card-count {
            font-size: 0.9rem;
            margin-top: 8px;
        }

        /* 按钮放大 */
        .zhuge-duel-btn {
            padding: 14px 32px;
            font-size: 1.2rem;
            border-radius: 48px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .zhuge-duel-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .zhuge-duel-btn-primary {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: #fff;
            border: none;
        }
        .zhuge-duel-btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #60A5FA, #3B82F6);
            transform: scale(1.05);
        }
        /* 天地人和按钮特殊样式 */
        .btn-tiandi {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            animation: tiandi-glow 1.5s ease-in-out infinite alternate;
        }
        @keyframes tiandi-glow {
            from { box-shadow: 0 0 12px rgba(245,158,11,0.4); }
            to { box-shadow: 0 0 28px rgba(245,158,11,0.8); }
        }
        /* 组合按钮样式 */
        .btn-combo {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed) !important;
        }
        .btn-combo:hover:not(:disabled) {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6) !important;
        }
        /* 弃牌按钮 */
        .btn-discard {
            background: linear-gradient(135deg, #6b7280, #4b5563) !important;
            color: #fff !important;
        }
        .btn-discard:hover:not(:disabled) {
            background: linear-gradient(135deg, #9ca3af, #6b7280) !important;
        }
        .btn-discard-paid {
            background: linear-gradient(135deg, #ec4899, #db2777) !important;
            color: #fff !important;
        }

        /* 比分、回合信息字体放大 */
        .zhuge-duel-round-num, .zhuge-duel-round-msg {
            font-size: 1.2rem;
        }

        /* 对战日志区域 */
        .zhuge-duel-log {
            max-height: 150px;
            font-size: 0.95rem;
        }

        /* VS 图标放大 */
        .zhuge-duel-vs {
            font-size: 2.5rem;
            align-self: center;
            padding: 0 10px;
        }

        /* 标题放大 */
        .zhuge-duel-title {
            font-size: 2.2rem;
        }
        .zhuge-duel-subtitle {
            font-size: 1rem;
        }

        /* 调整血条高度 */
        .zhuge-duel-hp-bar {
            height: 12px;
        }

        /* 选项区域居中 */
        #zhuge-options {
            display: flex;
            justify-content: center;
        }

        /* 头像样式（顶部小头像） */
        .hero-name-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,215,0,0.6);
            vertical-align: middle;
            margin-right: 6px;
            flex-shrink: 0;
        }

        /* ===== 计谋值系统 ===== */
        .strategy-points-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 14px 0 6px;
            padding: 10px 18px;
            background: rgba(0,0,0,0.45);
            border-radius: 16px;
            border: 1px solid rgba(251,191,36,0.3);
        }
        .strategy-label {
            font-size: 1rem;
            color: #fbbf24;
            font-weight: bold;
            white-space: nowrap;
        }
        .strategy-orbs {
            display: flex;
            gap: 8px;
        }
        .strategy-orb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
        .strategy-orb.filled {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-color: #fbbf24;
            box-shadow: 0 0 10px rgba(251,191,36,0.5);
            color: #000;
            font-weight: bold;
        }
        .strategy-cost-preview {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-left: 8px;
        }
        .strategy-cost-preview.affordable { color: #51cf66; }
        .strategy-cost-preview.too-expensive { color: #ff6b6b; }

        /* 操作按钮区横向排列 */
        .zhuge-duel-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        /* 弃牌确认弹窗 */
        .discard-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .discard-modal {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid rgba(251,191,36,0.4);
            border-radius: 20px;
            padding: 28px 32px;
            min-width: 340px;
            text-align: center;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .discard-modal h3 {
            color: #fbbf24;
            margin: 0 0 16px;
            font-size: 1.25rem;
        }
        .discard-modal p {
            color: #cbd5e1;
            margin: 0 0 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .discard-modal-options {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .discard-modal-options button {
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: transform 0.15s;
        }
        .discard-modal-options button:hover { transform: scale(1.06); }

        /* 多牌展示区 */
        .multi-reveal-cards {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .multi-reveal-card {
            background: rgba(30,41,59,0.85);
            border: 2px solid rgba(148,163,184,0.3);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            min-width: 90px;
            animation: cardPopIn 0.3s ease backwards;
        }
        .multi-reveal-card.player-win { border-color: #51cf66; background: rgba(81,207,102,0.12); }
        .multi-reveal-card.ai-win { border-color: #ff6b6b; background: rgba(255,107,107,0.12); }
        .multi-reveal-card.draw-card { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        @keyframes cardPopIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .multi-reveal-card .mri-icon { font-size: 2rem; }
        .multi-reveal-card .mri-name { font-size: 0.85rem; margin-top: 4px; color: #94a3b8; }
        .multi-vs-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 10px 0;
        }
        .multi-vs-symbol { font-size: 1.4rem; color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body class="act-bg has-notebook" style="background-image: url('../images/wuhou-temple.jpeg');">
    <!-- 页面顶部 — 固定顶栏（统一使用li-bai-header风格） -->
    <div class="li-bai-header">
        <div class="hero-header">
            <div class="hero-info">
                <h1 class="hero-name">
                    <img class="hero-name-avatar" src="../images/zhuge-avatar-game.png" alt="诸葛亮" />
                    诸葛亮 · 卧龙先生
                </h1>
                <p class="hero-title">智谋计算 · 隆中对弈</p>
                
                <div class="stats-container" id="zhuge-stats">
                    <div class="li-bai-stat">
                        <div class="stat-icon">🍚</div>
                        <div class="stat-label">粮草</div>
                        <div class="stat-value" id="stat-food">0</div>
                    </div>
                    <div class="li-bai-stat">
                        <div class="stat-icon">⚙️</div>
                        <div class="stat-label">军械</div>
                        <div class="stat-value" id="stat-gear">0</div>
                    </div>
                    <div class="li-bai-stat">
                        <div class="stat-icon">❤️</div>
                        <div class="stat-label">民心</div>
                        <div class="stat-value" id="stat-people">0</div>
                    </div>
                </div>
            </div>
            
            <div class="act-indicator">
                <div class="act-number" id="act-number">4</div>
                <div class="act-text">第 <span id="act-text">四</span> 幕</div>
            </div>
        </div>
    </div>
    
    <!-- 游戏主内容 -->
    <div class="container">
        <div class="game-scene" id="dialogue-scene">
            <div class="dialogue-container">
                <h3 class="scene-title" id="scene-title">第四幕 · 隆中对弈</h3>
                
                <div id="dialogue-log" class="dialogue-log"></div>
                
                <div class="zhuge-options" id="zhuge-options"></div>
            </div>
        </div>
    </div>
    
    <script src="../js/common.js"></script>
    
    <script>
        // ==================== 对弈状态 ====================
        const duelState = {
            round: 0,
            totalRounds: 3,
            playerWins: 0,
            aiWins: 0,
            selectedCards: [],       // 多选数组，替代单选 selectedCard
            aiCards: [],             // AI出的牌（数组）
            roundResults: [],
            isPlaying: false,
            isOver: false,
            playerHP: 100,
            aiHP: 100,
            resources: { food: 0, gear: 0, people: 0 },
            _locked: false,
            // ===== 新增：计谋值系统 =====
            strategyPoints: 0,       // 当前计谋值
            maxStrategy: 3,          // 计谋值上限
            discardedThisRound: false,// 本回合是否已弃牌
            bonusWinRate: 0          // 胜率加成（付费弃牌累积）
        };

        const COUNTERS = { food: 'gear', gear: 'people', people: 'food' };
        const CARD_INFO = {
            food: { name: '粮草', icon: '🍚', desc: '克制军械' },
            gear: { name: '军械', icon: '⚙️', desc: '克制民心' },
            people: { name: '民心', icon: '❤️', desc: '克制粮草' }
        };

        // 出牌费用配置
        const PLAY_COST = { 1: 1, 2: 2, 3: 3 };
        // 伤害配置
        const DAMAGE = {
            single: { win: 35, lose: 35, drawSelf: 15, drawAi: 15 },
            combo:   { win: 40, lose: 35, drawSelf: 15, drawAi: 15 },  // 组合胜时伤害+40
            tiandi:  { aiDamage: 60, playerWinsAdd: 2 }                 // 天地人和必胜
        };

        const AI_NAMES = ['司马懿', '孙权', '周瑜'];
        const aiName = AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)];

        const OPPONENT_AVATARS = {
            '司马懿': '../images/opponent-simayi.png',
            '周瑜': '../images/opponent-zhouyu.png',
            'default': '../images/opponent-avatar.png'
        };

        function getOpponentAvatar(name) {
            return OPPONENT_AVATARS[name] || OPPONENT_AVATARS['default'];
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('隆中对弈页面已加载 - 组合效果版');
            clearActStateOnFreshEntry('zhugeState');
            loadDuelState();
            startDuelGame();
            bindEvents();
            document.body.style.display = 'block';
        });

        function loadDuelState() {
            if (isHeroLineCompleted('zhugeLiang')) {
                duelState._locked = true;
                const final = getHeroFinalAttrs('zhugeLiang');
                if (final) {
                    duelState.resources = {
                        food: final.food || 0,
                        gear: final.gear || 0,
                        people: final.people || 0
                    };
                }
            } else {
                duelState.resources = getZhugeResources();
            }
            // 初始化计谋值 = min(3, 总资源数)
            const totalRes = (duelState.resources.food || 0) + (duelState.resources.gear || 0) + (duelState.resources.people || 0);
            duelState.strategyPoints = Math.min(3, Math.max(1, totalRes));
            updateZhugeStats();
        }

        function saveDuelState() {
            if (!duelState._locked) saveZhugeResources(duelState.resources);
        }

        function updateZhugeStats() {
            const foodEl = document.getElementById('stat-food');
            const gearEl = document.getElementById('stat-gear');
            const peopleEl = document.getElementById('stat-people');
            if (foodEl) foodEl.textContent = duelState.resources.food || 0;
            if (gearEl) gearEl.textContent = duelState.resources.gear || 0;
            if (peopleEl) peopleEl.textContent = duelState.resources.people || 0;
        }

        function addDialogue(text, speaker = '玩家') {
            const dialogueLog = document.getElementById('dialogue-log');
            if (!dialogueLog) return;
            const messageDiv = document.createElement('div');
            messageDiv.className = speaker === '诸葛亮' ? 'zhuge-message' : 'player-message';
            const speakerName = speaker === '诸葛亮' ? '诸葛亮' : speaker;
            messageDiv.innerHTML = `<strong>${speakerName}：</strong> ${text}`;
            dialogueLog.appendChild(messageDiv);
            dialogueLog.scrollTop = dialogueLog.scrollHeight;
        }

        function startDuelGame() {
            const actNumberEl = document.getElementById('act-number');
            const actTextEl = document.getElementById('act-text');
            if (actNumberEl) actNumberEl.textContent = '4';
            if (actTextEl) actTextEl.textContent = '四';
            const dialogueLog = document.getElementById('dialogue-log');
            if (dialogueLog) dialogueLog.innerHTML = '';
            const opponentName = duelState._locked ? '一位名将' : aiName;
            const intro = [
                { speaker: '诸葛亮', text: '三幕历练，你已积累粮草、军械与民心。今日便要以此为本，与天下名将一决雌雄。' },
                { speaker: '诸葛亮', text: `你的对手是——${opponentName}。此人亦是运筹帷幄之士，不可轻敌。` },
                { speaker: '诸葛亮', text: '对弈规则：粮草克军械，军械克民心，民心克粮草。三局两胜，胜者方为天下奇才。' },
                { speaker: '诸葛亮', text: '你可单张出战、两张组合齐出、或三张天地人和！每张牌消耗计谋值，善用计谋方能制胜。' }
            ];
            intro.forEach((d, i) => {
                setTimeout(() => {
                    addDialogue(d.text, d.speaker);
                    if (i === intro.length - 1) {
                        setTimeout(() => renderDuelUI(), 1000);
                    }
                }, i * 1500);
            });
        }

        function renderDuelUI() {
            const container = document.getElementById('zhuge-options');
            if (!container) return;
            container.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'zhuge-duel-container';
            wrapper.id = 'duel-wrapper';
            const r = duelState.resources;
            const sp = duelState.strategyPoints;

            wrapper.innerHTML = `
                <div class="zhuge-duel-title">🏯 隆中对弈</div>
                <div class="zhuge-duel-subtitle">三局两胜 · 运筹帷幄 · 组合出牌</div>

                <!-- 计谋值显示 -->
                <div class="strategy-points-bar" id="strategy-bar">
                    <span class="strategy-label">⚡ 计谋值</span>
                    <div class="strategy-orbs" id="strategy-orbs"></div>
                    <span class="strategy-cost-preview" id="cost-preview"></span>
                </div>

                <div class="zhuge-duel-board">
                    <div class="zhuge-duel-side player-side">
                        <img class="duel-side-avatar" src="../images/zhuge-avatar-game.png" alt="诸葛亮" />
                        <div class="zhuge-duel-side-header">🧮 我方</div>
                        <div class="zhuge-duel-hp-text">HP <span id="player-hp">${duelState.playerHP}</span>/100</div>
                        <div class="zhuge-duel-hp-bar"><div class="zhuge-duel-hp-fill" id="player-hp-bar" style="width:${duelState.playerHP}%"></div></div>
                        <div class="zhuge-duel-resources">
                            <span class="zhuge-duel-res-tag food">🍚 粮草 ×${r.food}</span>
                            <span class="zhuge-duel-res-tag gear">⚙️ 军械 ×${r.gear}</span>
                            <span class="zhuge-duel-res-tag people">❤️ 民心 ×${r.people}</span>
                        </div>
                    </div>
                    <div class="zhuge-duel-vs">⚔️</div>
                    <div class="zhuge-duel-side ai-side">
                        <img class="duel-side-avatar" src="${getOpponentAvatar(aiName)}" alt="${aiName}" />
                        <div class="zhuge-duel-side-header">🦊 ${aiName}</div>
                        <div class="zhuge-duel-hp-text">HP <span id="ai-hp">${duelState.aiHP}</span>/100</div>
                        <div class="zhuge-duel-hp-bar"><div class="zhuge-duel-hp-fill" id="ai-hp-bar" style="width:${duelState.aiHP}%"></div></div>
                        <div class="zhuge-duel-resources">
                            <span class="zhuge-duel-res-tag food">🍚 粮草 ×?</span>
                            <span class="zhuge-duel-res-tag gear">⚙️ 军械 ×?</span>
                            <span class="zhuge-duel-res-tag people">❤️ 民心 ×?</span>
                        </div>
                    </div>
                </div>
                <div class="zhuge-duel-round-info">
                    <div class="zhuge-duel-round-num" id="round-display">第 ${duelState.round + 1} 回合 / 共 ${duelState.totalRounds} 回合</div>
                    <div class="zhuge-duel-round-msg" id="round-msg">比分：我方 ${duelState.playerWins} : ${duelState.aiWins} 对手</div>
                </div>
                <div id="duel-log" class="zhuge-duel-log"></div>
                <div class="zhuge-duel-cards" id="duel-cards"></div>
                <div class="zhuge-duel-reveal" id="duel-reveal" style="display:none;"></div>
                <div class="zhuge-duel-actions" id="duel-actions"></div>
            `;
            container.appendChild(wrapper);

            // 渲染计谋值球
            renderStrategyOrbs();

            if (!duelState.isOver) renderCardSelection();
        }

        /** 渲染计谋值球 + 费用预览 */
        function renderStrategyOrbs() {
            const orbsContainer = document.getElementById('strategy-orbs');
            const costPreview = document.getElementById('cost-preview');
            if (!orbsContainer) return;

            orbsContainer.innerHTML = '';
            for (let i = 0; i < duelState.maxStrategy; i++) {
                const orb = document.createElement('div');
                orb.className = 'strategy-orb' + (i < duelState.strategyPoints ? ' filled' : '');
                orb.textContent = i < duelState.strategyPoints ? '★' : '';
                orbsContainer.appendChild(orb);
            }

            // 费用预览
            if (costPreview) {
                const n = duelState.selectedCards.length;
                if (n === 0) {
                    costPreview.textContent = '请选择卡牌';
                    costPreview.className = 'strategy-cost-preview';
                } else {
                    const cost = PLAY_COST[n] || 0;
                    const canAfford = duelState.strategyPoints >= cost;
                    costPreview.textContent = `(${n}张 → ${cost}计谋)`;
                    costPreview.className = 'strategy-cost-preview ' + (canAfford ? 'affordable' : 'too-expensive');
                }
            }
        }

        /** 卡牌选择区 —— 多选模式 */
        function renderCardSelection() {
            const cardsContainer = document.getElementById('duel-cards');
            const actionsContainer = document.getElementById('duel-actions');
            if (!cardsContainer || !actionsContainer) return;
            cardsContainer.innerHTML = '';
            actionsContainer.innerHTML = '';

            const r = duelState.resources;
            const cardTypes = ['food', 'gear', 'people'];
            const selCount = {}; // 统计每种类型被选了几次

            duelState.selectedCards.forEach(t => { selCount[t] = (selCount[t] || 0) + 1; });

            cardTypes.forEach(type => {
                const card = document.createElement('div');
                card.className = 'zhuge-duel-card';
                card.id = `card-${type}`;
                const info = CARD_INFO[type];
                const count = r[type] || 0;
                const selectedTimes = selCount[type] || 0;
                const remainingAfterSelect = count - selectedTimes;

                card.innerHTML = `
                    ${selectedTimes > 0 ? `<div class="card-select-badge">${selectedTimes}</div>` : ''}
                    <div class="zhuge-duel-card-icon">${info.icon}</div>
                    <div class="zhuge-duel-card-name">${info.name}</div>
                    <div class="zhuge-duel-card-type">${info.desc}</div>
                    <div class="zhuge-duel-card-count">剩余：${count}张${selectedTimes > 0 ? ` (已选${selectedTimes})` : ''}</div>
                `;

                if (selectedTimes > 0) {
                    // 已选中的牌 → 始终可点（用于取消选择）
                    card.addEventListener('click', () => selectCard(type));
                } else if (count <= 0 || (remainingAfterSelect <= 0 && duelState.selectedCards.length >= 3)) {
                    card.classList.add('disabled');
                    card.title = count <= 0 ? '该卡牌已用完' : '选择槽位已满';
                } else {
                    card.addEventListener('click', () => selectCard(type));
                }

                if (selectedTimes > 0) card.classList.add('selected');

                cardsContainer.appendChild(card);
            });

            // ===== 操作按钮区 =====
            const n = duelState.selectedCards.length;
            const cost = PLAY_COST[n] || 0;
            const canAfford = duelState.strategyPoints >= cost;
            const hasSelection = n > 0;

            // --- 出战按钮 ---
            let playBtnClass = 'zhuge-duel-btn zhuge-duel-btn-primary';
            let playBtnText = '请选择卡牌';

            if (n === 3) {
                playBtnClass += ' btn-tiandi';
                playBtnText = '🌟 天地和 (' + cost + '计谋)';
            } else if (n === 2) {
                playBtnClass += ' btn-combo';
                playBtnText = '⚔️ 组合出牌 (' + cost + '计谋)';
            } else if (n === 1) {
                playBtnText = '⚔️ 出战 (' + cost + '计谋)';
            }

            const playBtn = document.createElement('button');
            playBtn.className = playBtnClass;
            playBtn.textContent = playBtnText;
            playBtn.id = 'play-btn';
            playBtn.disabled = !hasSelection || !canAfford || duelState.isPlaying;
            playBtn.addEventListener('click', () => playCard());
            actionsContainer.appendChild(playBtn);

            // --- 弃牌按钮（有选中牌时才显示） ---
            if (hasSelection && !duelState._locked && !duelState.discardedThisRound) {
                const discardBtn = document.createElement('button');
                discardBtn.className = 'zhuge-duel-btn btn-discard';
                discardBtn.textContent = '🗑️ 弃牌';
                discardBtn.title = '弃掉选中的牌';
                discardBtn.addEventListener('click', () => showDiscardModal());
                actionsContainer.appendChild(discardBtn);
            }

            if (!duelState.isOver) checkNoCardsLeft();
        }

        /** 选择/取消选择卡牌（多选，最多3张） */
        function selectCard(type) {
            if (duelState.isPlaying) return;

            const idx = duelState.selectedCards.indexOf(type);
            if (idx >= 0) {
                // 已选中 → 取消
                duelState.selectedCards.splice(idx, 1);
            } else {
                // 未选中 → 追加（最多3张）
                if (duelState.selectedCards.length >= 3) return;
                const r = duelState.resources;
                const currentSelCount = duelState.selectedCards.filter(t => t === type).length;
                if ((r[type] || 0) <= currentSelCount) return; // 数量不够
                duelState.selectedCards.push(type);
            }

            // 更新UI
            renderStrategyOrbs();
            renderCardSelection();
        }

        /** 出牌 —— 根据 selectedCards.length 分支处理 */
        function playCard() {
            const n = duelState.selectedCards.length;
            if (n === 0 || duelState.isPlaying || duelState.isOver) return;

            const cost = PLAY_COST[n];
            if (duelState.strategyPoints < cost) return; // 计谋不足

            duelState.isPlaying = true;

            // 扣除计谋值
            duelState.strategyPoints -= cost;

            // 扣除资源
            duelState.selectedCards.forEach(t => {
                duelState.resources[t] = Math.max(0, (duelState.resources[t] || 0) - 1);
            });

            saveDuelState();
            updateZhugeStats();

            // AI出对应数量的牌
            const aiCards = chooseAICards(n);
            duelState.aiCards = aiCards;

            // 判定结果
            const result = determineWinner(duelState.selectedCards, aiCards);

            // 应用伤害
            applyDamage(result, n);

            // 记录回合
            duelState.roundResults.push({
                round: duelState.round,
                playerCards: [...duelState.selectedCards],
                aiCards: [...aiCards],
                result: result.outcome,
                mode: n === 3 ? 'tiandi' : n === 2 ? 'combo' : 'single'
            });

            showReveal(duelState.selectedCards, aiCards, result, () => {
                duelState.round++;
                // 回合结束恢复1点计谋值
                duelState.strategyPoints = Math.min(duelState.maxStrategy, duelState.strategyPoints + 1);
                // 重置本回合弃牌标记
                duelState.discardedThisRound = false;

                if (duelState.playerWins >= 2 || duelState.aiWins >= 2 || duelState.round >= duelState.totalRounds) {
                    duelState.isOver = true;
                    setTimeout(() => onGameEnd(), 500);
                } else {
                    if (checkNoCardsLeft()) return;
                    duelState.selectedCards = [];
                    duelState.aiCards = [];
                    duelState.isPlaying = false;
                    saveDuelState();
                    renderDuelUI();
                }
            });
        }

        /** 根据结果应用伤害 */
        function applyDamage(result, mode) {
            if (mode === 3) {
                // 天地人和——必胜
                duelState.aiHP = Math.max(0, duelState.aiHP - DAMAGE.tiandi.aiDamage);
                duelState.playerWins += DAMAGE.tiandi.playerWinsAdd || 2;
                return;
            }

            const dmg = mode === 2 ? DAMAGE.combo : DAMAGE.single;

            if (result.outcome === 'win') {
                duelState.playerWins++;
                duelState.aiHP = Math.max(0, duelState.aiHP - dmg.win);
            } else if (result.outcome === 'lose') {
                duelState.aiWins++;
                duelState.playerHP = Math.max(0, duelState.playerHP - dmg.lose);
            } else {
                // 平局——各扣一点
                duelState.playerHP = Math.max(0, duelState.playerHP - dmg.drawSelf);
                duelState.aiHP = Math.max(0, duelState.aiHP - dmg.drawAi);
            }
        }

        /**
         * AI出牌 —— 根据数量返回对应张数的牌数组
         * 基于属性微调AI决策倾向，让高属性玩家有轻微优势
         */
        function chooseAICards(count) {
            const types = ['food', 'gear', 'people'];
            const cards = [];

            // 基于属性计算权重（属性越高，AI越倾向出克制它的牌→但玩家该属性高说明资源多）
            const weights = { food: 1, gear: 1, people: 1 };
            const totalAttr = (duelState.resources.food || 0) + (duelState.resources.gear || 0) + (duelState.resources.people || 0);
            if (totalAttr > 0) {
                // 玩家某类资源多 → AI稍微更倾向出能克制它的牌（增加难度）
                weights.food = 1 + (duelState.resources.food || 0) / (totalAttr * 2);   // 粮草多 → AI多出gear
                weights.gear = 1 + (duelState.resources.gear || 0) / (totalAttr * 2);
                weights.people = 1 + (duelState.resources.people || 0) / (totalAttr * 2);
            }

            // 加上胜率加成影响（付费弃牌后玩家优势）
            const advantageBias = duelState.bonusWinRate * 0.01; // 每1%胜率加成转换为AI弱化系数

            for (let i = 0; i < count; i++) {
                const rand = Math.random() - advantageBias; // 玩家有优势时rand变小

                if (rand < 0.45) {
                    // 优先尝试出克制牌
                    // 如果有多张已出的玩家牌，随机挑一张来克制
                    if (duelState.selectedCards.length > i) {
                        const target = duelState.selectedCards[i];
                        cards.push(COUNTERS[target]);
                    } else {
                        cards.push(types[Math.floor(Math.random() * 3)]);
                    }
                } else if (rand < 0.75) {
                    // 加权随机
                    const wTotal = weights.food + weights.gear + weights.people;
                    let roll = Math.random() * wTotal;
                    if (roll < weights.food) cards.push('food');
                    else if (roll < weights.food + weights.gear) cards.push('gear');
                    else cards.push('people');
                } else {
                    // 小概率出相同牌（被克制）
                    if (duelState.selectedCards.length > i) {
                        cards.push(duelState.selectedCards[i]);
                    } else {
                        cards.push(types[Math.floor(Math.random() * 3)]);
                    }
                }
            }

            return cards;
        }

        /**
         * 判定胜负
         * 单张：正常石头剪刀布
         * 组合(2v2)：各自比较，我方胜场多则win
         * 天地人和(3v3)：必胜！
         */
        function determineWinner(playerCards, aiCards) {
            const n = playerCards.length;

            if (n === 3) {
                return { outcome: 'win', detail: 'tiandi' };
            }

            if (n === 2) {
                // 各比较一张
                let pWins = 0, aWins = 0;
                for (let i = 0; i < 2; i++) {
                    const r = singleCompare(playerCards[i], aiCards[i]);
                    if (r === 'win') pWins++;
                    else if (r === 'lose') aWins++;
                }
                if (pWins > aWins) return { outcome: 'win', detail: `${pWins}:0` };
                if (aWins > pWins) return { outcome: 'lose', detail: `0:${aWins}` };
                return { outcome: 'draw', detail: '1:1' };
            }

            // n === 1
            const r = singleCompare(playerCards[0], aiCards[0]);
            return { outcome: r, detail: r };
        }

        /** 单张比较 */
        function singleCompare(pc, ac) {
            if (pc === ac) return 'draw';
            if (COUNTERS[pc] === ac) return 'win';
            return 'lose';
        }

        /** 展示翻牌对比（支持多张） */
        function showReveal(playerCards, aiCards, result, callback) {
            const cardsContainer = document.getElementById('duel-cards');
            const actionsContainer = document.getElementById('duel-actions');
            const revealContainer = document.getElementById('duel-reveal');
            if (cardsContainer) cardsContainer.style.display = 'none';
            if (actionsContainer) actionsContainer.innerHTML = '';
            if (!revealContainer) { callback(); return; }
            revealContainer.style.display = 'flex';
            revealContainer.innerHTML = '';

            const n = playerCards.length;
            const modeLabel = n === 3 ? '🌟 天地人和！' : n === 2 ? '⚔️ 组合对战！' : '⚔️ 对决！';

            let html = `<div style="text-align:center;margin-bottom:10px;font-size:1.2rem;color:#fbbf24;font-weight:bold;">${modeLabel}</div>`;

            // 我方的牌
            html += '<div style="text-align:center;color:#93c5fd;font-size:0.9rem;margin:4px 0;">我方出牌</div>';
            html += '<div class="multi-reveal-cards">';
            playerCards.forEach((t, i) => {
                const info = CARD_INFO[t];
                html += `<div class="multi-reveal-card" style="animation-delay:${i * 0.1}s"><div class="mri-icon">${info.icon}</div><div class="mri-name">${info.name}</div></div>`;
            });
            html += '</div>';

            // VS符号
            html += '<div class="multi-vs-row"><span class="multi-vs-symbol">⚔ VS ⚔</span></div>';

            // 对手的牌
            html += '<div style="text-align:center;color:#fca5a5;font-size:0.9rem;margin:4px 0;">对手出牌</div>';
            html += '<div class="multi-reveal-cards">';
            aiCards.forEach((t, i) => {
                const info = CARD_INFO[t];
                html += `<div class="multi-reveal-card" style="animation-delay:${(i + n) * 0.1}s"><div class="mri-icon">${info.icon}</div><div class="mri-name">${info.name}</div></div>`;
            });
            html += '</div>';

            revealContainer.innerHTML = html;

            // 延迟显示结果
            setTimeout(() => {
                const resultDiv = document.createElement('div');
                resultDiv.style.textAlign = 'center';
                resultDiv.style.padding = '14px';
                resultDiv.style.fontSize = '1.3rem';
                resultDiv.style.fontWeight = 'bold';

                if (result.outcome === 'win') {
                    resultDiv.innerHTML = n === 3
                        ? '🏆 天地人和·必胜之道！对手遭受重创！'
                        : `🎉 我方获胜！<span style="font-size:0.9rem;color:#9ca3af;">(${result.detail})</span>`;
                    resultDiv.style.color = '#51cf66';
                } else if (result.outcome === 'lose') {
                    resultDiv.textContent = `💔 对手获胜！ (${result.detail})`;
                    resultDiv.style.color = '#ff6b6b';
                } else {
                    resultDiv.textContent = `🤝 平局！旗鼓相当。(${result.detail})`;
                    resultDiv.style.color = '#ffd700';
                }
                revealContainer.appendChild(resultDiv);

                updateScoreboard();
                addLogEntry(playerCards, aiCards, result);
            }, 600);

            setTimeout(() => {
                if (revealContainer) revealContainer.style.display = 'none';
                if (cardsContainer) cardsContainer.style.display = 'flex';
                callback();
            }, 2200);
        }

        /** 显示弃牌确认弹窗（纯鼠标操作） */
        function showDiscardModal() {
            if (duelState.selectedCards.length === 0 || duelState.discardedThisRound) return;

            const overlay = document.createElement('div');
            overlay.className = 'discard-modal-overlay';
            overlay.id = 'discard-overlay';

            const n = duelState.selectedCards.length;
            const canPay = duelState.strategyPoints >= 1;

            overlay.innerHTML = `
                <div class="discard-modal">
                    <h3>🗑️ 确认弃牌</h3>
                    <p>将弃掉已选中的 <strong>${n}</strong> 张牌。<br>弃掉的牌将从你的资源中<strong>永久移除</strong>。</p>
                    <div class="discard-modal-options">
                        <button style="background:#4b5563;color:#fff;" onclick="executeDiscard(false)">免费弃牌</button>
                        <button style="background:linear-gradient(135deg,#ec4899,#db2777);color:#fff;" ${canPay ? '' : 'disabled style="opacity:0.4;cursor:not-allowed;"'} onclick="executeDiscard(true)">
                            消耗1计谋弃牌<br><small style="color:#fce7f3;">(+5% 本局胜率)</small>
                        </button>
                        <button style="background:transparent;border:1px solid #64748b;color:#94a3b8;" onclick="closeDiscardModal()">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        /** 执行弃牌 */
        window.executeDiscard = function(paid) {
            if (paid && duelState.strategyPoints < 1) return;

            const cardsToDiscard = [...duelState.selectedCards];

            if (paid) {
                duelState.strategyPoints -= 1;
                duelState.bonusWinRate += 5;
                addDialogue(`诸葛亮："以退为进，妙棋！舍弃眼前的牌，换取了战术优势（胜率+5%）。"`, '诸葛亮');
            } else {
                addDialogue(`诸葛亮："舍得舍得，有舍才有得。"`, '诸葛亮');
            }

            // 移除资源
            cardsToDiscard.forEach(t => {
                duelState.resources[t] = Math.max(0, (duelState.resources[t] || 0) - 1);
            });

            duelState.discardedThisRound = true;
            duelState.selectedCards = [];
            saveDuelState();
            updateZhugeStats();

            closeDiscardModal();
            renderDuelUI();
        };

        /** 关闭弃牌弹窗 */
        window.closeDiscardModal = function() {
            const el = document.getElementById('discard-overlay');
            if (el) el.remove();
        };

        function updateScoreboard() {
            const roundDisplay = document.getElementById('round-display');
            const roundMsg = document.getElementById('round-msg');
            const playerHp = document.getElementById('player-hp');
            const aiHp = document.getElementById('ai-hp');
            const playerHpBar = document.getElementById('player-hp-bar');
            const aiHpBar = document.getElementById('ai-hp-bar');
            if (roundDisplay) roundDisplay.textContent = `第 ${Math.min(duelState.round + 1, duelState.totalRounds)} 回合 / 共 ${duelState.totalRounds} 回合`;
            if (roundMsg) roundMsg.textContent = `比分：我方 ${duelState.playerWins} : ${duelState.aiWins} 对手`;
            if (playerHp) playerHp.textContent = duelState.playerHP;
            if (aiHp) aiHp.textContent = duelState.aiHP;
            if (playerHpBar) playerHpBar.style.width = duelState.playerHP + '%';
            if (aiHpBar) aiHpBar.style.width = duelState.aiHP + '%';
        }

        function addLogEntry(playerCards, aiCards, result) {
            const logContainer = document.getElementById('duel-log');
            if (!logContainer) return;
            const entry = document.createElement('div');
            entry.className = 'zhuge-duel-log-entry';

            const pNames = playerCards.map(t => CARD_INFO[t].icon + CARD_INFO[t].name).join('+');
            const aNames = aiCards.map(t => CARD_INFO[t].icon + CARD_INFO[t].name).join('+');

            const modeTag = playerCards.length === 3 ? '[天人和]' : playerCards.length === 2 ? '[组合]' : '';
            const resultEmoji = result.outcome === 'win' ? '✅' : result.outcome === 'lose' ? '❌' : '🤝';

            entry.textContent = `${resultEmoji} R${duelState.round + 1}${modeTag}: 我方${pNames} vs 对手${aNames}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function checkNoCardsLeft() {
            const r = duelState.resources;
            if (r.food <= 0 && r.gear <= 0 && r.people <= 0) {
                duelState.isOver = true;
                duelState.aiWins = 2;
                addDialogue('诸葛亮："手中无牌，何以对弈？此局……算是输了。"', '诸葛亮');
                setTimeout(() => onGameEnd(), 800);
                return true;
            }
            return false;
        }

        function onGameEnd() {
            const won = duelState.playerWins > duelState.aiWins;
            if (!duelState._locked && won) {
                unlockAchievement('zhuge_duel_master', '隆中对弈', '在诸葛亮线完成隆中对弈卡牌对战');
                saveSoulData('zhugeLiang', {
                    food: duelState.resources.food,
                    gear: duelState.resources.gear,
                    people: duelState.resources.people,
                    roundResults: duelState.roundResults,
                    playerHP: duelState.playerHP,
                    aiHP: duelState.aiHP,
                    playerWins: duelState.playerWins,
                    totalRounds: duelState.totalRounds
                });
                checkAllHeroesAchievement();
            }
            const container = document.getElementById('zhuge-options');
            if (!container) return;
            container.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'zhuge-duel-container';
            const opponentName = aiName;
            if (won) {
                wrapper.innerHTML = `
                    <div class="zhuge-duel-victory" style="position:static;border-radius:12px;">
                        <div class="zhuge-duel-victory-title">🏆 隆中对弈·胜！</div>
                        <div class="zhuge-duel-victory-text">妙算神机，运筹帷幄！你以智谋击败了${opponentName}。</div>
                        <div class="zhuge-duel-victory-stats">
                            最终比分：${duelState.playerWins} : ${duelState.aiWins}<br>
                            我方剩余HP：${duelState.playerHP} | 对手剩余HP：${duelState.aiHP}<br>
                            ${duelState.bonusWinRate > 0 ? '<span style="color:#ec4899;">战术加成：+' + duelState.bonusWinRate + '% 胜率</span>' : ''}
                        </div>
                    </div>
                    <div class="zhuge-duel-actions" style="margin-top:15px;">
                        <button class="zhuge-duel-btn zhuge-duel-btn-primary" onclick="goToAct5()">🪭 进入取舍之道</button>
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="zhuge-duel-victory" style="position:static;border-radius:12px;">
                        <div class="zhuge-duel-victory-title" style="color:#ff6b6b;">💔 对弈落败</div>
                        <div class="zhuge-duel-victory-text">${opponentName}技高一筹。但兵家胜败乃常事。</div>
                        <div class="zhuge-duel-victory-stats">
                            最终比分：${duelState.playerWins} : ${duelState.aiWins}<br>
                            诸葛亮："败而不馁，方为真将。再来一局如何？"
                        </div>
                    </div>
                    <div class="zhuge-duel-actions" style="margin-top:15px;">
                        <button class="zhuge-duel-btn zhuge-duel-btn-primary" onclick="restartGame()">🔄 再来一局</button>
                    </div>
                `;
            }
            container.appendChild(wrapper);
        }

        function restartGame() {
            duelState.resources = getZhugeResources();
            duelState.round = 0;
            duelState.playerWins = 0;
            duelState.aiWins = 0;
            duelState.selectedCards = [];
            duelState.aiCards = [];
            duelState.roundResults = [];
            duelState.isPlaying = false;
            duelState.isOver = false;
            duelState.playerHP = 100;
            duelState.aiHP = 100;
            // 重置计谋值
            const totalRes = (duelState.resources.food || 0) + (duelState.resources.gear || 0) + (duelState.resources.people || 0);
            duelState.strategyPoints = Math.min(3, Math.max(1, totalRes));
            duelState.discardedThisRound = false;
            duelState.bonusWinRate = 0;
            updateZhugeStats();
            renderDuelUI();
        }

        function goToAct5() {
            saveDuelState();
            window.location.href = 'zhuge_act5.html';
        }

        function bindEvents() {
            // 点击弹窗外关闭弃牌弹窗
            document.addEventListener('click', function(e) {
                const overlay = document.getElementById('discard-overlay');
                if (overlay && e.target === overlay) closeDiscardModal();
            });
        }
    </script>
    <script src="../js/level-select.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('zhugeLiang', 4));</script>
</body>
</html>
