<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诸葛亮线 · 游蜀拜师录</title>
    <link rel="icon" type="image/svg+xml" href="../genie.svg">
    <meta name="description" content="诸葛亮线 - 智谋计算的蜀地之旅">
    
    <!-- 引用公共CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- 英雄线公共CSS -->
    <link rel="stylesheet" href="../css/hero-styles.css">
    <!-- 选关系统CSS -->
    <link rel="stylesheet" href="../css/level-select.css">
    <style>:root{--li-bai-primary:#3B82F6}</style>
</head>
<body class="act-bg has-notebook" style="background-image: url('../images/wuhou-temple.jpeg');">
    <!-- 页面顶部 — 固定顶栏（使用li-bai-header类） -->
    <div class="li-bai-header">
        <div class="hero-header">
            <div class="hero-info">
                <h1 class="hero-name">
                    <img class="hero-name-avatar" src="../images/zhuge-avatar-game.png" alt="诸葛亮">
                    诸葛亮 · 卧龙先生
                </h1>
                <p class="hero-title">智谋计算 · 武侯祠</p>
            </div>

            <div class="stats-container" id="zhuge-stats">
                <div class="li-bai-stat">
                    <div class="stat-icon">🍚</div>
                    <div class="stat-label">粮草</div>
                    <div class="stat-value" id="stat-food">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">⚙️</div>
                    <div class="stat-label">军械</div>
                    <div class="stat-value" id="stat-gear">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">❤️</div>
                    <div class="stat-label">民心</div>
                    <div class="stat-value" id="stat-people">0</div>
                </div>
                <div class="li-bai-stat">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-label">探索</div>
                    <div class="stat-value" id="stat-explored">0/2</div>
                </div>
            </div>

            <div class="act-indicator">
                <div class="act-number" id="act-number">3</div>
                <div class="act-text">第 <span id="act-text">三</span> 幕</div>
            </div>

            <!-- 返回首页按钮已移除，由选关面板取代 -->
        </div>
    </div>
    
    <!-- 游戏主内容 -->
    <div class="container">
        <div class="game-scene" id="dialogue-scene">
            <div class="dialogue-container">
                <h3 class="scene-title" id="scene-title">第三幕 · 武侯祠</h3>
                
                <div id="dialogue-log" class="dialogue-log">
                    <!-- 对话内容由JavaScript动态添加 -->
                </div>
                
                <div class="li-bai-options" id="li-bai-options">
                    <!-- 选项按钮由JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引用公共JavaScript -->
    <script src="../js/common.js"></script>
    <!-- 选关系统JS -->
    <script src="../js/level-select.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('zhugeLiang', 3));</script>
    
    <!-- 诸葛亮线第三幕JavaScript -->
    <script>
        // ==================== 诸葛亮线状态变量 ====================
        const zhugeState = {
            currentAct: 3,
            currentStep: 'opening',
            quizScore: 0,
            foodCount: 0,
            gearCount: 0,
            peopleCount: 0,
            exploredOptions: { option1: false, option2: false },
            actFoodChoices: 0,
            actGearChoices: 0,
            actPeopleChoices: 0,
            _isAnswering: false
        };
        
        // ==================== 页面初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('诸葛亮线第三幕页面已加载');
            clearActStateOnFreshEntry('zhugeState');
            loadZhugeState();
            startZhugeThirdAct();
            bindZhugeEvents();
        });
        
        // ==================== 状态管理 ====================
        function loadZhugeState() {
            try {
                const savedState = localStorage.getItem('zhugeState');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    Object.assign(zhugeState, parsed);
                }
                zhugeState.foodCount = parseInt(localStorage.getItem('zhuge_foodCount')) || 0;
                zhugeState.gearCount = parseInt(localStorage.getItem('zhuge_gearCount')) || 0;
                zhugeState.peopleCount = parseInt(localStorage.getItem('zhuge_peopleCount')) || 0;
                
                if (isHeroLineCompleted('zhugeLiang')) {
                    const final = getHeroFinalAttrs('zhugeLiang');
                    if (final) {
                        zhugeState.foodCount = final.food;
                        zhugeState.gearCount = final.gear;
                        zhugeState.peopleCount = final.people;
                        zhugeState._locked = true;
                    }
                }
                updateZhugeStats();
                console.log('诸葛亮线状态已加载', zhugeState._locked ? '(锁定模式)' : '');
            } catch (error) {
                console.error('加载状态失败:', error);
            }
        }
        
        function saveZhugeState() {
            try {
                localStorage.setItem('zhugeState', JSON.stringify(zhugeState));
                localStorage.setItem('zhuge_foodCount', zhugeState.foodCount);
                localStorage.setItem('zhuge_gearCount', zhugeState.gearCount);
                localStorage.setItem('zhuge_peopleCount', zhugeState.peopleCount);
                
                if (typeof gameState !== 'undefined') {
                    gameState.stats.food = zhugeState.foodCount;
                    gameState.stats.gear = zhugeState.gearCount;
                    gameState.stats.people = zhugeState.peopleCount;
                    if (typeof saveGameState === 'function') saveGameState();
                }
                console.log('诸葛亮线状态已保存');
            } catch (error) {
                console.error('保存失败:', error);
            }
        }
        
        function updateZhugeStats() {
            document.getElementById('stat-food').textContent = zhugeState.foodCount;
            document.getElementById('stat-gear').textContent = zhugeState.gearCount;
            document.getElementById('stat-people').textContent = zhugeState.peopleCount;
            
            const exploredCount = (zhugeState.exploredOptions.option1 ? 1 : 0) + 
                                 (zhugeState.exploredOptions.option2 ? 1 : 0);
            document.getElementById('stat-explored').textContent = `${exploredCount}/2`;
            
            document.getElementById('act-number').textContent = zhugeState.currentAct;
            const actText = ['一', '二', '三', '四'][zhugeState.currentAct - 1] || zhugeState.currentAct;
            document.getElementById('act-text').textContent = actText;
        }
        
        // ==================== 打字机队列系统 ====================
        let _typeQueue = [];
        let _isTyping = false;
        
        function waitForTypeQueueEmpty() {
            return new Promise(resolve => {
                function check() {
                    if (_typeQueue.length === 0 && !_isTyping) {
                        resolve();
                    } else {
                        setTimeout(check, 50);
                    }
                }
                check();
            });
        }
        
        function _processTypeQueue() {
            if (_isTyping || _typeQueue.length === 0) return;
            _isTyping = true;
            
            const job = _typeQueue.shift();
            document.body.classList.add('typing-active');
            document.body.classList.remove('choice-showing', 'choice-hovering');
            job.messageDiv.classList.add('li-bai-message-typing');
            
            let charIndex = 0;
            const pureTextLength = job.rawText.replace(/<[^>]*>/g, '').length;
            const baseSpeed = pureTextLength < 20 ? 80 : (pureTextLength < 50 ? 55 : 45);
            
            function typeNextChar() {
                if (charIndex >= job.rawChars.length) {
                    job.cursorSpan.style.display = 'none';
                    job.messageDiv.classList.remove('li-bai-message-typing');
                    
                    if (_typeQueue.length === 0) {
                        document.body.classList.remove('typing-active');
                        _isTyping = false;
                    } else {
                        _processTypeQueue();
                    }
                    
                    job.targetSpan.innerHTML = job.rawText;
                    if (typeof refreshKeywordSpans === 'function') refreshKeywordSpans();
                    
                    job.resolve();
                    return;
                }
                
                const item = job.rawChars[charIndex++];
                job.targetSpan.innerHTML += item.value;
                
                const dialogueLog = document.getElementById('dialogue-log');
                dialogueLog.scrollTop = dialogueLog.scrollHeight;
                
                let delay = baseSpeed;
                if (item.type === 'char' && '，。！？、；：'.includes(item.value)) delay = baseSpeed + 150;
                else if (item.type === 'char' && item.value === ' ') delay = baseSpeed - 10;
                
                setTimeout(typeNextChar, delay);
            }
            
            setTimeout(typeNextChar, 100);
        }
        
        function addZhugeDialogue(text, speaker) {
            const dialogueLog = document.getElementById('dialogue-log');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = speaker === '诸葛亮' ? 'li-bai-message' : 'player-message';
            
            const speakerName = speaker === '诸葛亮' ? '诸葛亮' : '玩家';
            messageDiv.innerHTML = `<strong>${speakerName}：</strong> <span class="type-target"></span><span class="type-cursor">▍</span>`;
            
            dialogueLog.appendChild(messageDiv);
            dialogueLog.scrollTop = dialogueLog.scrollHeight;
            
            if (typeof gameState !== 'undefined' && gameState) {
                if (!Array.isArray(gameState.dialogueHistory)) gameState.dialogueHistory = [];
                gameState.dialogueHistory.push({
                    text: text,
                    speaker: speaker === '诸葛亮' ? 'hero' : 'player',
                    heroName: speaker,
                    timestamp: new Date().toISOString()
                });
                try { localStorage.setItem('game_dialogue_history', JSON.stringify(gameState.dialogueHistory)); } catch(e) {}
            }
            
            const targetSpan = messageDiv.querySelector('.type-target');
            const cursorSpan = messageDiv.querySelector('.type-cursor');
            
            if (speaker !== '诸葛亮') {
                targetSpan.innerHTML = text;
                cursorSpan.style.display = 'none';
                return Promise.resolve();
            }
            
            const rawChars = [];
            let i = 0;
            while (i < text.length) {
                if (text[i] === '<') {
                    let tagEnd = text.indexOf('>', i);
                    if (tagEnd === -1) tagEnd = text.length;
                    rawChars.push({ type: 'tag', value: text.slice(i, tagEnd + 1) });
                    i = tagEnd + 1;
                } else {
                    rawChars.push({ type: 'char', value: text[i] });
                    i++;
                }
            }
            
            return new Promise(resolve => {
                _typeQueue.push({ targetSpan, cursorSpan, messageDiv, rawChars, rawText: text, resolve });
                _processTypeQueue();
            });
        }
        
        function addThinkingBubble(text) {
            const dialogueLog = document.getElementById('dialogue-log');
            const div = document.createElement('div');
            div.className = 'li-bai-thinking';
            div.textContent = text;
            dialogueLog.appendChild(div);
            dialogueLog.scrollTop = dialogueLog.scrollHeight;
            
            return new Promise(resolve => {
                setTimeout(() => {
                    div.classList.add('thinking-fade-out');
                    setTimeout(() => {
                        div.remove();
                        resolve();
                    }, 500);
                }, 1600);
            });
        }
        
        // ==================== 第三幕剧情逻辑 ====================
        async function startZhugeThirdAct() {
            zhugeState.currentAct = 3;
            zhugeState.currentStep = 'opening';
            zhugeState.exploredOptions = { option1: false, option2: false };
            zhugeState.actFoodChoices = 0;
            zhugeState.actGearChoices = 0;
            zhugeState.actPeopleChoices = 0;
            zhugeState._isAnswering = false;
            
            document.getElementById('dialogue-log').innerHTML = '';
            updateZhugeStats();
            
            // 开场白（武侯祠，攻心联）
            await addZhugeDialogue("最后一站，<b>武侯祠</b>。此地所奉，非亮一人，乃'<b>计算</b>'之道。抬头看那副名联——<span class=\"keyword\" data-id=\"zhuge_3_1\" data-name=\"攻心联\">'能攻心则反侧自消，从古知兵非好战'</span>。诸葛亮七擒孟获，不以杀服而以心服。今日电竞战队管理选手心态、运营粉丝社群，本质皆是'攻心'——技术差距可一夜追平，人心向背则需日积月累。", '诸葛亮');
            
            zhugeState.currentStep = 'explore';
            await enterExploreStep();
            saveZhugeState();
        }
        
        async function enterExploreStep() {
            await addZhugeDialogue("最后的问题。这古今'<b>计算</b>'之道，你观之有何异同？", '诸葛亮');
            await waitForTypeQueueEmpty();
            updateZhugeOptions();
        }
        
        function updateZhugeOptions() {
            const optionsContainer = document.getElementById('li-bai-options');
            optionsContainer.innerHTML = '';
            
            const btn1 = document.createElement('button');
            const btn2 = document.createElement('button');
            const btn3 = document.createElement('button');
            
            btn1.className = 'li-bai-option';
            btn2.className = 'li-bai-option';
            btn3.className = 'li-bai-option';
            
            switch(zhugeState.currentStep) {
                case 'explore':
                    btn1.innerHTML = "师傅，'<b>攻心联</b>'说洞察<b>人心</b>，这和现在电竞战队搞<b>心理辅导</b>、运营<b>粉丝</b>，是一回事吗？";
                    btn1.setAttribute('data-type', 'people');
                    btn1.setAttribute('data-mood', 'emotional');
                    btn1.setAttribute('data-risk', 'high');
                    
                    btn2.innerHTML = "好多<b>赛事策划</b>、<b>俱乐部经理</b>也爱来这逛逛，他们来'<b>算</b>'什么的？";
                    btn2.setAttribute('data-type', 'gear');
                    btn2.setAttribute('data-mood', 'rational');
                    btn2.setAttribute('data-risk', 'low');
                    
                    btn3.style.display = 'none';
                    
                    if (zhugeState.exploredOptions.option1) { btn1.disabled = true; btn1.style.opacity = '0.5'; }
                    if (zhugeState.exploredOptions.option2) { btn2.disabled = true; btn2.style.opacity = '0.5'; }
                    
                    btn1.onclick = () => exploreOption1();
                    btn2.onclick = () => exploreOption2();
                    break;
                    
                case 'quiz':
                    btn1.innerHTML = "为纯粹的<b>理性决策模型</b>，注入感性的<b>历史纵深</b>与<b>定力</b>。";
                    btn1.setAttribute('data-risk', 'low');
                    btn2.innerHTML = "寻求一些玄学上的保佑，图个心理安慰。";
                    btn2.setAttribute('data-risk', 'high');
                    btn3.style.display = 'none';
                    btn1.onclick = () => quizAnswer(true);
                    btn2.onclick = () => quizAnswer(false);
                    break;
                    
                case 'choice':
                    btn1.innerHTML = "<b>粮草之基</b>——<b>资源储备</b>永远是战略规划的<b>底层逻辑</b>。";
                    btn1.setAttribute('data-type', 'food');
                    btn1.setAttribute('data-mood', 'rational');
                    btn1.setAttribute('data-risk', 'low');
                    
                    btn2.innerHTML = "<b>军械之锐</b>——<b>技术迭代</b>与<b>装备升级</b>是保持优势的核心。";
                    btn2.setAttribute('data-type', 'gear');
                    btn2.setAttribute('data-mood', 'rational');
                    btn2.setAttribute('data-risk', 'low');
                    
                    btn3.innerHTML = "<b>民心之根</b>——洞悉<b>人性</b>、凝聚<b>人心</b>是千古不变的法则。";
                    btn3.setAttribute('data-type', 'people');
                    btn3.setAttribute('data-mood', 'emotional');
                    btn3.setAttribute('data-risk', 'high');
                    
                    const btn4 = document.createElement('button');
                    btn4.className = 'li-bai-option';
                    btn4.textContent = "前往下一站";
                    btn4.id = 'btn-next-scene';
                    
                    if (zhugeState.actFoodChoices >= 2) { btn1.disabled = true; btn1.style.opacity = '0.5'; }
                    if (zhugeState.actGearChoices >= 2) { btn2.disabled = true; btn2.style.opacity = '0.5'; }
                    if (zhugeState.actPeopleChoices >= 2) { btn3.disabled = true; btn3.style.opacity = '0.5'; }
                    
                    if (zhugeState.foodCount > 0 || zhugeState.gearCount > 0 || zhugeState.peopleCount > 0) {
                        btn4.style.display = 'inline-block';
                        btn4.onclick = nextScene;
                    } else {
                        btn4.style.display = 'none';
                    }
                    
                    btn1.onclick = () => finalChoice('food');
                    btn2.onclick = () => finalChoice('gear');
                    btn3.onclick = () => finalChoice('people');
                    
                    optionsContainer.appendChild(btn1);
                    optionsContainer.appendChild(btn2);
                    optionsContainer.appendChild(btn3);
                    optionsContainer.appendChild(btn4);
                    document.body.classList.add('choice-showing');
                    updateZhugeStats();
                    return;
            }
            
            optionsContainer.appendChild(btn1);
            optionsContainer.appendChild(btn2);
            optionsContainer.appendChild(btn3);
            document.body.classList.add('choice-showing');
            updateZhugeStats();
        }
        
        // 探索选项1 —— 攻心联
        async function exploreOption1() {
            document.getElementById('li-bai-options').innerHTML = '';
            await addZhugeDialogue("师傅，'<b>攻心联</b>'说洞察<b>人心</b>，这和现在电竞战队搞<b>心理辅导</b>、运营<b>粉丝</b>，是一回事吗？", '玩家');
            
            await addThinkingBubble("诸葛亮望着攻心联匾额，神色凝重。");
            
            await addZhugeDialogue("管理之核，无非'<b>人</b>'与'<b>事</b>'。昔年治军需察<b>士气</b>、安<b>民心</b>，此为'<b>攻心</b>'；今朝带队亦需调选手心态、聚粉丝向心，此亦'<b>攻心</b>'。<span class=\"keyword\" data-id=\"zhuge_3_1\" data-name=\"攻心联\">攻心联</span>所书'能攻心则反侧自消'，千年不易。电竞战队做心理辅导、运营社群，都是在'攻心'——因为<b>对象虽异，人性相通</b>。", '诸葛亮');
            
            zhugeState.exploredOptions.option1 = true;
            updateZhugeStats();
            checkAllExplored();
            saveZhugeState();
        }
        
        // 探索选项2 —— 文化校准
        async function exploreOption2() {
            document.getElementById('li-bai-options').innerHTML = '';
            await addZhugeDialogue("好多<b>赛事策划</b>、<b>俱乐部经理</b>也爱来这逛逛，他们来'<b>算</b>'什么的？", '玩家');
            
            await addThinkingBubble("诸葛亮闭目片刻，似在推演某种格局。");
            
            await addZhugeDialogue("在瞬息万变、<b>数据为王</b>的行业里，决策者亦需在厚重的时空中寻找'<b>定力</b>'。他们来此，非为占卜，而是进行一种<span class=\"keyword\" data-id=\"zhuge_3_2\" data-name=\"文化校准\">'文化校准'</span>。诸葛亮自称'臣本布衣，躬耕于南阳'，始终不忘出处。在一个瞬息万变的行业里，'文化校准'就是提醒自己：<b>数据之上，还有道义；算法之外，还有人心</b>。", '诸葛亮');
            
            zhugeState.exploredOptions.option2 = true;
            updateZhugeStats();
            checkAllExplored();
            saveZhugeState();
        }
        
        async function checkAllExplored() {
            const exploredCount = (zhugeState.exploredOptions.option1 ? 1 : 0) + 
                                 (zhugeState.exploredOptions.option2 ? 1 : 0);
            
            if (exploredCount === 2) {
                setTimeout(() => {
                    zhugeState.currentStep = 'quiz';
                    enterQuizStep();
                }, 1000);
            } else {
                await waitForTypeQueueEmpty();
                updateZhugeOptions();
            }
        }
        
        async function enterQuizStep() {
            await addZhugeDialogue("最终验证。电竞从业者于武侯祠中寻求'<b>文化校准</b>'，其本质是为什么补充'<b>参数</b>'？", '诸葛亮');
            zhugeState.currentStep = 'quiz';
            await waitForTypeQueueEmpty();
            updateZhugeOptions();
            saveZhugeState();
        }
        
        async function quizAnswer(isCorrect) {
            if (zhugeState._isAnswering) return;
            zhugeState._isAnswering = true;
            
            document.getElementById('li-bai-options').innerHTML = '';
            
            if (isCorrect) {
                await addZhugeDialogue("为纯粹的<b>理性决策模型</b>，注入感性的<b>历史纵深</b>与<b>定力</b>。", '玩家');
                await addThinkingBubble("诸葛亮微微颔首，眼中闪过赞许。");
                await addZhugeDialogue("<b>计算无误</b>。诸葛亮'<span class=\"keyword\" data-id=\"zhuge_3_3\" data-name=\"元计算\">隆中对</span>'未出茅庐而知天下三分，这是最高层级的'计算'——计算的是大势，而非一城一池。电竞决策者来武侯祠，做的正是'元计算'：<b>在历史的纵深中测算当下决策的重量</b>，避免成为数据洪流中没有方向的浮萍。<b>理性与感性</b>，<b>数据与人文</b>，本就是一体两面。", '诸葛亮');
                zhugeState.quizScore += 1;
            } else {
                await addZhugeDialogue("寻求一些玄学上的保佑，图个心理安慰。", '玩家');
                await addThinkingBubble("诸葛亮长叹一声。");
                await addZhugeDialogue("若决策依赖玄学，这行业早该倾覆了。你的思考，需要更深的底层逻辑。正解是'注入历史纵深与定力'。", '诸葛亮');
            }
            
            zhugeState.currentStep = 'choice';
            await enterChoiceStep();
            saveZhugeState();
        }
        
        async function enterChoiceStep() {
            await addZhugeDialogue("此行终结。于你而言，从这古今'<b>计算</b>'之道中，感悟最深的是什么？", '诸葛亮');
            zhugeState.currentStep = 'choice';
            await waitForTypeQueueEmpty();
            updateZhugeOptions();
            saveZhugeState();
        }
        
        async function finalChoice(type) {
            document.getElementById('li-bai-options').innerHTML = '';
            
            if (type === 'food' && zhugeState.actFoodChoices >= 2) {
                await addZhugeDialogue("<b>粮草之基</b>——<b>资源储备</b>永远是战略规划的<b>底层逻辑</b>。", '玩家');
                await addZhugeDialogue("你又择粮草...根基稳固，方能经风雨。换条路走吧。", '诸葛亮');
                await waitForTypeQueueEmpty();
                updateZhugeOptions();
                return;
            }
            if (type === 'gear' && zhugeState.actGearChoices >= 2) {
                await addZhugeDialogue("<b>军械之锐</b>——<b>技术迭代</b>与<b>装备升级</b>是保持优势的核心。", '玩家');
                await addZhugeDialogue("军械...你三次都倾向锐利之物。锋芒毕露时，切记护己。换个方向？", '诸葛亮');
                await waitForTypeQueueEmpty();
                updateZhugeOptions();
                return;
            }
            if (type === 'people' && zhugeState.actPeopleChoices >= 2) {
                await addZhugeDialogue("<b>民心之根</b>——洞悉<b>人性</b>、凝聚<b>人心</b>是千古不变的法则。", '玩家');
                await addZhugeDialogue("民心...始终如一的选择。但也可尝试其他路径。", '诸葛亮');
                await waitForTypeQueueEmpty();
                updateZhugeOptions();
                return;
            }
            
            if (type === 'food') {
                zhugeState.actFoodChoices += 1;
                await addZhugeDialogue("<b>粮草之基</b>——<b>资源储备</b>永远是战略规划的<b>底层逻辑</b>。", '玩家');
                await addThinkingBubble("诸葛亮抚须沉吟。");
                if (zhugeState.actFoodChoices === 1) {
                    await addZhugeDialogue("善。你已触达'<b>计算</b>'的本质。<b>厚积而薄发</b>。", '诸葛亮');
                } else {
                    await addZhugeDialogue("你又择粮草...根基稳固，方能经风雨。稳者为王。", '诸葛亮');
                    if (typeof unlockAchievement === 'function') unlockAchievement('zhuge_food_repeat');
                }
                if (!zhugeState._locked) zhugeState.foodCount += 1;
            } else if (type === 'gear') {
                zhugeState.actGearChoices += 1;
                await addZhugeDialogue("<b>军械之锐</b>——<b>技术迭代</b>与<b>装备升级</b>是保持优势的核心。", '玩家');
                await addThinkingBubble("诸葛亮目光如炬。");
                if (zhugeState.actGearChoices === 1) {
                    await addZhugeDialogue("不错。<b>利器在手，天下可图</b>。你找到了锋刃。", '诸葛亮');
                } else {
                    await addZhugeDialogue("军械...你对利器的追求确实执着。然兵贵胜而非贵久，当知收敛。", '诸葛亮');
                    if (typeof unlockAchievement === 'function') unlockAchievement('zhuge_gear_repeat');
                }
                if (!zhugeState._locked) zhugeState.gearCount += 1;
            } else {
                zhugeState.actPeopleChoices += 1;
                await addZhugeDialogue("<b>民心之根</b>——洞悉<b>人性</b>、凝聚<b>人心</b>是千古不变的法则。", '玩家');
                await addThinkingBubble("诸葛亮肃然起身，深深作揖。");
                if (zhugeState.actPeopleChoices === 1) {
                    await addZhugeDialogue("难得。<b>得人心者得天下</b>，你已触摸万象归宗的根源。", '诸葛亮');
                } else {
                    await addZhugeDialogue("民心...始终如一的选择。可知你已懂得治世之本，难能可贵。", '诸葛亮');
                    if (typeof unlockAchievement === 'function') unlockAchievement('zhuge_people_repeat');
                }
                if (!zhugeState._locked) zhugeState.peopleCount += 1;
            }
            
            saveZhugeState();
            await waitForTypeQueueEmpty();
            updateZhugeOptions();
        }
        
        async function nextScene() {
            await addZhugeDialogue("前往下一站", '玩家');
            await addThinkingBubble("诸葛亮望向远方，羽扇轻摆。");
            await addZhugeDialogue("好！游蜀之旅至此告一段落。接下来，便是实战——<b>隆中对弈</b>！", '诸葛亮');
            
            saveProgress('zhugeLiang', 4);
            saveZhugeState();
            window.location.href = "zhuge_act4_game.html";
        }
        
        // ==================== 事件绑定 ====================
        function bindZhugeEvents() {
            // 返回首页按钮已移除（选关面板取代）
            
            const optionsContainer = document.getElementById('li-bai-options');
            if (optionsContainer) {
                optionsContainer.addEventListener('mouseover', function(e) {
                    const btn = e.target.closest('.li-bai-option');
                    if (!btn || btn.disabled) return;
                    document.body.classList.add('choice-hovering');
                    const mood = btn.getAttribute('data-mood');
                    if (mood === 'rational') document.body.classList.add('choice-hover-rational');
                    else if (mood === 'emotional') document.body.classList.add('choice-hover-emotional');
                });
                optionsContainer.addEventListener('mouseout', function() {
                    document.body.classList.remove('choice-hovering', 'choice-hover-rational', 'choice-hover-emotional');
                });
            }

            if (typeof initNotebook === 'function') initNotebook();
            if (typeof refreshKeywordSpans === 'function') refreshKeywordSpans();
        }
    </script>
