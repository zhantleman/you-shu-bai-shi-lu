<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>单骑救主·节点突围</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/level-select.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 对话框样式 ===== */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dialog-container {
            max-width: 700px;
            width: 100%;
            background: linear-gradient(145deg, rgba(30, 40, 70, 0.95), rgba(20, 25, 50, 0.98));
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .character-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: block;
            object-fit: cover;
            border: 3px solid #ffd700;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .dialog-name {
            text-align: center;
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .dialog-text {
            line-height: 1.9;
            font-size: 17px;
            color: #e8e8e8;
            margin-bottom: 25px;
            text-align: left;
            min-height: 120px;
        }

        .dialog-options {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .dialog-btn {
            padding: 14px 28px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .dialog-btn-primary {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
        }

        .dialog-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
        }

        /* ===== 游戏主容器 ===== */
        .game-wrapper {
            position: relative;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 10px;
            height: calc(100vh - 30px);
        }

        /* ===== 顶部信息栏 ===== */
        .game-header {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
        }

        /* ===== 游戏画布 ===== */
        .canvas-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: url('../images/battlefield-bg.png') center/cover no-repeat;
            border-radius: 15px;
            border: 2px solid rgba(255, 215, 0, 0.2);
        }

        #gameCanvas {
            width: 100%;
            cursor: pointer;
            touch-action: none;
            /* 高度由 JS resizeCanvas 按 GRID_RATIO 计算 */
            display: block;
        }

        /* ===== 底部操作栏 ===== */
        .game-controls {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            min-width: 110px;
        }

        .attack-btn {
            border-color: #e74c3c;
            color: #e74c3c;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .attack-btn::before {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            background: url('../images/attack-icon.png') center/contain no-repeat;
        }

        .attack-btn:hover:not(:disabled) {
            background: #e74c3c;
            color: #fff;
            transform: scale(1.05);
        }

        .skill-btn {
            border-color: #f39c12;
            color: #f39c12;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .skill-btn::before {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            background: url('../images/skill-icon.png') center/contain no-repeat;
        }

        .skill-btn:hover:not(:disabled) {
            background: #f39c12;
            color: #1a1a2e;
            transform: scale(1.05);
        }

        .skill-btn.ready {
            animation: skillPulse 1s infinite;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.6);
        }

        @keyframes skillPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(243, 156, 18, 0.6); }
            50% { box-shadow: 0 0 35px rgba(243, 156, 18, 1); }
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 结果弹窗 ===== */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-card {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(145deg, rgba(40, 50, 80, 0.95), rgba(25, 30, 55, 0.98));
            border-radius: 20px;
            border: 3px solid;
            padding: 40px;
            text-align: center;
            animation: resultSlideIn 0.5s ease-out;
        }

        @keyframes resultSlideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .result-card.victory { border-color: #ffd700; }
        .result-card.defeat { border-color: #e74c3c; }

        .result-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .result-title.victory { color: #ffd700; }
        .result-title.defeat { color: #e74c3c; }

        .result-stats {
            margin: 25px 0;
            text-align: left;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
        }

        .result-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-stat-row:last-child {
            border-bottom: none;
        }

        .reward-display {
            font-size: 26px;
            color: #ffd700;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
        }

        .next-btn {
            padding: 15px 45px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #27ae60, #2980b9);
            color: #fff;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.5);
        }

        /* ===== 响应式适配 ===== */
        @media (max-width: 600px) {
            body { padding: 5px; }
            
            .dialog-container { padding: 20px; }
            .dialog-name { font-size: 20px; }
            .dialog-text { font-size: 15px; min-height: 90px; }
            
            .game-header { 
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                padding: 8px;
            }
            
            .stat-value { font-size: 18px; }
            .stat-label { font-size: 10px; }
            
            .game-controls { gap: 6px; padding: 8px; }
            .action-btn { 
                padding: 10px 16px; 
                font-size: 13px;
                min-width: 90px;
            }
            
            .result-card { padding: 25px; }
            .result-title { font-size: 28px; }
        }

        /* ===== 提示信息 ===== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffd700;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 3000;
            animation: toastFade 1.5s ease-out forwards;
            pointer-events: none;
            border: 2px solid #ffd700;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ===== 技能激活特效层 ===== */
        .skill-effect-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .skill-effect-overlay.active {
            opacity: 1;
            background: radial-gradient(circle at var(--zx) var(--zy), 
                rgba(255, 215, 0, 0.3) 0%, 
                transparent 60%);
            animation: skillGlow 0.5s infinite alternate;
        }

        @keyframes skillGlow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

    </style>
</head>
<body>

<!-- ==================== 对话开场区域 ==================== -->
<div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog-container">
        <img class="character-avatar" src="../images/zhaoyun-avatar-game.png" alt="赵云">
        <div class="dialog-name">赵云·子龙</div>
        <div class="dialog-text" id="dialogText"></div>
        <div class="dialog-options" id="dialogOptions"></div>
    </div>
</div>

<!-- ==================== 游戏主体区域 ==================== -->
<div class="game-wrapper" id="gameWrapper">
    <!-- 顶部状态栏 -->
    <div class="game-header" id="gameHeader">
        <div class="stat-item">
            <div class="stat-label">⏱️ 倒计时</div>
            <div class="stat-value" id="timerDisplay">180</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">❤️ 守护值(A城)</div>
            <div class="stat-value" id="healthDisplay">6</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">🏰 B城血量</div>
            <div class="stat-value" id="bossHealthDisplay">100</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">⚡ 勇气充能</div>
            <div class="stat-value" id="energyDisplay">0/7</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">🗡️ 攻击次数</div>
            <div class="stat-value" id="attackCountDisplay">0/7</div>
        </div>
    </div>

    <!-- 游戏画布容器 -->
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div class="skill-effect-overlay" id="skillEffect"></div>
    </div>

    <!-- 底部操作栏 -->
    <div class="game-controls" id="gameControls">
        <button class="action-btn attack-btn" id="attackBtn" disabled>进攻B城</button>
        <button class="action-btn skill-btn" id="skillBtn" disabled>七进七出 [未就绪]</button>
    </div>
</div>

<!-- ==================== 结果弹窗区域 ==================== -->
<div class="result-overlay" id="resultOverlay">
    <div class="result-card" id="resultCard">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-stats" id="resultStats"></div>
        <div class="reward-display" id="rewardDisplay"></div>
        <button class="next-btn" id="nextBtn">继续征程 →</button>
    </div>
</div>

<script src="../js/common.js"></script>
<!-- 选关系统JS -->
<script src="../js/level-select.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => LevelSelect.initPanel('zhaoYun', 4));</script>
<script>
// ============================================================
// 全局配置常量
// ============================================================
const CONFIG = {
    // 地图参数（16列×18行，x∈[1,14], y∈[0,17], 比例 8:9）
    GRID_COLS: 16,
    GRID_ROWS: 18,
    NODE_RADIUS: 0.35,  // 相对网格大小

    // 时间参数
    TOTAL_TIME: 180,         // 总时长(秒)
    WAVE_INTERVAL: 15000,    // 波次间隔(毫秒)
    ENEMY_SPAWN_GAP: 3000,   // 同波小兵间隔(毫秒)
    
    // 速度参数
    MOVE_SPEED: 350,         // 移动速度(毫秒/节点) - 保留作兼容
    HOP_DURATION: 130,      // 单格飞行时长(毫秒)
    PAUSE_DURATION: 70,     // 格上停顿时长(毫秒)，技能激活时跳过
    ENEMY_SPEED: 1000,       // 小兵速度

    SKILL_ATTACK_DAMAGE: 10, // 技能攻击伤害
    VICTORY_ATTACKS: 20,     // 胜利需攻击次数(100血量/5伤害=20次)

    SKILL_DURATION: 5000,    // 技能持续时间
    SKILL_COOLDOWN: 5000,    // 技能冷却时间
    SPEED_MULTIPLIER: 2,     // 技能加速倍率
    
    // 每波小兵数
    ENEMIES_PER_WAVE: 2

// ============================================================
// 地图数据结构定义
// ============================================================
const MAP_DATA = {
    // ===== 横向连接层 =====
    // 风格参考：王者荣耀5v5 — 中路直通、边路非对称内弯
    horizontalLayers: [
        // 顶部横贯：第0行 — 三路终点互通
{ y: 0, nodes: [
    {x:2,y:0}, {x:3,y:0}, {x:4,y:0}, {x:5,y:0}, {x:6,y:0}, {x:7,y:0},

        // 中段横贯（河道）：第11行 — 三路互通，战略枢纽
        { y: 11, nodes: [

        B: { x: 3, y: 17 },

            // B城 → 河道（沿右侧直线北上）
            { x: 13, y: 16 }, { x: 13, y: 15 }, { x: 13, y: 14 },

// ============================================================
// 全局游戏状态
// ============================================================
let battleState = {
    // 游戏阶段：'dialog' | 'playing' | 'victory' | 'defeat'
    phase: 'dialog',
    
    // 时间相关
    timeLeft: CONFIG.TOTAL_TIME,
    lastTime: 0,
    
    // 数值属性
    guardHealth: CONFIG.INITIAL_GUARD,
    bossHP: CONFIG.INITIAL_BOSS_HP,
    energy: 0,
    attackCount: 0,
    
    // 统计数据(用于评分)
    stats: {
        enemiesBlocked: 0,     // 格挡成功次数
        attacksMade: 0,        // 攻击次数

    // 赵云位置与移动（初始在河道横贯层中路：y=11,x=8）

    // 技能状态
    isSkillActive: false,
    skillEndTime: 0,
    skillCooldownUntil: 0,
    
    // ★ 碰撞检测状态
    lastCollisionTime: 0,  // 上次碰撞时间（用于冷却）
    
    // 小兵管理
    enemies: [],                  // 存活的小兵列表
    nextEnemyId: 1,               // 小兵ID计数器
    waveCount: 0,                 // 已生成波次
    lastWaveTime: 0,              // 上次出兵时间
    
    // 地图渲染
    canvas: null,
    ctx: null,
    cellSize: 0,                  // 网格单元像素大小
    offsetX: 0,
    offsetY: 0
};

// 定时器引用
let gameLoopId = null;
let timerInterval = null;

// ★ 素材资源管理器（图片+音效）
const ASSETS = {
    img: {},
    sfx: {},
    
    // 预加载所有图片
    loadImages(callback) {
        const list = {
            player: '../images/zhaoyun-avatar-game.png',

            cityAlly: '../images/city-ally.png',
            cityEnemy: '../images/city-enemy.png'
        };
        let loaded = 0;
        const total = Object.keys(list).length;
        for (const [key, src] of Object.entries(list)) {
            const img = new Image();
            img.onload = () => { loaded++; if (loaded === total && callback) callback(); };

            img.src = src;
            this.img[key] = img;
        }
        if (total === 0 && callback) callback();
    },
    
    // 预加载所有音效
    loadSounds() {

            defeat: '../images/sfx-defeat.wav',

        };

            catch(e) { console.warn('加载音效失败:', key); }
        }

    play(name) {
        try {

            if (snd) { snd.currentTime = 0; snd.play().catch(()=>{}); }
        } catch(e) {}
    }
};

function resizeCanvas() {
    const container = document.querySelector('.canvas-container');
    const containerW = container.clientWidth;
    const ratio = CONFIG.GRID_ROWS / CONFIG.GRID_COLS;  // 18/16 = 1.125
    
    const canvasW = containerW;
    const canvasH = containerW * ratio;  // ★ 按 16:18 比例计算高度
    
    battleState.canvas.width = canvasW;
    battleState.canvas.height = canvasH;
    
    // cellSize基于宽度计算，高度自动适配
    battleState.cellSize = canvasW / CONFIG.GRID_COLS;
    battleState.offsetX = 0;
    battleState.offsetY = 0;
}

function startGame() {

// 输入事件绑定

function bindInputEvents() {
    const canvas = battleState.canvas;
    
    // 鼠标点击
    canvas.addEventListener('click', handleCanvasClick);
    
    // ★ 鼠标悬停检测（高亮反馈）
    canvas.addEventListener('mousemove', handleCanvasHover);
    canvas.addEventListener('mouseleave', () => { hoveredNode = null; });
    
    // 触摸事件(手机端)
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        handleCanvasClick({ 
            clientX: touch.clientX, 
            clientY: touch.clientY 
        });
    });
    
    // 进攻按钮
    document.getElementById('attackBtn').addEventListener('click', handleAttack);
    
    // 技能按钮
    document.getElementById('skillBtn').addEventListener('click', activateSkill);
    
    // 继续按钮
    document.getElementById('nextBtn').addEventListener('click', goToNextAct);
}

function handleCanvasClick(e) {
    if (battleState.phase !== 'playing') return;
    
    const rect = battleState.canvas.getBoundingClientRect();
    const scaleX = battleState.canvas.width / rect.width;
    const scaleY = battleState.canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;
    
    // ★ 像素空间直接距离检测（避免CSS缩放导致的坐标转换误差）
    const clickedNode = findNodeAtPixel(clickX, clickY);
    if (!clickedNode) {
        showToast('请点击路径上的节点！');
        return;
    }
    
    // 如果点击的是当前节点，忽略
    if (clickedNode.x === Math.round(battleState.playerPos.x) && 
        clickedNode.y === Math.round(battleState.playerPos.y)) {
        return;
    }
    
    // 设置目标并寻路
    setMoveTarget(clickedNode);
}

// ★ 鼠标悬停处理（高亮可点击节点）
function handleCanvasHover(e) {
    if (battleState.phase !== 'playing') {
        hoveredNode = null;
        return;
    }
    
    const rect = battleState.canvas.getBoundingClientRect();
    const scaleX = battleState.canvas.width / rect.width;
    const scaleY = battleState.canvas.height / rect.height;
    const hoverX = (e.clientX - rect.left) * scaleX;
    const hoverY = (e.clientY - rect.top) * scaleY;
    
    hoveredNode = findNodeAtPixel(hoverX, hoverY) || null;
}

/**
 * ★ 像素空间节点查找：遍历所有节点，计算与点击位置的欧氏距离
 * 彻底避免CSS缩放导致的网格坐标转换偏移问题
 */
function findNodeAtPixel(px, py) {
    const cs = battleState.cellSize;
    const allNodes = getAllNodes();
    let closest = null;
    let closestDist = cs * 1.2;  // 阈值：约1.2个格子半径
    
    for (const node of allNodes) {
        const nx = (node.x + 0.5) * cs;  // 与绘制坐标完全一致
        const ny = (node.y + 0.5) * cs;
        const dist = Math.sqrt((px - nx) ** 2 + (py - ny) ** 2);
        if (dist < closestDist) {
            closestDist = dist;
            closest = node;
        }
    }
    return closest;
}

// ============================================================
// 寻路系统(BFS)
// ============================================================
function buildGraph() {
    const graph = {};
    
    // 添加所有节点到图中
    const allNodes = getAllNodes();
    allNodes.forEach(node => {
        const key = `${node.x},${node.y}`;
        graph[key] = [];
    });
    
    // 构建边(连接相邻节点)
    
    // 所有横向层的水平连接
    MAP_DATA.horizontalLayers.forEach(layer => {
        for (let i = 0; i < layer.nodes.length - 1; i++) {
            addEdge(graph, layer.nodes[i], layer.nodes[i + 1]);
        }
    });
    
    // 左竖路连接
    addPathEdges(graph, MAP_DATA.leftPath.B, MAP_DATA.leftPath.nodes, MAP_DATA.leftPath.A);
    
    // 中竖路连接
    addPathEdges(graph, MAP_DATA.middlePath.B, MAP_DATA.middlePath.nodes, MAP_DATA.middlePath.A);
    
    // 右竖路连接
    addPathEdges(graph, MAP_DATA.rightPath.B, MAP_DATA.rightPath.nodes, MAP_DATA.rightPath.A);
    
    return graph;
}

function addEdge(graph, node1, node2) {
    const key1 = `${node1.x},${node1.y}`;
    const key2 = `${node2.x},${node2.y}`;
    
    if (graph[key1] && graph[key2]) {
        graph[key1].push(node2);
        graph[key2].push(node1);
    }
}

function addPathEdges(graph, B, nodes, A) {
    // B -> 第一个节点
    addEdge(graph, B, nodes[0]);
    
    // 节点间依次连接
    for (let i = 0; i < nodes.length - 1; i++) {
        addEdge(graph, nodes[i], nodes[i + 1]);
    }
    
    // 最后一个节点 -> A
    if (nodes.length > 0) {
        addEdge(graph, nodes[nodes.length - 1], A);
    }
}

function bfs(start, end) {
    const graph = buildGraph();
    const startKey = `${Math.round(start.x)},${Math.round(start.y)}`;
    const endKey = `${Math.round(end.x)},${Math.round(end.y)}`;
    
    if (!graph[startKey] || !graph[endKey]) return [];
    
    const queue = [[start]];
    const visited = new Set([startKey]);
    
    while (queue.length > 0) {
        const path = queue.shift();
        const current = path[path.length - 1];
        const currentKey = `${Math.round(current.x)},${Math.round(current.y)}`;
        
        if (currentKey === endKey) {
            return path;
        }
        
        const neighbors = graph[currentKey] || [];
        for (const neighbor of neighbors) {
            const neighborKey = `${neighbor.x},${neighbor.y}`;
            if (!visited.has(neighborKey)) {
                visited.add(neighborKey);
                queue.push([...path, neighbor]);
            }
        }
    }
    
    return []; // 无路径
}

// ============================================================
// 移动系统
// ============================================================
function setMoveTarget(targetNode) {
    // 检查路径合法性(技能期间无视小兵)
    if (!battleState.isSkillActive) {
        const path = bfs(battleState.playerPos, targetNode);
        if (path.length === 0) {
            showToast('无法到达该节点！');
            return;
        }
        
        // 检查路径上是否有小兵
        const hasEnemyOnPath = path.some(pos => hasEnemyAt(pos.x, pos.y));
        if (hasEnemyOnPath) {
            showToast('路径上有敌人，无法通行！(开启技能可穿越)');
            return;
        }
        
        // 检查目标是否有小兵
        if (hasEnemyAt(targetNode.x, targetNode.y)) {
            showToast('目标节点有敌人！(开启技能可穿越)');
            return;
        }
    }
    
    // 设置新目标
    battleState.targetPos = targetNode;
    battleState.movePath = bfs(battleState.playerPos, targetNode);
    
    if (battleState.movePath.length > 0) {
        battleState.isMoving = true;
        battleState.currentNodeIndex = 0;
        battleState.moveProgress = 0;
        battleState.movePhase = 'hop';
        battleState.hopProgress = 0;
    }
}

function updateMovement(deltaTime) {
    if (!battleState.isMoving || battleState.movePath.length < 2) return;

    // 技能激活时跳过停顿阶段，高速连续冲刺
    const isDashing = battleState.isSkillActive;
    const hopSpeed = isDashing ? CONFIG.HOP_DURATION / CONFIG.SPEED_MULTIPLIER : CONFIG.HOP_DURATION;
    const pauseSpeed = CONFIG.PAUSE_DURATION;

    if (battleState.movePhase === 'hop') {
        // ===== 飞行阶段 =====
        battleState.hopProgress += deltaTime / hopSpeed;

        while (battleState.hopProgress >= 1 &&
               battleState.currentNodeIndex < battleState.movePath.length - 1) {
            battleState.hopProgress -= 1;
            battleState.currentNodeIndex++;

            // 到达终点
            if (battleState.currentNodeIndex >= battleState.movePath.length - 1) {
                const endNode = battleState.movePath[battleState.movePath.length - 1];
                battleState.playerPos = { ...endNode };
                battleState.isMoving = false;
                battleState.targetPos = null;
                battleState.movePath = [];
                checkArrivalEffects();
                updateButtonStates();
                return;
            }

            // 到达中间节点 → 进入停顿（技能冲刺时跳过）
            if (!isDashing) {
                battleState.movePhase = 'pause';
                battleState.hopProgress = 0;
                // 停顿时位置精确落在当前节点
                const node = battleState.movePath[battleState.currentNodeIndex];
                battleState.playerPos = { ...node };
                return;
            }
            // 技能冲刺：不停顿，继续下一段hop
        }

        // hop插值：ease-out曲线 + 更新显示位置
        if (battleState.isMoving && battleState.currentNodeIndex < battleState.movePath.length - 1) {
            const from = battleState.movePath[battleState.currentNodeIndex];
            const to = battleState.movePath[battleState.currentNodeIndex + 1];
            // ease-out: 先快后慢，落地时有减速感
            const t = battleState.hopProgress;
            const easeOut = 1 - Math.pow(1 - t, 3);
            battleState.playerPos.x = from.x + (to.x - from.x) * easeOut;
            battleState.playerPos.y = from.y + (to.y - from.y) * easeOut;
        }

    } else if (battleState.movePhase === 'pause') {
        // ===== 停顿阶段 =====
        battleState.hopProgress += deltaTime / pauseSpeed;

        if (battleState.hopProgress >= 1) {
            // 停顿结束，进入下一格飞行
            battleState.movePhase = 'hop';
            battleState.hopProgress = 0;
        }
    }
}

/**
 * ★ 每帧格挡扫描：当赵云位于任意A城附近(≤1.5格)时，
 * 自动拦截已到达或即将到达该路A城的小兵。
 * 这是对 handleEnemyReachA 的补充，防止时序竞争导致的漏怪。
 */
function scanAndBlockEnemiesNearA() {
    const px = battleState.playerPos.x;
    const py = battleState.playerPos.y;

    // ★ 步骤1：判断赵云是否在A城本体（±0.6格容错）
    const eps = 0.6;
    const aNodes = [MAP_DATA.leftPath.A, MAP_DATA.middlePath.A, MAP_DATA.rightPath.A];
    const playerOnA = aNodes.some(a => Math.abs(px - a.x) < eps && Math.abs(py - a.y) < eps);
    
    if (!playerOnA) return;  // 不在A城，跳过
    
    // ★ 步骤2：找出所有靠近A城（≤1.5格）且尚未被处理的敌人
    const blocked = [];
    for (const enemy of battleState.enemies) {
        if (enemy.shouldRemove || enemy._blockedByScanner) continue;
        
        // 兜底：已到达终点但未被清除的敌人（防御性检查）
        if (enemy.reachedEnd) {
            blocked.push(enemy);
            continue;
        }
        
        // 计算敌人到其所属路径A城的距离
        const distToA = Math.sqrt(
            (enemy.x - enemy.pathData.A.x) ** 2 +
            (enemy.y - enemy.pathData.A.y) ** 2
        );
        
        // ★ 放宽：敌人进入A城范围内(1.1格)即拦截
        //       不强制要求 pathProgress 到终点，捕获正在逼近的敌人
        if (distToA <= 1.1) {
            blocked.push(enemy);
        }
    }
    
    // 批量格挡
    if (blocked.length > 0) {
        const count = blocked.length;
        blocked.forEach(e => { 
            e.shouldRemove = true; 
            e._blockedByScanner = true; 
        });
        battleState.energy = Math.min(CONFIG.MAX_ENERGY, battleState.energy + count);
        battleState.stats.enemiesBlocked += count;
        ASSETS.play('block');
        showToast(`⚔️ 守卫格挡！消灭 ${count} 个敌人！+${count}⚡`);
        updateUI();
        updateButtonStates();
    }
}

// ===== checkArrivalEffects：到达A城时消灭附近敌人 =====
function checkArrivalEffects() {
    const px = Math.round(battleState.playerPos.x);
    const py = Math.round(battleState.playerPos.y);
    
    // 到达A城时自动消灭该处及附近所有小兵（防止时序竞争导致漏怪）
    if (isCityANode(px, py)) {
        // 精确在同一个A城节点的小兵
        const enemiesHere = battleState.enemies.filter(e => 
            Math.round(e.x) === px && Math.round(e.y) === py && !e.reachedEnd && !e.shouldRemove
        );
        
        // 附近接近A城的小兵（距离≤2格且正朝A城移动，防止同帧到达的漏网之鱼）
        const nearbyEnemies = battleState.enemies.filter(e => {
            if (e.reachedEnd || e.shouldRemove) return false;
            // 检查是否靠近任意一个A城节点
            const aNodes = [
                MAP_DATA.leftPath.A,
                MAP_DATA.middlePath.A,
                MAP_DATA.rightPath.A
            ];
            return aNodes.some(a => {
                const dist = Math.sqrt((e.x - a.x) ** 2 + (e.y - a.y) ** 2);
                return dist <= 2 && e.pathProgress >= e.pathData.nodes.length - 1;
            });
        }).filter(e => !(Math.round(e.x) === px && Math.round(e.y) === py)); // 去重
        
        const allTargets = [...enemiesHere, ...nearbyEnemies];
        
        if (allTargets.length > 0) {
            const count = allTargets.length;
            allTargets.forEach(enemy => {
                enemy.shouldRemove = true;
            });
            
            battleState.energy = Math.min(CONFIG.MAX_ENERGY, battleState.energy + count);
            battleState.stats.enemiesBlocked += count;
            
            ASSETS.play('block');
            showToast(`⚔️ 格挡成功！消灭 ${count} 个敌人！+${count}⚡`);
            updateUI();
            updateButtonStates();
        }
    }
}
// ============================================================
function spawnWave() {
    if (battleState.phase !== 'playing') return;
    
    battleState.waveCount++;
    
    // 随机选择一条竖路
    const paths = ['left', 'middle', 'right'];
    const selectedPath = paths[Math.floor(Math.random() * paths.length)];
    const pathData = MAP_DATA[selectedPath + 'Path'];
    
    // 生成第一个小兵
    setTimeout(() => spawnEnemy(pathData, selectedPath), 0);
    
    // 间隔生成第二个小兵
    setTimeout(() => spawnEnemy(pathData, selectedPath), CONFIG.ENEMY_SPAWN_GAP);
}

function spawnEnemy(pathData, pathName) {
    if (battleState.phase !== 'playing') return;
    
    const enemy = {
        id: battleState.nextEnemyId++,
        x: pathData.B.x,
        y: pathData.B.y,
        pathName: pathName,
        pathData: pathData,
        pathProgress: 0,      // 在路径上的进度(节点索引)
        subProgress: 0,       // 节点间插值进度
        reachedEnd: false,
        totalNodes: pathData.nodes.length + 1  // 总节点数(包括起点和终点)
    };
    
    battleState.enemies.push(enemy);
}

function updateEnemies(deltaTime) {
    for (const enemy of battleState.enemies) {
        if (enemy.reachedEnd) continue;
        
        // 计算移动速度
        enemy.subProgress += deltaTime / CONFIG.ENEMY_SPEED;
        
        // 推进到下一个节点
        while (enemy.subProgress >= 1 && enemy.pathProgress < enemy.totalNodes) {
            enemy.subProgress -= 1;
            enemy.pathProgress++;
            
            // 检查是否到达终点(A城)
            if (enemy.pathProgress >= enemy.totalNodes) {
                enemy.reachedEnd = true;
                enemy.x = enemy.pathData.A.x;
                enemy.y = enemy.pathData.A.y;
                
                handleEnemyReachA(enemy);
                break;
            }
            
            // 更新位置
            updateEnemyPosition(enemy);
        }
        
        // 插值更新位置
        if (!enemy.reachedEnd && enemy.pathProgress < enemy.pathData.nodes.length) {
            const prev = getPrevNodeInPath(enemy);
            const next = getNextNodeInPath(enemy);
            
            if (prev && next) {
                enemy.x = prev.x + (next.x - prev.x) * enemy.subProgress;
                enemy.y = prev.y + (next.y - prev.y) * enemy.subProgress;
            }
        }
    }
    
    // 清理已处理的小兵
    battleState.enemies = battleState.enemies.filter(e => !e.shouldRemove);
}

function getPrevNodeInPath(enemy) {
    if (enemy.pathProgress === 0) return enemy.pathData.B;
    return enemy.pathData.nodes[enemy.pathProgress - 1];
}

function getNextNodeInPath(enemy) {
    if (enemy.pathProgress >= enemy.pathData.nodes.length) return enemy.pathData.A;
    return enemy.pathData.nodes[enemy.pathProgress];
}

function updateEnemyPosition(enemy) {
    if (enemy.pathProgress <= 0) {
        enemy.x = enemy.pathData.B.x;
        enemy.y = enemy.pathData.B.y;
    } else if (enemy.pathProgress >= enemy.pathData.nodes.length) {
        enemy.x = enemy.pathData.A.x;
        enemy.y = enemy.pathData.A.y;
    } else {
        const node = enemy.pathData.nodes[enemy.pathProgress - 1] || enemy.pathData.B;
        enemy.x = node.x;
        enemy.y = node.y;
    }
}

function handleEnemyReachA(enemy) {
    // ★ 防重复：已被扫描器格挡的敌人不再二次处理
    if (enemy._blockedByScanner) return;
    
    // ★ 修复：只检查赵云是否在敌人所属路径的A城（±0.5格容差）
    const px = battleState.playerPos.x;
    const py = battleState.playerPos.y;
    const eps = 0.5;
    const targetA = enemy.pathData.A;
    const playerAtSameA = Math.abs(px - targetA.x) < eps && Math.abs(py - targetA.y) < eps;
    
    if (playerAtSameA) {
        // 赵云在此守卫，自动消灭
        removeEnemy(enemy.id);
        battleState.energy = Math.min(CONFIG.MAX_ENERGY, battleState.energy + 1);
        battleState.stats.enemiesBlocked++;
        ASSETS.play('block');
        showToast(`⚔️ 自动格挡！+1⚡`);
        updateUI();
        updateButtonStates();
    } else {
        // 漏怪了！
        battleState.guardHealth--;
        battleState.stats.perfectDefense = false;
        removeEnemy(enemy.id);
        showToast(`❌ 敌人突破了防线！守护值 -1 (剩余 ${battleState.guardHealth})`);
        updateUI();
        
        // 检查失败条件
        if (battleState.guardHealth <= 0) {
            endGame(false, '城池守护值归零！');
        }
    }
}

function removeEnemy(id) {
    const idx = battleState.enemies.findIndex(e => e.id === id);
    if (idx !== -1) {
        battleState.enemies[idx].shouldRemove = true;
    }
}

function hasEnemyAt(x, y) {
    return battleState.enemies.some(e => 
        !e.reachedEnd && 
        !e.shouldRemove &&
        Math.round(e.x) === x && 
        Math.round(e.y) === y
    );
}

// ============================================================
// 战斗系统
// ============================================================
function handleAttack() {
    if (battleState.phase !== 'playing') return;
    
    // 检查是否在B城
    const px = Math.round(battleState.playerPos.x);
    const py = Math.round(battleState.playerPos.y);
    
    if (!isCityBNode(px, py)) {
        showToast('需要先移动到B城才能进攻！');
        return;
    }
    
    // 执行攻击
    let damage = CONFIG.ATTACK_DAMAGE;
    if (battleState.isSkillActive) {
        damage = CONFIG.SKILL_ATTACK_DAMAGE;
    }
    
    battleState.bossHP = Math.max(0, battleState.bossHP - damage);
    battleState.attackCount++;
    battleState.stats.attacksMade++;
    battleState.energy = Math.min(CONFIG.MAX_ENERGY, battleState.energy + 1);
    
    ASSETS.play('attack');
    showToast(`⚔️ 攻击成功！B城 -${damage} HP！+1⚡`);
    updateUI();
    updateButtonStates();
    if (battleState.attackCount >= CONFIG.VICTORY_ATTACKS && battleState.guardHealth > 0) {
        endGame(true, '成功攻破敌营！');
    }
}

function activateSkill() {
    if (battleState.phase !== 'playing') return;
    if (battleState.energy < CONFIG.MAX_ENERGY) return;
    if (Date.now() < battleState.skillCooldownUntil) return;
    
    // 激活技能
    battleState.isSkillActive = true;
    battleState.skillEndTime = Date.now() + CONFIG.SKILL_DURATION;
    battleState.energy = 0;
    battleState.stats.skillUsed++;
    
    // 显示特效
    ASSETS.play('skill');
    showSkillEffect(true);
    showToast('✨ 七进七出已激活！速度×2，可穿越敌人！');
    updateUI();
    updateButtonStates();
}

function updateSkill(deltaTime) {
    if (battleState.isSkillActive) {
        if (Date.now() >= battleState.skillEndTime) {
            // 技能结束
            battleState.isSkillActive = false;
            battleState.skillCooldownUntil = Date.now() + CONFIG.SKILL_COOLDOWN;
            showSkillEffect(false);
            showToast('技能效果结束，进入冷却...');
            updateButtonStates();
        }
    }
}

// ★ 玩家与小兵碰撞检测
function checkPlayerEnemyCollision() {
    // 普通移动中跳过碰撞检测（避免频繁触发）
    // 但技能激活时允许移动中碰撞（实现"穿过去也撞飞"）
    if (battleState.isMoving && !battleState.isSkillActive) return;
    
    const now = Date.now();
    if (now - battleState.lastCollisionTime < CONFIG.COLLISION_COOLDOWN) return;  // 冷却中
    
    const px = battleState.playerPos.x;
    const py = battleState.playerPos.y;
    const collisionRadius = CONFIG.COLLISION_RADIUS;
    
    for (const enemy of battleState.enemies) {
        if (enemy.reachedEnd || enemy.shouldRemove) continue;
        
        const dist = Math.sqrt((enemy.x - px) ** 2 + (enemy.y - py) ** 2);
        
        if (dist <= collisionRadius) {
            // ★ 触发碰撞！
            battleState.lastCollisionTime = now;
            
            if (battleState.isSkillActive) {
                // 技能状态：自动消灭小兵 + 加能量
                removeEnemy(enemy.id);
                battleState.energy = Math.min(CONFIG.MAX_ENERGY, battleState.energy + 1);
                battleState.stats.enemiesBlocked++;
                ASSETS.play('attack');
                showToast(`⚡ 技能撞飞敌人！+1⚡`);
                updateUI();
                updateButtonStates();
            } else {
                // 普通状态：扣守护值 + 提示
                battleState.guardHealth--;
                battleState.stats.perfectDefense = false;
                removeEnemy(enemy.id);
                showToast(`💥 遭遇敌袭！守护值 -1 (剩余 ${battleState.guardHealth})`);
                updateUI();
                
                // 检查失败条件
                if (battleState.guardHealth <= 0) {
                    endGame(false, '守护值归零！遭遇敌军围攻！');
                    return;
                }
            }
            
            break;  // 每次只处理一个碰撞
        }
    }
}

function showSkillEffect(active) {
    const effect = document.getElementById('skillEffect');
    if (active) {
        const px = ((battleState.playerPos.x + 0.5) / CONFIG.GRID_COLS) * 100;
        const py = ((battleState.playerPos.y + 0.5) / CONFIG.GRID_ROWS) * 100;
        effect.style.setProperty('--zx', px + '%');
        effect.style.setProperty('--zy', py + '%');
        effect.classList.add('active');
    } else {
        effect.classList.remove('active');
    }
}

// ============================================================
// 游戏循环
// ============================================================
function gameLoop(timestamp) {
    if (battleState.phase !== 'playing') return;
    
    const deltaTime = timestamp - battleState.lastTime;
    battleState.lastTime = timestamp;
    
    // 限制deltaTime防止跳帧
    const clampedDelta = Math.min(deltaTime, 100);
    
    // 更新各系统
    updateMovement(clampedDelta);
    updateEnemies(clampedDelta);
    updateSkill(clampedDelta);
    
    // ★ 碰撞检测
    checkPlayerEnemyCollision();
    
    // ★ 每帧格挡扫描：赵云在A城附近时自动拦截到达的小兵（补充handleEnemyReachA的时序竞争）
    scanAndBlockEnemiesNearA();
    
    // 出兵计时器
    if (timestamp - battleState.lastWaveTime >= CONFIG.WAVE_INTERVAL) {
        battleState.lastWaveTime = timestamp;
        spawnWave();
    }
    
    // 渲染画面
    render();
    
    // 继续循环
    gameLoopId = requestAnimationFrame(gameLoop);
}

// ============================================================
// 渲染系统
// ============================================================
function render() {
    const ctx = battleState.ctx;
    const canvas = battleState.canvas;
    const cs = battleState.cellSize;
    
    // 清空画布
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制背景网格(淡色)
    drawBackgroundGrid(ctx, canvas, cs);
    
    // 绘制路径连线
    drawPaths(ctx, cs);
    
    // 绘制节点
    drawNodes(ctx, cs);
    
    // 绘制城池
    drawCities(ctx, cs);
    
    // 绘制小兵
    drawEnemies(ctx, cs);
    
    // 绘制赵云
    drawPlayer(ctx, cs);
}

function drawBackgroundGrid(ctx, canvas, cs) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    
    // 竖线（列）
    for (let i = 0; i <= CONFIG.GRID_COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cs, 0);
        ctx.lineTo(i * cs, canvas.height);
        ctx.stroke();
    }
    
    // 横线（行）
    for (let i = 0; i <= CONFIG.GRID_ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * cs);
        ctx.lineTo(canvas.width, i * cs);
        ctx.stroke();
    }
}

function drawPaths(ctx, cs) {
    ctx.strokeStyle = 'rgba(100, 149, 237, 0.4)';
    ctx.lineWidth = Math.max(3, cs * 0.12);
    ctx.lineCap = 'round';
    
    // 绘制所有横向层
    MAP_DATA.horizontalLayers.forEach(layer => {
        drawPathLine(ctx, cs, layer.nodes);
    });
    
    // 绘制三条竖路
    drawFullPath(ctx, cs, MAP_DATA.leftPath);
    drawFullPath(ctx, cs, MAP_DATA.middlePath);
    drawFullPath(ctx, cs, MAP_DATA.rightPath);
}

function drawPathLine(ctx, cs, points) {
    if (points.length < 2) return;
    
    ctx.beginPath();
    ctx.moveTo((points[0].x + 0.5) * cs, (points[0].y + 0.5) * cs);
    for (let i = 1; i < points.length; i++) {
        ctx.lineTo((points[i].x + 0.5) * cs, (points[i].y + 0.5) * cs);
    }
    ctx.stroke();
}

function drawFullPath(ctx, cs, pathData) {
    const fullPath = [pathData.B, ...pathData.nodes, pathData.A];
    drawPathLine(ctx, cs, fullPath);
}

function drawNodes(ctx, cs) {
    const allNodes = getAllNodes();
    
    allNodes.forEach(node => {
        const x = (node.x + 0.5) * cs;
        const y = (node.y + 0.5) * cs;
        const radius = Math.max(4, cs * CONFIG.NODE_RADIUS);
        
        // 检查是否是城池节点
        if (isCityANode(node.x, node.y) || isCityBNode(node.x, node.y)) {
            return; // 城池单独绘制
        }
        
        // ★ 检查是否悬停
        const isHovered = hoveredNode && 
            hoveredNode.x === node.x && hoveredNode.y === node.y;
        
        if (isHovered) {
            // 悬停高亮：外发光 + 金色填充 + 脉冲动画
            ctx.save();
            
            // 外发光层
            const glowGradient = ctx.createRadialGradient(x, y, radius * 0.5, x, y, radius * 2.2);
            glowGradient.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
            glowGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.beginPath();
            ctx.arc(x, y, radius * 2.2, 0, Math.PI * 2);
            ctx.fillStyle = glowGradient;
            ctx.fill();
            
            // 金色节点主体（稍大）
            ctx.beginPath();
            ctx.arc(x, y, radius * 1.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            
            ctx.restore();
        } else {
            // 普通节点
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(144, 238, 144, 0.6)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(100, 200, 100, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    });
}

function drawCities(ctx, cs) {
    const cityEnemyImg = ASSETS.img.cityEnemy;
    const cityAllyImg = ASSETS.img.cityAlly;
    
    // 绘制B城(底部出兵点 - 敌方)
    const bCities = [
        MAP_DATA.leftPath.B,
        MAP_DATA.middlePath.B,
        MAP_DATA.rightPath.B
    ];
    
    bCities.forEach(city => {
        const x = (city.x + 0.5) * cs;
        const y = (city.y + 0.5) * cs;
        const size = Math.max(20, cs * 0.9);
        
        if (cityEnemyImg && cityEnemyImg.complete && cityEnemyImg.naturalWidth > 0) {
            // 绘制敌方城池图片
            ctx.save();
            ctx.translate(x, y);
            ctx.drawImage(cityEnemyImg, -size / 2, -size / 2, size, size);
            // 红色标签
            ctx.fillStyle = '#ff4444';
            ctx.font = `bold ${Math.max(10, cs * 0.18)}px Microsoft YaHei`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('B', 0, size / 2 + 4);
            ctx.restore();
        } else {
            // 降级：红圆圈
            ctx.beginPath();
            ctx.arc(x, y, Math.max(10, cs * 0.45), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(220, 53, 69, 0.7)';
            ctx.fill();
            ctx.strokeStyle = '#dc3545'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.max(10, cs * 0.2)}px Microsoft YaHei`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('B', x, y);
        }
    });
    
    // 绘制A城(顶部家/守护城 - 我方)
    const aCities = [
        { city: MAP_DATA.leftPath.A, label: 'A₁' },
        { city: MAP_DATA.middlePath.A, label: 'A₂' },
        { city: MAP_DATA.rightPath.A, label: 'A₃' }
    ];
    
    const uniqueACities = [];
    const seen = new Set();
    aCities.forEach(ac => {
        const key = `${ac.city.x},${ac.city.y}`;
        if (!seen.has(key)) { seen.add(key); uniqueACities.push(ac); }
    });
    
    uniqueACities.forEach(({ city, label }) => {
        const x = (city.x + 0.5) * cs;
        const y = (city.y + 0.5) * cs;
        const size = Math.max(20, cs * 0.9);
        
        if (cityAllyImg && cityAllyImg.complete && cityAllyImg.naturalWidth > 0) {
            // 绘制我方城池图片
            ctx.save();
            ctx.translate(x, y);
            ctx.drawImage(cityAllyImg, -size / 2, -size / 2, size, size);
            // 蓝色标签
            ctx.fillStyle = '#4fc3f7';
            ctx.font = `bold ${Math.max(10, cs * 0.18)}px Microsoft YaHei`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(label, 0, size / 2 + 4);
            ctx.restore();
        } else {
            // 降级：蓝圆圈
            ctx.beginPath();
            ctx.arc(x, y, Math.max(10, cs * 0.45), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(52, 152, 219, 0.7)';
            ctx.fill();
            ctx.strokeStyle = '#3498db'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.max(10, cs * 0.2)}px Microsoft YaHei`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y);
        }
    });
}

function drawEnemies(ctx, cs) {
    const enemyImg = ASSETS.img.enemy;
    battleState.enemies.forEach(enemy => {
        if (enemy.shouldRemove) return;
        
        const x = (enemy.x + 0.5) * cs;
        const y = (enemy.y + 0.5) * cs;
        const size = Math.max(12, cs * 0.64);
        
        ctx.save();
        
        if (enemyImg && enemyImg.complete && enemyImg.naturalWidth > 0) {
            // 图片已加载：绘制小兵图片（圆形裁切）
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(enemyImg, -size / 2, -size / 2, size, size);
            // 红色边框标识敌人
            ctx.strokeStyle = 'rgba(192, 57, 43, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // 降级：红色三角形
            ctx.translate(x, y);
            const r = Math.max(6, cs * 0.32);
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r * 0.87, r * 0.5);
            ctx.lineTo(-r * 0.87, r * 0.5);
            ctx.closePath();
            ctx.fillStyle = 'rgba(231, 76, 60, 0.85)';
            ctx.fill();
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        ctx.restore();
    });
}

function drawPlayer(ctx, cs) {
    let x = (battleState.playerPos.x + 0.5) * cs;
    let y = (battleState.playerPos.y + 0.5) * cs;
    const radius = Math.max(8, cs * 0.38);
    
    // ★ 跳跃弧度：hop阶段加y轴正弦偏移
    if (battleState.isMoving && battleState.movePhase === 'hop') {
        const jumpHeight = cs * 0.25; // 跳跃最大高度(像素)
        const arc = Math.sin(battleState.hopProgress * Math.PI);
        y -= arc * jumpHeight;
    }
    
    ctx.save();
    ctx.translate(x, y);
    
    // 技能激活时的光晕效果
    if (battleState.isSkillActive) {
        const gradient = ctx.createRadialGradient(0, 0, radius * 0.5, 0, 0, radius * 2);
        gradient.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
        gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
        
        ctx.beginPath();
        ctx.arc(0, 0, radius * 2, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
    }
    
    // ★ 用图片绘制赵云
    const sprite = ASSETS.img.player;
    const size = radius * 2;
    if (sprite && sprite.complete && sprite.naturalWidth > 0) {
        // 图片已加载，绘制圆形裁切效果
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
        // 边框
        ctx.strokeStyle = battleState.isSkillActive ? '#fff' : '#ffd700';
        ctx.lineWidth = 3;
        ctx.stroke();
    } else {
        // 图片未加载时，降级为原来的金圆圈
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        const playerGradient = ctx.createRadialGradient(0, -radius * 0.3, 0, 0, 0, radius);
        playerGradient.addColorStop(0, '#ffd700');
        playerGradient.addColorStop(1, '#ff8c00');
        ctx.fillStyle = playerGradient;
        ctx.fill();
        ctx.strokeStyle = battleState.isSkillActive ? '#fff' : '#b8860b';
        ctx.lineWidth = 3;
        ctx.stroke();
        // 枪形标识
        ctx.beginPath();
        ctx.moveTo(0, -radius * 0.5); ctx.lineTo(0, radius * 0.4);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-radius * 0.3, -radius * 0.2); ctx.lineTo(radius * 0.3, -radius * 0.2);
        ctx.stroke();
    }
    
    ctx.restore();
}

// ============================================================
// UI更新函数
// ============================================================
function updateTimer() {
    if (battleState.phase !== 'playing') return;
    
    battleState.timeLeft--;
    document.getElementById('timerDisplay').textContent = battleState.timeLeft;
    
    if (battleState.timeLeft <= 0) {
        if (battleState.attackCount >= CONFIG.VICTORY_ATTACKS && battleState.guardHealth > 0) {
            endGame(true, '时间耗尽但已完成任务！');
        } else {
            endGame(false, '时间耗尽！');
        }
    }
}

function updateUI() {
    document.getElementById('healthDisplay').textContent = battleState.guardHealth;
    document.getElementById('bossHealthDisplay').textContent = battleState.bossHP;
    document.getElementById('energyDisplay').textContent = `${battleState.energy}/${CONFIG.MAX_ENERGY}`;
    document.getElementById('attackCountDisplay').textContent = `${battleState.attackCount}/${CONFIG.VICTORY_ATTACKS}`;
}

function updateButtonStates() {
    const attackBtn = document.getElementById('attackBtn');
    const skillBtn = document.getElementById('skillBtn');
    
    // ★ 动态同步按钮文案与CONFIG
    if (attackBtn) attackBtn.textContent = `进攻B城 (-${CONFIG.ATTACK_DAMAGE})`;
    
    const px = Math.round(battleState.playerPos.x);
    const py = Math.round(battleState.playerPos.y);
    
    // 进攻按钮状态
    attackBtn.disabled = !(isCityBNode(px, py) && battleState.phase === 'playing' && 
                          battleState.attackCount < CONFIG.VICTORY_ATTACKS);
    
    // 技能按钮状态
    const canUseSkill = battleState.energy >= CONFIG.MAX_ENERGY && 
                       Date.now() >= battleState.skillCooldownUntil &&
                       battleState.phase === 'playing';
    
    skillBtn.disabled = !canUseSkill;
    
    if (canUseSkill) {
        skillBtn.className = 'action-btn skill-btn ready';
        skillBtn.textContent = '七进七出 [就绪!]';
    } else if (Date.now() < battleState.skillCooldownUntil) {
        const cdRemaining = Math.ceil((battleState.skillCooldownUntil - Date.now()) / 1000);
        skillBtn.className = 'action-btn skill-btn';
        skillBtn.textContent = `七进七出 [冷却 ${cdRemaining}s]`;
    } else {
        skillBtn.className = 'action-btn skill-btn';
        skillBtn.textContent = `七进七出 [${battleState.energy}/${CONFIG.MAX_ENERGY}]`;
    }
}

// ============================================================
// 工具函数
// ============================================================
function getAllNodes() {
    const nodes = [];
    
    // 所有横向层节点
    MAP_DATA.horizontalLayers.forEach(layer => {
        layer.nodes.forEach(n => nodes.push(n));
    });
    
    // 三条竖路节点（含B城和A城）
    nodes.push(MAP_DATA.leftPath.B, ...MAP_DATA.leftPath.nodes, MAP_DATA.leftPath.A);
    nodes.push(MAP_DATA.middlePath.B, ...MAP_DATA.middlePath.nodes, MAP_DATA.middlePath.A);
    nodes.push(MAP_DATA.rightPath.B, ...MAP_DATA.rightPath.nodes, MAP_DATA.rightPath.A);
    
    // 去重
    const unique = [];
    const seen = new Set();
    nodes.forEach(n => {
        const key = `${n.x},${n.y}`;
        if (!seen.has(key)) {
            seen.add(key);
            unique.push(n);
        }
    });
    
    return unique;
}

function findNodeAt(gridX, gridY) {
    const allNodes = getAllNodes();
    const radius = CONFIG.CLICK_RADIUS || 1.0;
    // ★ 宽松匹配：在半径范围内的节点都算点到（距离判定）
    let closest = null;
    let closestDist = radius;
    for (const n of allNodes) {
        const dist = Math.sqrt((n.x - gridX) ** 2 + (n.y - gridY) ** 2);
        if (dist <= closestDist) {
            closestDist = dist;
            closest = n;
        }
    }
    return closest;
}

function isCityANode(x, y) {
    // ★ 容差匹配：允许±0.5格浮点偏差，精确判定是否站在A城本体上
    const eps = 0.5;
    const aNodes = [MAP_DATA.leftPath.A, MAP_DATA.middlePath.A, MAP_DATA.rightPath.A];
    return aNodes.some(a => Math.abs(x - a.x) < eps && Math.abs(y - a.y) < eps);
}

function isCityBNode(x, y) {
    return (x === MAP_DATA.leftPath.B.x && y === MAP_DATA.leftPath.B.y) ||
           (x === MAP_DATA.middlePath.B.x && y === MAP_DATA.middlePath.B.y) ||
           (x === MAP_DATA.rightPath.B.x && y === MAP_DATA.rightPath.B.y);
}

function showToast(message) {
    // 移除已有的toast
    const existingToast = document.querySelector('.toast');
    if (existingToast) existingToast.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => toast.remove(), 1500);
}

// ============================================================
// 游戏结束与结果展示
// ============================================================
function endGame(isVictory, reason) {
    battleState.phase = isVictory ? 'victory' : 'defeat';
    
    ASSETS.play(isVictory ? 'victory' : 'defeat');
    
    // 停止所有定时器和动画
    cancelAnimationFrame(gameLoopId);
    clearInterval(timerInterval);
    
    // 计算阶梯式奖励
    const reward = calculateReward(isVictory);
    
    // 延迟显示结果(让玩家看到最后一帧)
    setTimeout(() => showResult(isVictory, reason, reward), 500);
}

function calculateReward(isVictory) {
    if (!isVictory) {
        return {
            courage: 0,
            defense: 0,
            rank: '败北',
            comment: '胜败乃兵家常事，大侠请重新来过！'
        };
    }
    
    // 阶梯式评分标准
    const stats = battleState.stats;
    let rank, courage, defense, comment;
    
    // 完美评价
    if (stats.perfectDefense && battleState.timeLeft >= 120) {
        rank = '⭐⭐⭐ 完美通关';
        courage = 3;
        defense = 3;
        comment = '神勇无双！将军真乃当世虎将！';
    }
    // 优秀评价
    else if (stats.perfectDefense && battleState.timeLeft >= 60) {
        rank = '⭐⭐ 优秀';
        courage = 2;
        defense = 2;
        comment = '表现出色！攻防兼备，深得用兵之道！';
    }
    // 良好评价
    else if (battleState.guardHealth >= 3 && battleState.attackCount >= CONFIG.VICTORY_ATTACKS) {
        rank = '⭐ 良好';
        courage = 2;
        defense = 1;
        comment = '不错！基本完成了战略目标！';
    }
    // 及格评价
    else if (battleState.guardHealth >= 1) {
        rank = '及格';
        courage = 1;
        defense = 1;
        comment = '险胜！虽然艰难，但最终完成了使命！';
    }
    // 勉强通过
    else {
        rank = '勉强';
        courage = 1;
        defense = 0;
        comment = '惊险过关！还需多加练习！';
    }
    
    return { courage, defense, rank, comment };
}

function showResult(isVictory, reason, reward) {
    const overlay = document.getElementById('resultOverlay');
    const card = document.getElementById('resultCard');
    const title = document.getElementById('resultTitle');
    const stats = document.getElementById('resultStats');
    const rewardDisp = document.getElementById('rewardDisplay');
    
    // 显示弹窗
    overlay.style.display = 'flex';
    
    // 标题
    title.textContent = isVictory ? '🎉 大获全胜！' : '💔 战败';
    title.className = `result-title ${isVictory ? 'victory' : 'defeat'}`;
    
    card.className = `result-card ${isVictory ? 'victory' : 'defeat'}`;
    
    // 详细统计
    stats.innerHTML = `
        <div class="result-stat-row"><span>⏱️ 剩余时间</span><span>${battleState.timeLeft}秒</span></div>
        <div class="result-stat-row"><span>❤️ 剩余守护值</span><span>${battleState.guardHealth}</span></div>
        <div class="result-stat-row"><span>🗡️ 攻击次数</span><span>${battleState.attackCount}/${CONFIG.VICTORY_ATTACKS}</span></div>
        <div class="result-stat-row"><span>🛡️ 格挡次数</span><span>${battleState.stats.enemiesBlocked}</span></div>
        <div class="result-stat-row"><span>✨ 技能使用</span><span>${battleState.stats.skillUsed}次</span></div>
        <div class="result-stat-row"><span>📊 评价等级</span><span style="color:#ffd700">${reward.rank}</span></div>
    `;
    
    // 奖励显示
    rewardDisp.innerHTML = `
        🗡️ 勇气 +${reward.courage}<br>
        🛡️ 守护 +${reward.defense}
    `;
    
    // 保存结果供后续使用
    battleState.finalReward = reward;
}

// ============================================================
// 页面跳转与数据保存
// ============================================================
function goToNextAct() {
    // 保存游戏结果
    const reward = battleState.finalReward || { courage: 0, defense: 0 };
    
    try {
        // 保存赵云线第4幕的进度
        saveZhaoState({
            act4_result: {
                victory: battleState.phase === 'victory',
                timeLeft: battleState.timeLeft,
                guardHealth: battleState.guardHealth,
                attackCount: battleState.attackCount,
                enemiesBlocked: battleState.stats.enemiesBlocked,
                skillUsed: battleState.stats.skillUsed,
                courage_reward: reward.courage,
                defense_reward: reward.defense,
                rank: reward.rank
            }
        });
        
        // 调用common.js的通用保存函数
        if (typeof saveProgress === 'function') {
            saveProgress('zhaoYun', 4);
        }
    } catch (e) {
        console.warn('保存进度失败:', e);
    }
    
    // 跳转到下一幕
    window.location.href = 'zhao_yun_act5_quiz.html';
}

function saveZhaoState(data) {
    // 使用localStorage保存赵云线特定数据
    try {
        const existing = JSON.parse(localStorage.getItem('zhaoYun_state') || '{}');
        Object.assign(existing, data);
        localStorage.setItem('zhaoYun_state', JSON.stringify(existing));
    } catch (e) {
        console.warn('无法保存赵云状态:', e);
    }
}

// ============================================================
// 启动初始化
// ============================================================
window.onload = initGame;

// 清理函数(页面卸载时)
window.onbeforeunload = function() {
    if (gameLoopId) cancelAnimationFrame(gameLoopId);
    if (timerInterval) clearInterval(timerInterval);
};
</script>
